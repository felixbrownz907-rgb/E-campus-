<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses | E-Campus</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #111827;
            line-height: 1.6;
        }

        .page-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-logo { width: 52px; height: 52px; object-fit: contain; }
        .brand-text h1 { font-size: 22px; }
        .brand-text p { color: #b58b17; font-weight: 600; font-size: 14px; }

        .back-button {
            border: none;
            background: #111827;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-button:hover { background: #1f2937; }

        .page-container { max-width: 1000px; margin: 0 auto; padding: 30px 20px 60px; }

        .page-title { margin-bottom: 25px; }
        .page-title .label { color: #b58b17; font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .page-title h2 { font-size: 30px; margin-bottom: 8px; }
        .page-title p { color: #6b7280; font-size: 15px; }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }

        .stat-card .number { font-size: 26px; font-weight: 800; }
        .stat-card .label { color: #6b7280; font-size: 12px; margin-top: 4px; }

        .course-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .course-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .course-code { color: #b58b17; font-weight: 800; font-size: 12px; letter-spacing: 1px; }
        .course-header h4 { font-size: 18px; margin: 4px 0; }
        .course-meta { color: #6b7280; font-size: 13px; }

        .progress-bar-bg {
            background: #e5e7eb;
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill { background: #b58b17; height: 100%; }

        .expand-icon { font-size: 20px; color: #6b7280; }

        .course-body {
            display: none;
            padding: 0 20px 20px;
            border-top: 1px solid #e5e7eb;
        }

        .course-body.open { display: block; }

        .module-block { margin-top: 16px; }
        .module-block h5 { font-size: 15px; margin-bottom: 8px; color: #111827; }

        .lesson-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .lesson-row.done { background: #ecfdf5; }
        .lesson-title { font-size: 14px; }
        .lesson-check { font-size: 16px; }

        .lesson-content-panel {
            display: none;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 10px;
            padding: 16px;
            margin: 6px 0 10px;
            font-size: 14px;
        }

        .lesson-content-panel.open { display: block; }
        .lesson-content-panel h6 { margin-bottom: 8px; }
        .lesson-content-panel p { margin-bottom: 10px; color: #374151; white-space: pre-wrap; }

        .complete-button {
            background: #111827;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .complete-button:disabled { opacity: 0.6; cursor: not-allowed; }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            background: #e8f5e9;
            color: #166534;
        }

        .status.completed { background: #dbeafe; color: #1d4ed8; }
        .status.dropped { background: #fee2e2; color: #b91c1c; }

        .loading, .empty-state, .error-state {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
        }

        .loading-icon, .empty-icon, .error-icon { font-size: 38px; margin-bottom: 10px; }
        .loading p, .empty-state p, .error-state p { color: #6b7280; }
        .error-state { border-color: #fecaca; }
        .error-state h4 { color: #b91c1c; margin-bottom: 5px; }

        .footer { background: #111827; color: white; padding: 25px 20px; text-align: center; }
        .footer p { color: #d1d5db; font-size: 13px; }

        @media (max-width: 700px) {
            .stats { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header class="page-header">
        <div class="brand">
            <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="brand-logo">
            <div class="brand-text">
                <h1>E-Campus</h1>
                <p>Sunningdale University</p>
            </div>
        </div>
        <button class="back-button" onclick="window.location.href='student-dashboard.html'">← Dashboard</button>
    </header>


    <main class="page-container">

        <section class="page-title">
            <div class="label">Student Portal</div>
            <h2>My Courses</h2>
            <p>Open a course to view its modules and lessons, and mark lessons as complete.</p>
        </section>

        <section class="stats">
            <div class="stat-card"><div class="number" id="totalCourses">0</div><div class="label">Registered Courses</div></div>
            <div class="stat-card"><div class="number" id="completedLessonsCount">0</div><div class="label">Lessons Completed</div></div>
            <div class="stat-card"><div class="number" id="overallProgress">0%</div><div class="label">Overall Progress</div></div>
        </section>

        <div id="coursesContainer">
            <div class="loading">
                <div class="loading-icon">⏳</div>
                <p>Loading your courses...</p>
            </div>
        </div>

    </main>


    <footer class="footer">
        <p>© 2026 Sunningdale University. All rights reserved.</p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>


    <script>

        let studentProfileId = null;
        let authUserId = null;
        let allModules = [];
        let allLessons = [];
        let completedLessonIds = new Set();


        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function getStatusClass(status) {
            const value = String(status || "").toLowerCase();
            if (value === "completed") return "completed";
            if (value === "dropped" || value === "cancelled") return "dropped";
            return "";
        }


        document.addEventListener("DOMContentLoaded", loadCourses);


        async function loadCourses() {

            const container = document.getElementById("coursesContainer");

            try {

                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

                if (authError || !user) {
                    container.innerHTML = `
                        <div class="error-state">
                            <div class="error-icon">🔐</div>
                            <h4>Student login required</h4>
                            <p>Please log in to view your registered courses.</p>
                        </div>
                    `;
                    return;
                }

                authUserId = user.id;

                const { data: studentProfile, error: studentError } =
                    await supabaseClient
                        .from("student_profiles")
                        .select("id")
                        .eq("user_id", user.id)
                        .single();

                if (studentError || !studentProfile) {
                    container.innerHTML = `
                        <div class="error-state">
                            <div class="error-icon">⚠️</div>
                            <h4>Unable to load your student record</h4>
                            <p>${escapeHtml(studentError?.message || "Profile not found.")}</p>
                        </div>
                    `;
                    return;
                }

                studentProfileId = studentProfile.id;

                const { data: enrollments, error: enrollError } =
                    await supabaseClient
                        .from("enrollments")
                        .select(`
                            id, status, final_grade, final_score,
                            course:courses ( id, code, name, description, credits, course_type )
                        `)
                        .eq("student_id", studentProfileId)
                        .order("enrollment_date", { ascending: false });

                if (enrollError) throw enrollError;

                document.getElementById("totalCourses").textContent = (enrollments || []).length;

                if (!enrollments || enrollments.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📚</div>
                            <h4>No registered courses</h4>
                            <p>You currently have no courses registered.</p>
                        </div>
                    `;
                    return;
                }

                const courseIds = enrollments.map(e => e.course?.id).filter(Boolean);

                const { data: modules } = await supabaseClient
                    .from("course_modules")
                    .select("id, course_id, module_number, title")
                    .in("course_id", courseIds)
                    .order("module_number");

                allModules = modules || [];
                const moduleIds = allModules.map(m => m.id);

                let lessons = [];
                if (moduleIds.length > 0) {
                    const { data } = await supabaseClient
                        .from("lessons")
                        .select("id, module_id, lesson_number, title, description, content, estimated_hours")
                        .in("module_id", moduleIds)
                        .order("lesson_number");
                    lessons = data || [];
                }
                allLessons = lessons;

                const lessonIds = allLessons.map(l => l.id);

                let progress = [];
                if (lessonIds.length > 0) {
                    const { data } = await supabaseClient
                        .from("lesson_progress")
                        .select("lesson_id, status")
                        .eq("student_id", authUserId)
                        .in("lesson_id", lessonIds);
                    progress = data || [];
                }

                completedLessonIds = new Set(
                    progress.filter(p => p.status === "completed").map(p => p.lesson_id)
                );

                document.getElementById("completedLessonsCount").textContent = completedLessonIds.size;
                const overallPct = allLessons.length > 0
                    ? Math.round((completedLessonIds.size / allLessons.length) * 100)
                    : 0;
                document.getElementById("overallProgress").textContent = overallPct + "%";

                renderCourses(enrollments);

            } catch (error) {

                console.error("loadCourses failed:", error);
                container.innerHTML = `
                    <div class="error-state">
                        <div class="error-icon">⚠️</div>
                        <h4>Unable to load courses</h4>
                        <p>${escapeHtml(error.message || "An unexpected error occurred.")}</p>
                    </div>
                `;

            }

        }


        function renderCourses(enrollments) {

            const container = document.getElementById("coursesContainer");
            container.innerHTML = "";

            enrollments.forEach((enrollment, index) => {

                const course = enrollment.course;
                if (!course) return;

                const courseModules = allModules
                    .filter(m => m.course_id === course.id)
                    .sort((a, b) => a.module_number - b.module_number);

                const courseLessons = allLessons.filter(l =>
                    courseModules.some(m => m.id === l.module_id)
                );

                const completedInCourse = courseLessons.filter(l => completedLessonIds.has(l.id)).length;
                const pct = courseLessons.length > 0
                    ? Math.round((completedInCourse / courseLessons.length) * 100)
                    : 0;

                const status = String(enrollment.status || "active");
                const statusClass = getStatusClass(status);

                const card = document.createElement("article");
                card.className = "course-card";

                card.innerHTML = `
                    <div class="course-header" onclick="toggleCourse(${index})">
                        <div style="flex:1;">
                            <div class="course-code">${escapeHtml(course.code)}</div>
                            <h4>${escapeHtml(course.name)}</h4>
                            <div class="course-meta">
                                ${completedInCourse} of ${courseLessons.length} lessons completed •
                                <span class="status ${statusClass}">${escapeHtml(status)}</span>
                            </div>
                            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
                        </div>
                        <div class="expand-icon" id="icon-${index}">▼</div>
                    </div>
                    <div class="course-body" id="body-${index}">
                        ${renderModules(courseModules, index)}
                    </div>
                `;

                container.appendChild(card);

            });

        }


        function renderModules(courseModules, courseIndex) {

            if (courseModules.length === 0) {
                return `<p style="color:#9ca3af; padding:14px 0;">No modules have been added to this course yet.</p>`;
            }

            let html = "";

            courseModules.forEach(module => {

                const moduleLessons = allLessons
                    .filter(l => l.module_id === module.id)
                    .sort((a, b) => a.lesson_number - b.lesson_number);

                html += `<div class="module-block"><h5>Module ${module.module_number} — ${escapeHtml(module.title)}</h5>`;

                if (moduleLessons.length === 0) {
                    html += `<p style="color:#9ca3af; font-size:13px;">No lessons added yet.</p>`;
                } else {
                    moduleLessons.forEach(lesson => {

                        const done = completedLessonIds.has(lesson.id);

                        html += `
                            <div class="lesson-row ${done ? "done" : ""}" onclick="toggleLesson('${lesson.id}')">
                                <span class="lesson-title">${done ? "✅" : "⬜"} Lesson ${lesson.lesson_number} — ${escapeHtml(lesson.title)}</span>
                                <span class="lesson-check">›</span>
                            </div>
                            <div class="lesson-content-panel" id="panel-${lesson.id}">
                                <h6>${escapeHtml(lesson.title)}</h6>
                                <p>${escapeHtml(lesson.description || "No description provided.")}</p>
                                ${lesson.content ? `<p>${escapeHtml(lesson.content)}</p>` : ""}
                                <button class="complete-button" id="btn-${lesson.id}" onclick="event.stopPropagation(); markComplete('${lesson.id}')" ${done ? "disabled" : ""}>
                                    ${done ? "✓ Completed" : "Mark as Complete"}
                                </button>
                            </div>
                        `;

                    });
                }

                html += `</div>`;

            });

            return html;

        }


        function toggleCourse(index) {

            const body = document.getElementById(`body-${index}`);
            const icon = document.getElementById(`icon-${index}`);

            const isOpen = body.classList.toggle("open");
            icon.textContent = isOpen ? "▲" : "▼";

        }


        function toggleLesson(lessonId) {

            const panel = document.getElementById(`panel-${lessonId}`);
            panel.classList.toggle("open");

        }


        async function markComplete(lessonId) {

            const button = document.getElementById(`btn-${lessonId}`);
            button.disabled = true;
            button.textContent = "Saving...";

            const { error } = await supabaseClient
                .from("lesson_progress")
                .upsert({
                    student_id: authUserId,
                    lesson_id: lessonId,
                    status: "completed",
                    completed_at: new Date().toISOString()
                }, { onConflict: "student_id,lesson_id" });

            if (error) {
                console.error(error);
                alert("Unable to mark lesson complete: " + error.message);
                button.disabled = false;
                button.textContent = "Mark as Complete";
                return;
            }

            await loadCourses();

        }

    </script>

</body>
</html>
