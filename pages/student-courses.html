<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Lessons | E-Campus</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #111827; color: white; padding: 18px 25px; display: flex; align-items: center; gap: 14px; }
.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.header h1 { font-size: 22px; }
.header p { color: #d4af37; font-size: 13px; margin-top: 3px; }
.back-button { margin-left: auto; background: #d4af37; color: #111827; text-decoration: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; }

.container { max-width: 950px; margin: 25px auto; padding: 0 20px; }

.page-title { margin-bottom: 20px; }
.page-title h2 { font-size: 28px; margin-bottom: 6px; }
.page-title p { color: #6b7280; font-size: 14px; }

.term-note {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1d4ed8;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
    font-weight: bold;
}

.course-card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.course-card h3 { font-size: 17px; margin-bottom: 6px; }
.course-meta { font-size: 12px; color: #6b7280; margin-bottom: 12px; }

.progress-bar-bg { background: #e5e7eb; border-radius: 20px; height: 10px; overflow: hidden; margin: 8px 0 14px; }
.progress-bar-fill { background: #d4af37; height: 100%; }

.module-block { margin-bottom: 14px; }
.module-block h4 { font-size: 14px; margin-bottom: 8px; color: #111827; }

.lesson-row {
    display: block;
    width: 100%;
    text-align: left;
    background: white;
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 6px;
    color: #172033;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
}

.lesson-row:hover { background: #f9fafb; }
.lesson-row .lesson-title { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.lesson-row .lesson-left { display: flex; align-items: center; gap: 8px; }
.lesson-row .check { font-size: 15px; }
.lesson-row .toggle-arrow { color: #9ca3af; font-size: 12px; }

.lesson-content-panel {
    display: none;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 16px;
    margin: -6px 0 6px;
    font-size: 13px;
    line-height: 1.6;
}

.lesson-content-panel.open { display: block; }

.lesson-content-panel .section-label { font-weight: bold; color: #111827; margin: 12px 0 4px; font-size: 12px; }
.lesson-content-panel .section-label:first-child { margin-top: 0; }
.lesson-content-panel p { margin-bottom: 8px; white-space: pre-wrap; }

.lesson-video-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    margin-bottom: 12px;
    border-radius: 8px;
    overflow: hidden;
    background: #111827;
}

.lesson-video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
}

.mark-complete-button {
    background: #166534;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.mark-complete-button:disabled { opacity: 0.6; cursor: not-allowed; background: #6b7280; }

.empty-note { color: #9ca3af; text-align: center; padding: 30px 0; }

</style>
</head>


<body>

<header class="header">
    <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
    <div>
        <h1>E-Campus</h1>
        <p>Sunningdale University</p>
    </div>
    <a href="student-dashboard.html" class="back-button">← Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>My Lessons</h2>
        <p>Your courses for the current term only — tap any lesson to open it right here.</p>
    </section>

    <div id="termNoteContainer"></div>

    <div id="coursesContainer"><p class="empty-note">Loading...</p></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

let authUserId = null;
let completedLessonIds = new Set();
let lessonsById = {};

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getYouTubeEmbedUrl(url) {

    if (!url) return null;

    const watchMatch = url.match(/[?&]v=([^&]+)/);
    if (watchMatch) return `https://www.youtube.com/embed/${watchMatch[1]}`;

    const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
    if (shortMatch) return `https://www.youtube.com/embed/${shortMatch[1]}`;

    if (url.includes("youtube.com/embed/")) return url;

    return null;

}


async function getCurrentAcademicTermInfo(studentProfileId) {

    const { data: terms } =
        await supabaseClient
            .from("student_terms")
            .select("*")
            .eq("student_id", studentProfileId)
            .order("term_number", { ascending: true });

    const allTerms = terms || [];
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const activeTerm = allTerms.find(t => {
        const start = new Date(t.start_date + "T00:00:00");
        const end = new Date(t.end_date + "T00:00:00");
        return today >= start && today <= end;
    });

    const mostRecentEndedTerm = allTerms
        .filter(t => new Date(t.end_date + "T00:00:00") < today)
        .sort((a, b) => new Date(b.end_date) - new Date(a.end_date))[0];

    const relevantStudentTerm = activeTerm || mostRecentEndedTerm;

    if (!relevantStudentTerm) return { termNumber: null, academicTermId: null };

    const { data: academicTermRow } =
        await supabaseClient
            .from("academic_terms")
            .select("id")
            .eq("term_number", relevantStudentTerm.term_number)
            .limit(1)
            .maybeSingle();

    return {
        termNumber: relevantStudentTerm.term_number,
        academicTermId: academicTermRow ? academicTermRow.id : null
    };

}


async function startPage() {

    const container = document.getElementById("coursesContainer");

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "student-login.html";
        return;
    }

    authUserId = user.id;

    const { data: studentProfile } =
        await supabaseClient.from("student_profiles").select("id").eq("user_id", user.id).single();

    if (!studentProfile) {
        container.innerHTML = `<p class="empty-note">Unable to load your student profile.</p>`;
        return;
    }

    const { academicTermId, termNumber } = await getCurrentAcademicTermInfo(studentProfile.id);

    if (!academicTermId) {
        document.getElementById("termNoteContainer").innerHTML = `
            <div class="term-note">⚠️ No current term could be determined for your account. Contact admin if courses are missing.</div>
        `;
    } else {
        document.getElementById("termNoteContainer").innerHTML = `
            <div class="term-note">📅 Showing courses registered for Term ${termNumber} only.</div>
        `;
    }

    let enrollmentQuery = supabaseClient
        .from("enrollments")
        .select("courses ( id, code, name, credits )")
        .eq("student_id", studentProfile.id)
        .eq("status", "enrolled");

    if (academicTermId) {
        enrollmentQuery = enrollmentQuery.eq("academic_term_id", academicTermId);
    }

    const { data: enrollments } = await enrollmentQuery;

    const courses = (enrollments || []).map(e => e.courses).filter(Boolean);

    if (courses.length === 0) {
        container.innerHTML = `<p class="empty-note">You are not registered for any courses this term yet. <a href="student-register-courses.html">Register for courses</a> to get started.</p>`;
        return;
    }

    const courseIds = courses.map(c => c.id);

    const { data: modules } =
        await supabaseClient
            .from("course_modules")
            .select("id, course_id, module_number, title")
            .in("course_id", courseIds)
            .order("module_number");

    const moduleIds = (modules || []).map(m => m.id);

    const { data: lessons } =
        moduleIds.length > 0
            ? await supabaseClient.from("lessons").select("*").in("module_id", moduleIds).order("lesson_number")
            : { data: [] };

    (lessons || []).forEach(l => { lessonsById[l.id] = l; });

    const lessonIds = (lessons || []).map(l => l.id);

    const { data: progressRows } =
        lessonIds.length > 0
            ? await supabaseClient.from("lesson_progress").select("lesson_id, status").eq("student_id", user.id).in("lesson_id", lessonIds)
            : { data: [] };

    completedLessonIds = new Set((progressRows || []).filter(p => p.status === "completed").map(p => p.lesson_id));

    const modulesByCourse = {};
    (modules || []).forEach(m => {
        if (!modulesByCourse[m.course_id]) modulesByCourse[m.course_id] = [];
        modulesByCourse[m.course_id].push(m);
    });

    const lessonsByModule = {};
    (lessons || []).forEach(l => {
        if (!lessonsByModule[l.module_id]) lessonsByModule[l.module_id] = [];
        lessonsByModule[l.module_id].push(l);
    });

    container.innerHTML = courses.map(course => {

        const courseModules = (modulesByCourse[course.id] || []).sort((a, b) => a.module_number - b.module_number);

        const allCourseLessons = courseModules.flatMap(m => lessonsByModule[m.id] || []);
        const completedCount = allCourseLessons.filter(l => completedLessonIds.has(l.id)).length;
        const pct = allCourseLessons.length > 0 ? Math.round((completedCount / allCourseLessons.length) * 100) : 0;

        const modulesHtml = courseModules.map(module => {

            const moduleLessons = (lessonsByModule[module.id] || []).sort((a, b) => a.lesson_number - b.lesson_number);

            const lessonsHtml = moduleLessons.length === 0
                ? `<p class="empty-note" style="padding:6px 0;">No lessons added yet.</p>`
                : moduleLessons.map(lesson => {
                    const isDone = completedLessonIds.has(lesson.id);
                    return `
                        <button type="button" class="lesson-row" onclick="toggleLesson('${lesson.id}')">
                            <span class="lesson-title">
                                <span class="lesson-left">
                                    <span class="check" id="check-${lesson.id}">${isDone ? "✅" : "⬜"}</span>
                                    Lesson ${lesson.lesson_number} — ${escapeHtml(lesson.title)}
                                </span>
                                <span class="toggle-arrow" id="arrow-${lesson.id}">▼</span>
                            </span>
                        </button>
                        <div class="lesson-content-panel" id="panel-${lesson.id}"></div>
                    `;
                }).join("");

            return `
                <div class="module-block">
                    <h4>Module ${module.module_number} — ${escapeHtml(module.title)}</h4>
                    ${lessonsHtml}
                </div>
            `;

        }).join("");

        return `
            <div class="course-card">
                <h3>${escapeHtml(course.code)} — ${escapeHtml(course.name)}</h3>
                <div class="course-meta">${completedCount} of ${allCourseLessons.length} lessons completed • ${course.credits || 0} credits</div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
                ${courseModules.length === 0 ? `<p class="empty-note">No modules added for this course yet.</p>` : modulesHtml}
            </div>
        `;

    }).join("");

}


function toggleLesson(lessonId) {

    const panel = document.getElementById(`panel-${lessonId}`);
    const arrow = document.getElementById(`arrow-${lessonId}`);
    const isOpen = panel.classList.contains("open");

    if (isOpen) {
        panel.classList.remove("open");
        arrow.textContent = "▼";
        return;
    }

    if (!panel.dataset.rendered) {
        renderLessonContent(lessonId, panel);
        panel.dataset.rendered = "true";
    }

    panel.classList.add("open");
    arrow.textContent = "▲";

}


function renderLessonContent(lessonId, panel) {

    const lesson = lessonsById[lessonId];
    if (!lesson) {
        panel.innerHTML = `<p class="empty-note">Unable to load this lesson.</p>`;
        return;
    }

    const embedUrl = getYouTubeEmbedUrl(lesson.video_url);
    const isDone = completedLessonIds.has(lessonId);

    let html = "";

    if (embedUrl) {
        html += `<div class="lesson-video-wrap"><iframe src="${embedUrl}" allowfullscreen></iframe></div>`;
    } else if (lesson.video_url) {
        html += `<p><a href="${escapeHtml(lesson.video_url)}" target="_blank" rel="noopener">▶ Open video link</a></p>`;
    }

    if (lesson.description) {
        html += `<div class="section-label">Description</div><p>${escapeHtml(lesson.description)}</p>`;
    }

    if (lesson.learning_objectives) {
        html += `<div class="section-label">Learning Objectives</div><p>${escapeHtml(lesson.learning_objectives)}</p>`;
    }

    if (lesson.content) {
        html += `<div class="section-label">Lesson Content</div><p>${escapeHtml(lesson.content)}</p>`;
    }

    if (!lesson.description && !lesson.learning_objectives && !lesson.content && !embedUrl && !lesson.video_url) {
        html += `<p class="empty-note">No content has been added to this lesson yet.</p>`;
    }

    html += `<button class="mark-complete-button" id="completeBtn-${lessonId}" onclick="markComplete('${lessonId}')" ${isDone ? "disabled" : ""}>${isDone ? "✓ Completed" : "Mark as Complete"}</button>`;

    panel.innerHTML = html;

}


async function markComplete(lessonId) {

    const { error } =
        await supabaseClient
            .from("lesson_progress")
            .upsert({
                student_id: authUserId,
                lesson_id: lessonId,
                status: "completed",
                completed_at: new Date().toISOString()
            }, { onConflict: "student_id,lesson_id" });

    if (error) {
        alert("Unable to mark as complete: " + error.message);
        return;
    }

    completedLessonIds.add(lessonId);
    document.getElementById(`check-${lessonId}`).textContent = "✅";

    const btn = document.getElementById(`completeBtn-${lessonId}`);
    btn.disabled = true;
    btn.textContent = "✓ Completed";

}


startPage();

</script>

</body>
</html>
