<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Courses | E-Campus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f6f8;
            color: #111827;
            line-height: 1.6;
        }

        .page-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }

        .brand-text h1 {
            font-size: 22px;
            color: #111827;
        }

        .brand-text p {
            color: #b58b17;
            font-weight: 600;
            font-size: 14px;
        }

        .back-button {
            border: none;
            background: #111827;
            color: white;

            padding: 12px 18px;
            border-radius: 10px;

            cursor: pointer;
            font-weight: 600;
        }

        .back-button:hover {
            background: #1f2937;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title .label {
            color: #b58b17;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .page-title h2 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 22px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: 800;
            color: #111827;
        }

        .stat-card .label {
            color: #6b7280;
            margin-top: 4px;
        }

        .courses-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .courses-header h3 {
            font-size: 23px;
        }

        .refresh-button {
            border: 1px solid #d1d5db;
            background: white;
            color: #111827;

            padding: 10px 16px;
            border-radius: 9px;

            cursor: pointer;
            font-weight: 600;
        }

        .refresh-button:hover {
            background: #f9fafb;
        }

        #coursesContainer {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;
        }

        .course-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.04);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);
        }

        .course-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;
            margin-bottom: 16px;
        }

        .course-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f8f1d8;
            border-radius: 13px;

            font-size: 25px;
        }

        .course-code {
            color: #b58b17;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .course-card h4 {
            font-size: 21px;
            margin: 5px 0 8px;
        }

        .course-description {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .course-details {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;
            margin-bottom: 18px;
        }

        .detail {
            background: #f9fafb;
            border-radius: 10px;
            padding: 10px;
        }

        .detail-label {
            color: #6b7280;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            margin-top: 3px;
        }

        .status {
            display: inline-block;

            padding: 5px 10px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;

            background: #e8f5e9;
            color: #166534;
        }

        .status.completed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status.dropped {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .open-button {
            width: 100%;

            border: none;
            background: #111827;
            color: white;

            padding: 13px;
            border-radius: 10px;

            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
        }

        .open-button:hover {
            background: #b58b17;
            color: #111827;
        }

        .loading,
        .empty-state,
        .error-state {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 45px 20px;
            text-align: center;

            grid-column: 1 / -1;
        }

        .loading-icon,
        .empty-icon,
        .error-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .loading p,
        .empty-state p,
        .error-state p {
            color: #6b7280;
        }

        .error-state {
            border-color: #fecaca;
        }

        .error-state h4 {
            color: #b91c1c;
            margin-bottom: 5px;
        }

        .footer {
            background: #111827;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .footer p {
            color: #d1d5db;
            font-size: 14px;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr;
            }

            #coursesContainer {
                grid-template-columns: 1fr;
            }

            .page-title h2 {
                font-size: 28px;
            }

            .page-header {
                padding: 14px 16px;
            }

            .brand-logo {
                width: 44px;
                height: 44px;
            }

            .brand-text h1 {
                font-size: 19px;
            }

            .back-button {
                padding: 10px 12px;
                font-size: 12px;
            }
        }

        @media (max-width: 500px) {

            .course-details {
                grid-template-columns: 1fr;
            }

            .courses-header {
                align-items: flex-start;
                gap: 10px;
            }

            .courses-header h3 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="page-header">

        <div class="brand">

            <img
                src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMAGE.png"
                alt="Sunningdale University Logo"
                class="brand-logo"
            >

            <div class="brand-text">

                <h1>E-Campus</h1>

                <p>
                    Sunningdale University
                </p>

            </div>

        </div>

        <button
            class="back-button"
            onclick="goBack()"
        >
            ← Back
        </button>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="page-container">

        <section class="page-title">

            <div class="label">
                Student Portal
            </div>

            <h2>
                My Courses
            </h2>

            <p>
                View your registered courses,
                course information and academic
                progress.
            </p>

        </section>


        <!-- =========================
             STATISTICS
        ========================== -->

        <section class="stats">

            <div class="stat-card">

                <div
                    class="number"
                    id="totalCourses"
                >
                    0
                </div>

                <div class="label">
                    Registered Courses
                </div>

            </div>


            <div class="stat-card">

                <div
                    class="number"
                    id="completedCourses"
                >
                    0
                </div>

                <div class="label">
                    Completed Courses
                </div>

            </div>


            <div class="stat-card">

                <div
                    class="number"
                    id="activeCourses"
                >
                    0
                </div>

                <div class="label">
                    Active Courses
                </div>

            </div>

        </section>


        <!-- =========================
             COURSE LIST
        ========================== -->

        <section>

            <div class="courses-header">

                <h3>
                    Your Registered Courses
                </h3>

                <button
                    class="refresh-button"
                    onclick="loadCourses()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div id="coursesContainer">

                <div class="loading">

                    <div class="loading-icon">
                        ⏳
                    </div>

                    <p>
                        Loading your courses...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <p>
            © 2026 Sunningdale University.
            All rights reserved.
        </p>

    </footer>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="../supabase-config.js"></script>

    <script src="../app.js"></script>


    <!-- =========================
         PAGE JAVASCRIPT
    ========================== -->

    <script>

        let currentCourses = [];


        /*
        ==========================================
        WAIT FOR PAGE
        ==========================================
        */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadCourses();

            }
        );


        /*
        ==========================================
        LOAD COURSES
        ==========================================
        */

        async function loadCourses() {

            const container =
                document.getElementById(
                    "coursesContainer"
                );


            container.innerHTML = `
                <div class="loading">

                    <div class="loading-icon">
                        ⏳
                    </div>

                    <p>
                        Loading your courses...
                    </p>

                </div>
            `;


            try {

                /*
                ----------------------------------
                GET CURRENT STUDENT
                ----------------------------------
                */

                if (
                    typeof getCurrentStudent !==
                    "function"
                ) {

                    throw new Error(
                        "getCurrentStudent() was not found in app.js"
                    );

                }


                const student =
                    await getCurrentStudent();


                if (!student) {

                    container.innerHTML = `
                        <div class="error-state">

                            <div class="error-icon">
                                🔐
                            </div>

                            <h4>
                                Student login required
                            </h4>

                            <p>
                                Please log in to view
                                your registered courses.
                            </p>

                        </div>
                    `;

                    return;
                }


                /*
                ----------------------------------
                QUERY ENROLLMENTS + COURSES
                ----------------------------------
                */

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("enrollments")

                    .select(`
                        id,
                        status,
                        final_grade,
                        final_score,
                        enrollment_date,

                        course:courses (
                            id,
                            code,
                            name,
                            description,
                            credits,
                            course_type,
                            status
                        )
                    `)

                    .eq(
                        "student_id",
                        student.id
                    )

                    .order(
                        "enrollment_date",
                        {
                            ascending: false
                        }
                    );


                if (error) {

                    console.error(
                        "Supabase course error:",
                        error
                    );

                    throw error;

                }


                currentCourses =
                    data || [];


                /*
                ----------------------------------
                STATISTICS
                ----------------------------------
                */

                const total =
                    currentCourses.length;


                const completed =
                    currentCourses.filter(
                        item =>
                            String(
                                item.status
                            ).toLowerCase()
                            === "completed"
                    ).length;


                const active =
                    currentCourses.filter(
                        item => {

                            const status =
                                String(
                                    item.status ||
                                    ""
                                ).toLowerCase();

                            return (
                                status === "active" ||
                                status === "enrolled" ||
                                status === "registered"
                            );

                        }
                    ).length;


                document.getElementById(
                    "totalCourses"
                ).textContent = total;


                document.getElementById(
                    "completedCourses"
                ).textContent =
                    completed;


                document.getElementById(
                    "activeCourses"
                ).textContent =
                    active;


                /*
                ----------------------------------
                DISPLAY COURSES
                ----------------------------------
                */

                renderCourses(
                    currentCourses
                );

            }

            catch (error) {

                console.error(
                    "loadCourses failed:",
                    error
                );


                container.innerHTML = `
                    <div class="error-state">

                        <div class="error-icon">
                            ⚠️
                        </div>

                        <h4>
                            Unable to load courses
                        </h4>

                        <p>
                            ${escapeHtml(
                                error.message ||
                                "An unexpected error occurred."
                            )}
                        </p>

                    </div>
                `;

            }

        }


        /*
        ==========================================
        RENDER COURSES
        ==========================================
        */

        function renderCourses(
            enrollments
        ) {

            const container =
                document.getElementById(
                    "coursesContainer"
                );


            if (
                !enrollments ||
                enrollments.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty-state">

                        <div class="empty-icon">
                            📚
                        </div>

                        <h4>
                            No registered courses
                        </h4>

                        <p>
                            You currently have no
                            courses registered.
                        </p>

                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            enrollments.forEach(
                function (
                    enrollment,
                    index
                ) {

                    const course =
                        enrollment.course;


                    if (!course) {
                        return;
                    }


                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "course-card";


                    const status =
                        String(
                            enrollment.status ||
                            "active"
                        );


                    const statusClass =
                        getStatusClass(
                            status
                        );


                    const description =
                        course.description ||
                        "No course description available.";


                    card.innerHTML = `

                        <div class="course-top">

                            <div>

                                <div class="course-code">

                                    ${escapeHtml(
                                        course.code
                                    )}

                                </div>

                                <h4>

                                    ${escapeHtml(
                                        course.name
                                    )}

                                </h4>

                            </div>


                            <div class="course-icon">
                                📚
                            </div>

                        </div>


                        <p class="course-description">

                            ${escapeHtml(
                                description
                            )}

                        </p>


                        <div class="course-details">

                            <div class="detail">

                                <div class="detail-label">
                                    Credits
                                </div>

                                <div class="detail-value">

                                    ${
                                        course.credits ??
                                        "N/A"
                                    }

                                </div>

                            </div>


                            <div class="detail">

                                <div class="detail-label">
                                    Type
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(
                                        course.course_type ||
                                        "N/A"
                                    )}

                                </div>

                            </div>


                            <div class="detail">

                                <div class="detail-label">
                                    Grade
                                </div>

                                <div class="detail-value">

                                    ${
                                        enrollment.final_grade ||
                                        "Pending"
                                    }

                                </div>

                            </div>


                            <div class="detail">

                                <div class="detail-label">
                                    Score
                                </div>

                                <div class="detail-value">

                                    ${
                                        enrollment.final_score !==
                                        null &&
                                        enrollment.final_score !==
                                        undefined
                                            ? enrollment.final_score
                                            : "Pending"
                                    }

                                </div>

                            </div>

                        </div>


                        <span
                            class="status ${statusClass}"
                        >

                            ${escapeHtml(
                                status
                            )}

                        </span>


                        <br><br>


                        <button
                            class="open-button"
                            onclick="openCourse(${index})"
                        >
                            Open Course
                        </button>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }


        /*
        ==========================================
        OPEN COURSE
        ==========================================
        */

        function openCourse(index) {

            const enrollment =
                currentCourses[index];


            if (!enrollment) {
                return;
            }


            const course =
                enrollment.course;


            if (!course) {
                return;
            }


            /*
            ----------------------------------
            TEMPORARY COURSE ACTION
            ----------------------------------

            The actual course-content page
            will be connected later.
            ----------------------------------
            */

            alert(
                "Opening " +
                course.name +
                " (" +
                course.code +
                ")"
            );

        }


        /*
        ==========================================
        STATUS CLASS
        ==========================================
        */

        function getStatusClass(
            status
        ) {

            const value =
                String(
                    status || ""
                ).toLowerCase();


            if (
                value === "completed"
            ) {

                return "completed";

            }


            if (
                value === "dropped" ||
                value === "cancelled"
            ) {

                return "dropped";

            }


            if (
                value === "pending"
            ) {

                return "pending";

            }


            return "";

        }


        /*
        ==========================================
        ESCAPE HTML
        ==========================================
        */

        function escapeHtml(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value === null ||
                value === undefined
                    ? ""
                    : String(value);


            return div.innerHTML;

        }


        /*
        ==========================================
        BACK BUTTON
        ==========================================
        */

        function goBack() {

            if (
                document.referrer &&
                document.referrer !==
                window.location.href
            ) {

                window.history.back();

            } else {

                window.location.href =
                    "student-dashboard.html";

            }

        }

    </script>

</body>
</html>
