<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Attendance | E-Campus</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #111827; color: white; padding: 18px 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 22px; }
.brand p { color: #d4af37; margin-top: 3px; font-size: 13px; }

.section-heading { font-size: 17px; font-weight: bold; margin: 24px 0 12px; }
.section-heading.missed { color: #991b1b; }

.card { background: white; padding: 20px; border-radius: 14px; margin-bottom: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }

.missed-card { border: 2px solid #fca5a5; background: #fef2f2; }

.course-tag { color: #d4af37; font-size: 12px; font-weight: bold; }
.session-date { font-size: 16px; font-weight: bold; margin: 4px 0 10px; }

.topic-to-attend {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #1d4ed8;
}

.topic-to-attend strong { color: #111827; }

.evidence-window-note {
    font-size: 11px;
    color: #6b7280;
    margin-bottom: 8px;
}

.evidence-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

    background: #fef3c7;
    color: #92400e;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 12px;
}

textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    min-height: 80px;
    margin-bottom: 10px;
}

.submit-button {
    background: #111827;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}

.submit-button:disabled { opacity: 0.5; cursor: not-allowed; }

.pending-badge {
    background: #fef3c7;
    color: #92400e;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.approved-badge {
    background: #dcfce7;
    color: #166534;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.history-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
.history-row:last-child { border-bottom: none; }

.empty-note { color: #9ca3af; text-align: center; padding: 20px 0; }
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div>
            <h1>E-Campus</h1>
            <p>Sunningdale University</p>
        </div>
    </div>
    <a href="student-dashboard.html" class="back-button">← Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>My Attendance</h2>
        <p>On days your course has a class, log what you did. Missed days must be caught up before you can continue.</p>
    </section>

    <div id="message" class="message"></div>

    <h3 class="section-heading">Today</h3>
    <div id="todayContainer"><p class="empty-note">Loading...</p></div>

    <h3 class="section-heading missed" id="missedHeading" style="display:none;">⚠️ Missed Classes — Catch-Up Required</h3>
    <div id="missedContainer"></div>

    <h3 class="section-heading">Recent History</h3>
    <div id="historyContainer"><p class="empty-note">Loading...</p></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const WEEKDAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const LOOKBACK_DAYS = 30;

let authUserId = null;
let studentProfileId = null;

const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function dateToLocalString(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
}


async function loadAttendance() {

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "student-login.html";
        return;
    }

    authUserId = user.id;

    const { data: studentProfile } =
        await supabaseClient.from("student_profiles").select("id").eq("user_id", user.id).single();

    if (!studentProfile) {
        document.getElementById("todayContainer").innerHTML = `<div class="card"><p class="empty-note">Unable to load your student profile.</p></div>`;
        return;
    }

    studentProfileId = studentProfile.id;

    const { data: enrollments } =
        await supabaseClient
            .from("enrollments")
            .select("courses ( id, code, name, class_days )")
            .eq("student_id", studentProfileId)
            .eq("status", "enrolled");

    const courses = (enrollments || []).map(e => e.courses).filter(c => c && c.class_days && c.class_days.length > 0);

    if (courses.length === 0) {
        document.getElementById("todayContainer").innerHTML = `<div class="card"><p class="empty-note">No enrolled courses with scheduled class days yet.</p></div>`;
        document.getElementById("historyContainer").innerHTML = `<div class="card"><p class="empty-note">No attendance history yet.</p></div>`;
        return;
    }

    const courseIds = courses.map(c => c.id);

    // ===== Fetch Units + Topics to determine "next topic to catch up on" per course =====

    const { data: modules } =
        await supabaseClient
            .from("course_modules")
            .select("id, course_id, module_number")
            .in("course_id", courseIds)
            .order("module_number");

    const moduleIds = (modules || []).map(m => m.id);
    const moduleToCourse = {};
    (modules || []).forEach(m => moduleToCourse[m.id] = m.course_id);

    let lessons = [];
    if (moduleIds.length > 0) {
        const { data } =
            await supabaseClient
                .from("lessons")
                .select("id, module_id, lesson_number, title")
                .in("module_id", moduleIds)
                .order("lesson_number");
        lessons = data || [];
    }

    const { data: allLessonProgress } =
        await supabaseClient
            .from("lesson_progress")
            .select("lesson_id, status, completed_at")
            .eq("student_id", authUserId);

    const completedLessonIds = new Set(
        (allLessonProgress || []).filter(p => p.status === "completed").map(p => p.lesson_id)
    );

    const lessonsByCourse = {};
    lessons.forEach(l => {
        const courseId = moduleToCourse[l.module_id];
        if (!lessonsByCourse[courseId]) lessonsByCourse[courseId] = [];
        lessonsByCourse[courseId].push(l);
    });
    Object.keys(lessonsByCourse).forEach(cid => {
        lessonsByCourse[cid].sort((a, b) => a.lesson_number - b.lesson_number);
    });

    function getNextTopicForCourse(courseId) {
        const courseLessons = lessonsByCourse[courseId] || [];
        const nextTopic = courseLessons.find(l => !completedLessonIds.has(l.id));
        return nextTopic || null;
    }

    // Map lesson_id -> module_id -> course_id, so we can filter evidence per course
    const lessonIdToCourse = {};
    lessons.forEach(l => {
        lessonIdToCourse[l.id] = moduleToCourse[l.module_id];
    });


    // ===== Get ALL evidence ever generated by this student (lessons, quizzes, assignments), with course + timestamp =====

    const { data: allQuizzesForCourses } =
        moduleIds.length > 0
        ? await supabaseClient.from("quizzes").select("id, module_id, course_id").in("module_id", moduleIds)
        : { data: [] };

    const { data: allQuizzesFinal } =
        await supabaseClient.from("quizzes").select("id, module_id, course_id").in("course_id", courseIds).eq("is_final_exam", true);

    const quizIdToCourse = {};
    [...(allQuizzesForCourses || []), ...(allQuizzesFinal || [])].forEach(q => {
        quizIdToCourse[q.id] = q.course_id || moduleToCourse[q.module_id];
    });

    const { data: allQuizAttempts } =
        await supabaseClient.from("quiz_attempts").select("quiz_id, submitted_at").eq("student_id", authUserId);

    const { data: allAssignmentsForCourses } =
        moduleIds.length > 0
        ? await supabaseClient.from("assignments").select("id, module_id").in("module_id", moduleIds)
        : { data: [] };

    const assignmentIdToCourse = {};
    (allAssignmentsForCourses || []).forEach(a => {
        assignmentIdToCourse[a.id] = moduleToCourse[a.module_id];
    });

    const { data: allSubmissions } =
        await supabaseClient.from("submissions").select("assignment_id, submitted_at").eq("student_id", authUserId);


    // ===== Get ALL existing attendance records for this student across these courses =====

    const { data: existingRecords } =
        await supabaseClient
            .from("attendance")
            .select("*")
            .eq("student_id", studentProfileId)
            .in("course_id", courseIds)
            .order("session_date", { ascending: false });

    const recordsByCoursDate = {};
    (existingRecords || []).forEach(r => {
        recordsByCoursDate[`${r.course_id}_${r.session_date}`] = r;
    });

    // For each course, find the most recent existing log's session_date (their "last log")
    const lastLogDateByCourse = {};
    courses.forEach(course => {
        const recordsForCourse = (existingRecords || []).filter(r => r.course_id === course.id);
        if (recordsForCourse.length > 0) {
            const mostRecent = recordsForCourse.reduce((latest, r) => r.session_date > latest.session_date ? r : latest, recordsForCourse[0]);
            lastLogDateByCourse[course.id] = mostRecent.session_date;
        } else {
            lastLogDateByCourse[course.id] = null; // no log ever — evidence window is open-ended (all-time)
        }
    });

    // For each course, count evidence generated AFTER their last log date (or all-time if no log yet), up to now
    function getEvidenceForCourse(courseId) {

        const lastLogDate = lastLogDateByCourse[courseId];
        const windowStart = lastLogDate ? new Date(lastLogDate + "T23:59:59") : null; // strictly after their last logged day

        const now = new Date();

        const lessonCount = (allLessonProgress || []).filter(p => {
            if (p.status !== "completed") return false;
            if (lessonIdToCourse[p.lesson_id] !== courseId) return false;
            if (!p.completed_at) return false;
            const ts = new Date(p.completed_at);
            return (!windowStart || ts > windowStart) && ts <= now;
        }).length;

        const quizCount = (allQuizAttempts || []).filter(a => {
            if (quizIdToCourse[a.quiz_id] !== courseId) return false;
            if (!a.submitted_at) return false;
            const ts = new Date(a.submitted_at);
            return (!windowStart || ts > windowStart) && ts <= now;
        }).length;

        const assignmentCount = (allSubmissions || []).filter(s => {
            if (assignmentIdToCourse[s.assignment_id] !== courseId) return false;
            if (!s.submitted_at) return false;
            const ts = new Date(s.submitted_at);
            return (!windowStart || ts > windowStart) && ts <= now;
        }).length;

        return { lessonCount, quizCount, assignmentCount, hasAny: (lessonCount + quizCount + assignmentCount) > 0 };

    }

    const todayWeekday = WEEKDAY_NAMES[new Date().getDay()];
    const todayStr = dateToLocalString(new Date());

    // ===== TODAY'S LOG =====

    const todayContainer = document.getElementById("todayContainer");
    const coursesWithClassToday = courses.filter(c => c.class_days.includes(todayWeekday));

    if (coursesWithClassToday.length === 0) {
        todayContainer.innerHTML = `<div class="card"><p class="empty-note">No courses have a scheduled class today (${todayWeekday}).</p></div>`;
    } else {

        todayContainer.innerHTML = coursesWithClassToday.map(course => {

            const existing = recordsByCoursDate[`${course.id}_${todayStr}`];
            const nextTopic = getNextTopicForCourse(course.id);
            const evidence = getEvidenceForCourse(course.id);
            const lastLogDate = lastLogDateByCourse[course.id];

            if (existing) {

                const statusBadge = existing.approval_status === "approved"
                    ? `<span class="approved-badge">✓ Approved</span>`
                    : `<span class="pending-badge">📝 Pending review</span>`;

                return `
                    <div class="card">
                        <div class="course-tag">${escapeHtml(course.code)}</div>
                        <div class="session-date">${escapeHtml(course.name)} — Today</div>
                        <p style="font-size:13px; color:#374151; margin-bottom:8px;">Already submitted. ${statusBadge}</p>
                        ${existing.student_note ? `<p style="font-size:13px; color:#6b7280; font-style:italic;">"${escapeHtml(existing.student_note)}"</p>` : ""}
                    </div>
                `;

            }

            return `
                <div class="card">
                    <div class="course-tag">${escapeHtml(course.code)}</div>
                    <div class="session-date">${escapeHtml(course.name)} — Today</div>

                    ${nextTopic
                        ? `<div class="topic-to-attend">📖 Topic to attend to: <strong>Topic ${nextTopic.lesson_number} — ${escapeHtml(nextTopic.title)}</strong></div>`
                        : `<div class="topic-to-attend">✅ You've completed all available Topics in this course so far.</div>`
                    }

                    <div class="evidence-window-note">Counting evidence since ${lastLogDate ? new Date(lastLogDate).toLocaleDateString() : "you started this course"}</div>

                    <div class="evidence-row">
                        <span class="evidence-pill ${evidence.lessonCount > 0 ? "has-evidence" : ""}">📖 ${evidence.lessonCount} Topics done</span>
                        <span class="evidence-pill ${evidence.quizCount > 0 ? "has-evidence" : ""}">🎯 ${evidence.quizCount} Quizzes done</span>
                        <span class="evidence-pill ${evidence.assignmentCount > 0 ? "has-evidence" : ""}">📝 ${evidence.assignmentCount} Assignments done</span>
                    </div>

                    ${!evidence.hasAny ? `<div class="no-evidence-note">⚠️ You need to complete at least one Topic, Quiz, or Assignment for this course before you can log attendance.</div>` : ""}

                    <textarea id="note-today-${course.id}" placeholder="Briefly describe what you studied or did..."></textarea>

                    <button class="submit-button" ${!evidence.hasAny ? "disabled" : ""} onclick="submitLog('${course.id}', '${todayStr}', 'note-today-${course.id}')">
                        Submit Today's Log
                    </button>
                </div>
            `;

        }).join("");

    }


    // ===== MISSED CLASSES =====

    const missedContainer = document.getElementById("missedContainer");
    const missedHeading = document.getElementById("missedHeading");

    const missedDays = [];

    courses.forEach(course => {

        for (let i = 1; i <= LOOKBACK_DAYS; i++) {

            const checkDate = new Date();
            checkDate.setDate(checkDate.getDate() - i);
            const checkWeekday = WEEKDAY_NAMES[checkDate.getDay()];

            if (!course.class_days.includes(checkWeekday)) continue;

            const checkDateStr = dateToLocalString(checkDate);
            const existing = recordsByCoursDate[`${course.id}_${checkDateStr}`];

            if (!existing) {
                missedDays.push({ course, dateStr: checkDateStr, dateObj: new Date(checkDate) });
            }

        }

    });

    missedDays.sort((a, b) => b.dateObj - a.dateObj);

    if (missedDays.length === 0) {

        missedHeading.style.display = "none";
        missedContainer.innerHTML = "";

    } else {

        missedHeading.style.display = "block";

        missedContainer.innerHTML = missedDays.map((missed, idx) => {

            const nextTopic = getNextTopicForCourse(missed.course.id);
            const evidence = getEvidenceForCourse(missed.course.id);
            const lastLogDate = lastLogDateByCourse[missed.course.id];

            return `
                <div class="card missed-card">
                    <div class="course-tag">${escapeHtml(missed.course.code)}</div>
                    <div class="session-date">${escapeHtml(missed.course.name)} — Missed: ${missed.dateObj.toLocaleDateString()}</div>

                    ${nextTopic
                        ? `<div class="topic-to-attend">📖 Topic to attend to for catch-up: <strong>Topic ${nextTopic.lesson_number} — ${escapeHtml(nextTopic.title)}</strong></div>`
                        : `<div class="topic-to-attend">✅ You've completed all available Topics in this course so far.</div>`
                    }

                    <div class="evidence-window-note">Counting evidence since ${lastLogDate ? new Date(lastLogDate).toLocaleDateString() : "you started this course"}</div>

                    <div class="evidence-row">
                        <span class="evidence-pill ${evidence.lessonCount > 0 ? "has-evidence" : ""}">📖 ${evidence.lessonCount} Topics done</span>
                        <span class="evidence-pill ${evidence.quizCount > 0 ? "has-evidence" : ""}">🎯 ${evidence.quizCount} Quizzes done</span>
                        <span class="evidence-pill ${evidence.assignmentCount > 0 ? "has-evidence" : ""}">📝 ${evidence.assignmentCount} Assignments done</span>
                    </div>

                    <p style="font-size:12px; color:#991b1b; margin-bottom:10px;">To catch up on this missed day, use any real coursework completed since your last log, then explain what you covered.</p>

                    ${!evidence.hasAny ? `<div class="no-evidence-note">⚠️ You need real evidence of work completed for this course before you can submit this catch-up.</div>` : ""}

                    <textarea id="note-missed-${idx}" placeholder="Explain what you studied to catch up on this missed class..."></textarea>

                    <button class="submit-button" ${!evidence.hasAny ? "disabled" : ""} onclick="submitLog('${missed.course.id}', '${missed.dateStr}', 'note-missed-${idx}', true)">
                        Submit Catch-Up
                    </button>
                </div>
            `;

        }).join("");

    }


    // ===== RECENT HISTORY =====

    const historyContainer = document.getElementById("historyContainer");

    if (!existingRecords || existingRecords.length === 0) {
        historyContainer.innerHTML = `<div class="card"><p class="empty-note">No attendance history yet.</p></div>`;
    } else {

        const courseMap = {};
        courses.forEach(c => courseMap[c.id] = c);

        historyContainer.innerHTML = `<div class="card">` + existingRecords.slice(0, 15).map(r => {

            const course = courseMap[r.course_id];
            const statusText = r.submitted_by_student
                ? (r.approval_status === "approved" ? "✓ Approved" : "📝 Pending review")
                : (r.status === "present" ? "✓ Present (marked by lecturer)" : "✗ Absent (marked by lecturer)");

            return `
                <div class="history-row">
                    <span>${escapeHtml(course ? course.code : "")} — ${new Date(r.session_date).toLocaleDateString()}</span>
                    <span>${statusText}</span>
                </div>
            `;

        }).join("") + `</div>`;

    }

}


async function submitLog(courseId, dateStr, textareaId, isCatchUp) {

    const note = document.getElementById(textareaId).value.trim();

    if (!note) {
        showMessage("Please describe what you did before submitting.", "error");
        return;
    }

    // Recompute evidence fresh at submit time, same window logic as display
    const { data: existingRecordsForCourse } =
        await supabaseClient
            .from("attendance")
            .select("session_date")
            .eq("student_id", studentProfileId)
            .eq("course_id", courseId)
            .order("session_date", { ascending: false })
            .limit(1);

    const lastLogDate = existingRecordsForCourse && existingRecordsForCourse.length > 0 ? existingRecordsForCourse[0].session_date : null;
    const windowStart = lastLogDate ? new Date(lastLogDate + "T23:59:59") : null;

    const { data: modulesForCourse } =
        await supabaseClient.from("course_modules").select("id").eq("course_id", courseId);
    const moduleIdsForCourse = (modulesForCourse || []).map(m => m.id);

    let lessonCount = 0;
    if (moduleIdsForCourse.length > 0) {
        const { data: lessonsForCourse } = await supabaseClient.from("lessons").select("id").in("module_id", moduleIdsForCourse);
        const lessonIdsForCourse = (lessonsForCourse || []).map(l => l.id);

        if (lessonIdsForCourse.length > 0) {
            const { data: progress } =
                await supabaseClient
                    .from("lesson_progress")
                    .select("completed_at")
                    .eq("student_id", authUserId)
                    .eq("status", "completed")
                    .in("lesson_id", lessonIdsForCourse);

            lessonCount = (progress || []).filter(p => {
                if (!p.completed_at) return false;
                const ts = new Date(p.completed_at);
                return !windowStart || ts > windowStart;
            }).length;
        }
    }

    let quizCount = 0;
    const { data: quizzesForCourse } =
        await supabaseClient.from("quizzes").select("id").or(`course_id.eq.${courseId}${moduleIdsForCourse.length > 0 ? ",module_id.in.(" + moduleIdsForCourse.join(",") + ")" : ""}`);
    const quizIdsForCourse = (quizzesForCourse || []).map(q => q.id);

    if (quizIdsForCourse.length > 0) {
        const { data: attempts } =
            await supabaseClient.from("quiz_attempts").select("submitted_at").eq("student_id", authUserId).in("quiz_id", quizIdsForCourse);

        quizCount = (attempts || []).filter(a => {
            if (!a.submitted_at) return false;
            const ts = new Date(a.submitted_at);
            return !windowStart || ts > windowStart;
        }).length;
    }

    let assignmentCount = 0;
    if (moduleIdsForCourse.length > 0) {
        const { data: assignmentsForCourse } = await supabaseClient.from("assignments").select("id").in("module_id", moduleIdsForCourse);
        const assignmentIdsForCourse = (assignmentsForCourse || []).map(a => a.id);

        if (assignmentIdsForCourse.length > 0) {
            const { data: submissionsForCourse } =
                await supabaseClient.from("submissions").select("submitted_at").eq("student_id", authUserId).in("assignment_id", assignmentIdsForCourse);

            assignmentCount = (submissionsForCourse || []).filter(s => {
                if (!s.submitted_at) return false;
                const ts = new Date(s.submitted_at);
                return !windowStart || ts > windowStart;
            }).length;
        }
    }

    if (lessonCount === 0 && quizCount === 0 && assignmentCount === 0) {
        showMessage("You need real evidence of work completed for this course (since your last log) before submitting.", "error");
        return;
    }

    const { error } =
        await supabaseClient.from("attendance").insert({
            student_id: studentProfileId,
            course_id: courseId,
            session_date: dateStr,
            status: "present",
            submitted_by_student: true,
            student_note: note,
            approval_status: "pending",
            evidence_lessons: lessonCount,
            evidence_quizzes: quizCount,
            evidence_assignments: assignmentCount
        });

    if (error) {
        showMessage("Unable to submit: " + error.message, "error");
        return;
    }

    showMessage(isCatchUp ? "Catch-up submitted. Awaiting your lecturer's approval." : "Today's log submitted. Awaiting your lecturer's approval.", "success");
    await loadAttendance();

}


loadAttendance();

</script>
