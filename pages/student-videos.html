<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Library | E-Campus</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.header h1 { font-size: 22px; }
.header p { color: #d4af37; font-size: 13px; margin-top: 3px; }

.back-button {
    margin-left: auto;
    background: #d4af37;
    color: #111827;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
}

.container { max-width: 900px; margin: 25px auto; padding: 0 20px; }

.page-title { margin-bottom: 20px; }
.page-title h2 { font-size: 28px; margin-bottom: 6px; }
.page-title p { color: #6b7280; font-size: 14px; }

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-size: 13px;
}

.breadcrumb-item {
    background: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: bold;
    color: #6b7280;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.breadcrumb-item.clickable { cursor: pointer; color: #111827; }
.breadcrumb-item.clickable:hover { background: #f4f6f9; }
.breadcrumb-arrow { color: #d1d5db; }

.step-heading {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 14px;
}

.choice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.choice-card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    border: 2px solid transparent;
}

.choice-card:hover { border-color: #d4af37; }
.choice-card .choice-icon { font-size: 26px; margin-bottom: 8px; }
.choice-card .choice-label { font-weight: bold; font-size: 15px; }
.choice-card .choice-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }

.search-box {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 20px;
}

.video-card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.video-card h3 { font-size: 16px; margin-bottom: 4px; }
.video-topic-tag { display: inline-block; color: #1d4ed8; background: #eff6ff; font-size: 11px; font-weight: bold; padding: 3px 9px; border-radius: 20px; margin-bottom: 8px; }
.video-desc { color: #6b7280; font-size: 13px; margin-bottom: 14px; }

.video-frame-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 10px;
    overflow: hidden;
    background: #111827;
    margin-bottom: 10px;
}

.video-frame-wrap iframe,
.video-frame-wrap video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.video-source-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.video-source-tag.youtube { background: #fee2e2; color: #991b1b; }
.video-source-tag.uploaded { background: #dbeafe; color: #1d4ed8; }

.empty-note { color: #9ca3af; text-align: center; padding: 30px 0; }

</style>
</head>


<body>

<header class="header">
    <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
    <div>
        <h1>E-Campus</h1>
        <p>Sunningdale University</p>
    </div>
    <a href="student-dashboard.html" class="back-button">← Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Video Library</h2>
        <p>Find your videos step by step — term, then course, then topic.</p>
    </section>

    <div class="breadcrumb" id="breadcrumb"></div>

    <div id="content"><p class="empty-note">Loading...</p></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

let enrolledCourses = [];
let allVideosByCourse = {}; // courseId -> videos array (fetched lazily)
let currentTerm = null;
let currentCourse = null;

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function getYouTubeEmbedUrl(url) {

    let videoId = null;

    const watchMatch = url.match(/[?&]v=([^&]+)/);
    const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
    const embedMatch = url.match(/embed\/([^?&]+)/);

    if (watchMatch) videoId = watchMatch[1];
    else if (shortMatch) videoId = shortMatch[1];
    else if (embedMatch) videoId = embedMatch[1];

    return videoId ? `https://www.youtube.com/embed/${videoId}` : null;

}


function renderBreadcrumb() {

    const breadcrumb = document.getElementById("breadcrumb");

    let html = `<span class="breadcrumb-item clickable" onclick="goToStep1()">🏠 Video Library</span>`;

    if (currentTerm) {
        html += `<span class="breadcrumb-arrow">›</span>`;
        html += `<span class="breadcrumb-item ${currentCourse ? "clickable" : ""}" ${currentCourse ? `onclick="goToStep2()"` : ""}>${escapeHtml(currentTerm)}</span>`;
    }

    if (currentCourse) {
        html += `<span class="breadcrumb-arrow">›</span>`;
        html += `<span class="breadcrumb-item">${escapeHtml(currentCourse.code)}</span>`;
    }

    breadcrumb.innerHTML = html;

}


async function startPage() {

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "student-login.html";
        return;
    }

    const { data: studentProfile } =
        await supabaseClient.from("student_profiles").select("id").eq("user_id", user.id).single();

    if (!studentProfile) return;

    const { data: enrollments } =
        await supabaseClient
            .from("enrollments")
            .select("courses ( id, code, name )")
            .eq("student_id", studentProfile.id)
            .eq("status", "enrolled");

    enrolledCourses = (enrollments || []).map(e => e.courses).filter(Boolean);

    if (enrolledCourses.length === 0) {
        document.getElementById("content").innerHTML = `<p class="empty-note">You are not enrolled in any courses yet.</p>`;
        return;
    }

    // Fetch ALL videos for all enrolled courses up front, so we can build the term list
    const courseIds = enrolledCourses.map(c => c.id);

    const { data: videos } =
        await supabaseClient
            .from("course_videos")
            .select("*")
            .in("course_id", courseIds);

    (videos || []).forEach(v => {
        if (!allVideosByCourse[v.course_id]) allVideosByCourse[v.course_id] = [];
        allVideosByCourse[v.course_id].push(v);
    });

    goToStep1();

}


// ===== STEP 1: Choose Term/Year =====
function goToStep1() {

    currentTerm = null;
    currentCourse = null;
    renderBreadcrumb();

    const content = document.getElementById("content");

    const NO_TERM_LABEL = "General (No Term Set)";
    const termSet = new Set();

    Object.values(allVideosByCourse).forEach(videos => {
        videos.forEach(v => {
            termSet.add(v.term_label && v.term_label.trim() ? v.term_label.trim() : NO_TERM_LABEL);
        });
    });

    if (termSet.size === 0) {
        content.innerHTML = `<p class="empty-note">No videos have been added to your courses yet.</p>`;
        return;
    }

    const terms = Array.from(termSet).sort((a, b) => {
        if (a === NO_TERM_LABEL) return 1;
        if (b === NO_TERM_LABEL) return -1;
        return a.localeCompare(b);
    });

    content.innerHTML = `
        <div class="step-heading">Which Term or Year are you looking for?</div>
        <div class="choice-grid">
            ${terms.map(t => `
                <div class="choice-card" onclick="goToStep2('${escapeHtml(t).replace(/'/g, "\\'")}')">
                    <div class="choice-icon">📅</div>
                    <div class="choice-label">${escapeHtml(t)}</div>
                </div>
            `).join("")}
        </div>
    `;

}


// ===== STEP 2: Choose Course (only courses that have videos under this term) =====
function goToStep2(termLabel) {

    currentTerm = termLabel;
    currentCourse = null;
    renderBreadcrumb();

    const content = document.getElementById("content");

    const NO_TERM_LABEL = "General (No Term Set)";

    const coursesWithVideosHere = enrolledCourses.filter(c => {
        const videos = allVideosByCourse[c.id] || [];
        return videos.some(v => {
            const key = v.term_label && v.term_label.trim() ? v.term_label.trim() : NO_TERM_LABEL;
            return key === termLabel;
        });
    });

    if (coursesWithVideosHere.length === 0) {
        content.innerHTML = `<p class="empty-note">No courses have videos under "${escapeHtml(termLabel)}".</p>`;
        return;
    }

    content.innerHTML = `
        <div class="step-heading">${escapeHtml(termLabel)} — Which Course?</div>
        <div class="choice-grid">
            ${coursesWithVideosHere.map(c => `
                <div class="choice-card" onclick='goToStep3(${JSON.stringify(c.id)})'>
                    <div class="choice-icon">📚</div>
                    <div class="choice-label">${escapeHtml(c.code)}</div>
                    <div class="choice-sub">${escapeHtml(c.name)}</div>
                </div>
            `).join("")}
        </div>
    `;

}


// ===== STEP 3: Show videos for this term + course, with topic search =====
function goToStep3(courseId) {

    currentCourse = enrolledCourses.find(c => c.id === courseId);
    renderBreadcrumb();

    renderStep3Videos("");

}


function renderStep3Videos(searchTerm) {

    const content = document.getElementById("content");
    const NO_TERM_LABEL = "General (No Term Set)";

    const videos = (allVideosByCourse[currentCourse.id] || []).filter(v => {
        const key = v.term_label && v.term_label.trim() ? v.term_label.trim() : NO_TERM_LABEL;
        return key === currentTerm;
    });

    const filtered = searchTerm
        ? videos.filter(v =>
            (v.topic && v.topic.toLowerCase().includes(searchTerm)) ||
            (v.title && v.title.toLowerCase().includes(searchTerm))
          )
        : videos;

    const videosHtml = filtered.length === 0
        ? `<p class="empty-note">${searchTerm ? `No videos match "${escapeHtml(searchTerm)}".` : "No videos here yet."}</p>`
        : filtered.map(v => {

            let playerHtml = "";

            if (v.video_type === "youtube") {
                const embedUrl = getYouTubeEmbedUrl(v.video_url);
                playerHtml = embedUrl
                    ? `<div class="video-frame-wrap"><iframe src="${escapeHtml(embedUrl)}" allowfullscreen></iframe></div>`
                    : `<p class="empty-note">Unable to play this link directly. <a href="${escapeHtml(v.video_url)}" target="_blank">Open on YouTube</a></p>`;
            } else {
                playerHtml = `<div class="video-frame-wrap"><video src="${escapeHtml(v.video_url)}" controls></video></div>`;
            }

            return `
                <div class="video-card">
                    <span class="video-source-tag ${v.video_type}">${v.video_type === "youtube" ? "▶️ YouTube" : "📁 Uploaded"}</span>
                    <h3>${escapeHtml(v.title)}</h3>
                    ${v.topic ? `<div class="video-topic-tag">📌 ${escapeHtml(v.topic)}</div>` : ""}
                    ${v.description ? `<div class="video-desc">${escapeHtml(v.description)}</div>` : ""}
                    ${playerHtml}
                </div>
            `;

        }).join("");

    content.innerHTML = `
        <div class="step-heading">${escapeHtml(currentCourse.code)} — ${escapeHtml(currentTerm)}</div>
        <input type="text" class="search-box" id="topicSearchInput" placeholder="🔍 Search by topic (e.g. Supply and Demand)" value="${escapeHtml(searchTerm)}" oninput="renderStep3Videos(this.value.trim().toLowerCase())">
        ${videosHtml}
    `;

    // Restore focus/cursor position after re-render, since typing triggers a full re-render
    const input = document.getElementById("topicSearchInput");
    if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
    }

}


startPage();

</script>

</body>
</html>
