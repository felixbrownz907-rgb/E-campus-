<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Campus Management | E-Campus</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #172033;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .brand h1 {
            font-size: 24px;
        }

        .brand p {
            color: #d4af37;
            margin-top: 4px;
        }

        .back-button {
            background: #d4af37;
            color: #111827;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
        }

        .message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        .submit-button {
            margin-top: 20px;
            background: #d4af37;
            color: #111827;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .submit-button:hover {
            background: #c29d24;
        }

        .cancel-button {
            margin-top: 20px;
            background: #6b7280;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
        }

        .cancel-button:hover {
            background: #4b5563;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-button {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-button {
            background: #e5e7eb;
            color: #111827;
        }

        .delete-button {
            background: #fee2e2;
            color: #991b1b;
        }

        .edit-button:hover {
            background: #d1d5db;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .page-title h2 {
                font-size: 25px;
            }

            th,
            td {
                white-space: nowrap;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="brand">

        <img
            src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg"
            alt="Sunningdale University Logo"
            class="logo"
        >

        <div>

            <h1>
                E-Campus Administration
            </h1>

            <p>
                Sunningdale University
            </p>

        </div>

    </div>


    <a
        href="admin-dashboard.html"
        class="back-button"
    >
        ← Admin Dashboard
    </a>

</header>


<main class="container">


    <section class="page-title">

        <h2>
            Campus Management
        </h2>

        <p>
            Create and manage university campuses, addresses and contact details.
        </p>

    </section>


    <div
        id="message"
        class="message"
    ></div>


    <section class="card">

        <h3 id="formTitle">
            Add New Campus
        </h3>


        <form id="campusForm">


            <div class="form-grid">


                <div class="form-group">

                    <label for="name">
                        Campus Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="e.g. Lusaka Campus"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="code">
                        Campus Code
                    </label>

                    <input
                        type="text"
                        id="code"
                        placeholder="e.g. LSK"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Street address"
                    >

                </div>


                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="e.g. Lusaka"
                    >

                </div>


                <div class="form-group">

                    <label for="country">
                        Country
                    </label>

                    <input
                        type="text"
                        id="country"
                        placeholder="e.g. Zambia"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="e.g. +260 xxx xxx xxx"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="e.g. lusaka@sunningdale.edu"
                    >

                </div>


                <div class="form-group full">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="active">
                            ACTIVE
                        </option>

                        <option value="inactive">
                            INACTIVE
                        </option>

                    </select>

                </div>


            </div>


            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >
                Add Campus
            </button>


            <button
                type="button"
                class="cancel-button"
                id="cancelButton"
            >
                Cancel Editing
            </button>


        </form>

    </section>


    <section class="card">

        <h3>
            Existing Campuses
        </h3>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Code</th>
                        <th>Name</th>
                        <th>City</th>
                        <th>Country</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="campusTableBody">

                    <tr>

                        <td colspan="7">
                            Loading campuses...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>


<script>

let editingCampusId = null;

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function loadCampuses() {

    const tbody =
        document.getElementById("campusTableBody");


    const { data, error } =
        await supabaseClient
            .from("campuses")
            .select("*")
            .order("name");


    if (error) {

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    Unable to load campuses.
                </td>
            </tr>
        `;

        showMessage(
            "Unable to load campuses: " + error.message,
            "error"
        );

        return;
    }


    if (!data || data.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    No campuses have been created yet.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML = "";


    data.forEach(campus => {

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${escapeHtml(campus.code)}</td>
            <td>${escapeHtml(campus.name)}</td>
            <td>${escapeHtml(campus.city || "-")}</td>
            <td>${escapeHtml(campus.country || "-")}</td>
            <td>${escapeHtml(campus.phone || "-")}</td>

            <td>
                <span class="status ${campus.status}">
                    ${escapeHtml(campus.status)}
                </span>
            </td>

            <td>
                <button class="action-button edit-button" onclick="editCampus('${campus.id}')">Edit</button>
                <button class="action-button delete-button" onclick="deleteCampus('${campus.id}')">Delete</button>
            </td>

        `;

        tbody.appendChild(row);

    });

}


document
    .getElementById("campusForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const campusData = {

            name: document.getElementById("name").value.trim(),
            code: document.getElementById("code").value.trim(),
            address: document.getElementById("address").value.trim() || null,
            city: document.getElementById("city").value.trim() || null,
            country: document.getElementById("country").value.trim() || null,
            phone: document.getElementById("phone").value.trim() || null,
            email: document.getElementById("email").value.trim() || null,
            status: document.getElementById("status").value

        };

        let error;

        if (editingCampusId) {

            const result =
                await supabaseClient
                    .from("campuses")
                    .update(campusData)
                    .eq("id", editingCampusId);

            error = result.error;

        } else {

            const result =
                await supabaseClient
                    .from("campuses")
                    .insert(campusData);

            error = result.error;

        }

        if (error) {

            console.error(error);

            showMessage(error.message, "error");

            return;

        }

        showMessage(
            editingCampusId
                ? "Campus updated successfully."
                : "Campus created successfully.",
            "success"
        );

        resetForm();

        await loadCampuses();

    });


async function editCampus(id) {

    const { data, error } =
        await supabaseClient
            .from("campuses")
            .select("*")
            .eq("id", id)
            .single();

    if (error) {

        console.error(error);

        showMessage(
            "Unable to load campus: " + error.message,
            "error"
        );

        return;
    }

    editingCampusId = data.id;

    document.getElementById("name").value = data.name || "";
    document.getElementById("code").value = data.code || "";
    document.getElementById("address").value = data.address || "";
    document.getElementById("city").value = data.city || "";
    document.getElementById("country").value = data.country || "";
    document.getElementById("phone").value = data.phone || "";
    document.getElementById("email").value = data.email || "";
    document.getElementById("status").value = data.status || "active";

    document.getElementById("formTitle").textContent = "Edit Campus";
    document.getElementById("submitButton").textContent = "Update Campus";
    document.getElementById("cancelButton").style.display = "block";

    window.scrollTo({ top: 0, behavior: "smooth" });

}


async function deleteCampus(id) {

    const confirmed =
        confirm("Are you sure you want to delete this campus?");

    if (!confirmed) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("campuses")
            .delete()
            .eq("id", id);

    if (error) {

        console.error(error);

        showMessage(
            "Unable to delete campus: " + error.message,
            "error"
        );

        return;
    }

    showMessage("Campus deleted successfully.", "success");

    await loadCampuses();

}


document
    .getElementById("cancelButton")
    .addEventListener("click", function() {
        resetForm();
    });


function resetForm() {

    editingCampusId = null;

    document.getElementById("campusForm").reset();

    document.getElementById("formTitle").textContent = "Add New Campus";
    document.getElementById("submitButton").textContent = "Add Campus";
    document.getElementById("cancelButton").style.display = "none";

}


loadCampuses();

</script>

</body>

</html>
