<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | Lecturer Portal</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header {
    background: #0e7490;
    color: white;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 22px; }
.brand p { color: #cffafe; margin-top: 3px; font-size: 13px; }

.back-button {
    background: white;
    color: #0e7490;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
}

.container { max-width: 900px; margin: 25px auto; padding: 0 20px; }

.page-title { margin-bottom: 20px; }
.page-title h2 { font-size: 28px; margin-bottom: 6px; }
.page-title p { color: #6b7280; }

.message { padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; }
.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card { background: white; padding: 22px; border-radius: 14px; margin-bottom: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
}

select, input[type="date"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

.summary-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.summary-pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.summary-pill.present { background: #dcfce7; color: #166534; }
.summary-pill.absent { background: #fee2e2; color: #991b1b; }
.summary-pill.late { background: #fef3c7; color: #92400e; }

.roster-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: #f9fafb;
    gap: 10px;
    flex-wrap: wrap;
}

.student-name { font-weight: bold; font-size: 14px; }
.student-number { font-size: 12px; color: #6b7280; }

.status-buttons { display: flex; gap: 6px; }

.status-btn {
    border: 1px solid #d1d5db;
    background: white;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.status-btn.active-present { background: #166534; color: white; border-color: #166534; }
.status-btn.active-absent { background: #991b1b; color: white; border-color: #991b1b; }
.status-btn.active-late { background: #92400e; color: white; border-color: #92400e; }

.save-all-button {
    margin-top: 16px;
    background: #0e7490;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
}

.save-all-button:disabled { opacity: 0.6; cursor: not-allowed; }

.empty-note { color: #9ca3af; text-align: center; padding: 20px 0; }

.history-row {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 13px;
}

@media (max-width: 600px) {
    .controls-grid { grid-template-columns: 1fr; }
}
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div>
            <h1>E-Campus</h1>
            <p>Lecturer Portal</p>
        </div>
    </div>
    <a href="lecturer-dashboard.html" class="back-button">← Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Attendance</h2>
        <p>Mark attendance for your courses. Everyone defaults to Present — tap to flip exceptions.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="card">

        <div class="controls-grid">
            <select id="courseSelect">
                <option value="">Select course</option>
            </select>
            <input type="date" id="sessionDate">
        </div>

        <div id="summaryBar" class="summary-bar"></div>

        <div id="rosterContainer">
            <p class="empty-note">Select a course to load the roster.</p>
        </div>

        <button class="save-all-button" id="saveButton" onclick="saveAttendance()" style="display:none;">
            Save Attendance
        </button>

    </section>


    <section class="card">
        <h3 style="margin-bottom:14px;">Recent Sessions</h3>
        <div id="historyContainer"><p class="empty-note">Select a course to view history.</p></div>
    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

let lecturerProfileId = null;
let currentRoster = [];
let currentStatuses = {};

const message = document.getElementById("message");


function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function todayDateString() {
    const d = new Date();
    return d.toISOString().split("T")[0];
}


async function startPage() {

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "lecturer-login.html";
        return;
    }

    const { data: lecturerProfile } =
        await supabaseClient.from("lecturer_profiles").select("id").eq("user_id", user.id).single();

    if (!lecturerProfile) {
        showMessage("Unable to load your lecturer profile.", "error");
        return;
    }

    lecturerProfileId = lecturerProfile.id;

    document.getElementById("sessionDate").value = todayDateString();

    const { data: assignments } =
        await supabaseClient
            .from("course_lecturers")
            .select("courses ( id, code, name )")
            .eq("lecturer_id", lecturerProfileId);

    const courses = (assignments || []).map(a => a.courses).filter(Boolean);

    const select = document.getElementById("courseSelect");

    if (courses.length === 0) {
        select.innerHTML = `<option value="">No courses assigned</option>`;
        return;
    }

    courses.forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = `${c.code} — ${c.name}`;
        select.appendChild(option);
    });

}


document.getElementById("courseSelect").addEventListener("change", loadRoster);
document.getElementById("sessionDate").addEventListener("change", loadRoster);


async function loadRoster() {

    const courseId = document.getElementById("courseSelect").value;
    const sessionDate = document.getElementById("sessionDate").value;

    const rosterContainer = document.getElementById("rosterContainer");
    const saveButton = document.getElementById("saveButton");

    if (!courseId) {
        rosterContainer.innerHTML = `<p class="empty-note">Select a course to load the roster.</p>`;
        saveButton.style.display = "none";
        return;
    }

    rosterContainer.innerHTML = `<p class="empty-note">Loading roster...</p>`;

    const { data: enrollments, error } =
        await supabaseClient
            .from("enrollments")
            .select(`
                student_profiles ( id, student_number, user_profiles ( first_name, last_name ) )
            `)
            .eq("course_id", courseId);

    if (error) {
        rosterContainer.innerHTML = `<p class="empty-note">Unable to load roster: ${escapeHtml(error.message)}</p>`;
        return;
    }

    currentRoster = (enrollments || []).map(e => e.student_profiles).filter(Boolean);

    if (currentRoster.length === 0) {
        rosterContainer.innerHTML = `<p class="empty-note">No students enrolled in this course.</p>`;
        saveButton.style.display = "none";
        await loadHistory(courseId);
        return;
    }

    const { data: existingRecords } =
        await supabaseClient
            .from("attendance")
            .select("student_id, status")
            .eq("course_id", courseId)
            .eq("session_date", sessionDate);

    const existingMap = {};
    (existingRecords || []).forEach(r => existingMap[r.student_id] = r.status);

    currentStatuses = {};
    currentRoster.forEach(student => {
        currentStatuses[student.id] = existingMap[student.id] || "present";
    });

    renderRoster();
    saveButton.style.display = "block";

    await loadHistory(courseId);

}


function renderRoster() {

    const rosterContainer = document.getElementById("rosterContainer");

    rosterContainer.innerHTML = currentRoster.map(student => {

        const name = student.user_profiles
            ? `${student.user_profiles.first_name} ${student.user_profiles.last_name}`
            : "Unknown";

        const status = currentStatuses[student.id];

        return `
            <div class="roster-row">
                <div>
                    <div class="student-name">${escapeHtml(name)}</div>
                    <div class="student-number">${escapeHtml(student.student_number)}</div>
                </div>
                <div class="status-buttons">
                    <button class="status-btn ${status === "present" ? "active-present" : ""}" onclick="setStatus('${student.id}', 'present')">Present</button>
                    <button class="status-btn ${status === "late" ? "active-late" : ""}" onclick="setStatus('${student.id}', 'late')">Late</button>
                    <button class="status-btn ${status === "absent" ? "active-absent" : ""}" onclick="setStatus('${student.id}', 'absent')">Absent</button>
                </div>
            </div>
        `;

    }).join("");

    updateSummary();

}


function setStatus(studentId, status) {
    currentStatuses[studentId] = status;
    renderRoster();
}


function updateSummary() {

    const values = Object.values(currentStatuses);
    const presentCount = values.filter(v => v === "present").length;
    const lateCount = values.filter(v => v === "late").length;
    const absentCount = values.filter(v => v === "absent").length;

    document.getElementById("summaryBar").innerHTML = `
        <span class="summary-pill present">${presentCount} Present</span>
        <span class="summary-pill late">${lateCount} Late</span>
        <span class="summary-pill absent">${absentCount} Absent</span>
    `;

}


async function saveAttendance() {

    const courseId = document.getElementById("courseSelect").value;
    const sessionDate = document.getElementById("sessionDate").value;
    const saveButton = document.getElementById("saveButton");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    const rows = currentRoster.map(student => ({
        student_id: student.id,
        course_id: courseId,
        session_date: sessionDate,
        status: currentStatuses[student.id]
    }));

    const { error } =
        await supabaseClient
            .from("attendance")
            .upsert(rows, { onConflict: "student_id,course_id,session_date" });

    saveButton.disabled = false;
    saveButton.textContent = "Save Attendance";

    if (error) {
        showMessage("Unable to save attendance: " + error.message, "error");
        return;
    }

    showMessage("Attendance saved successfully.", "success");
    await loadHistory(courseId);

}


async function loadHistory(courseId) {

    const historyContainer = document.getElementById("historyContainer");

    const { data, error } =
        await supabaseClient
            .from("attendance")
            .select("session_date, status")
            .eq("course_id", courseId)
            .order("session_date", { ascending: false });

    if (error || !data || data.length === 0) {
        historyContainer.innerHTML = `<p class="empty-note">No attendance history yet.</p>`;
        return;
    }

    const byDate = {};
    data.forEach(r => {
        if (!byDate[r.session_date]) byDate[r.session_date] = { present: 0, late: 0, absent: 0 };
        byDate[r.session_date][r.status] = (byDate[r.session_date][r.status] || 0) + 1;
    });

    const dates = Object.keys(byDate).sort().reverse().slice(0, 10);

    historyContainer.innerHTML = dates.map(date => {
        const counts = byDate[date];
        return `
            <div class="history-row">
                <span>${new Date(date).toLocaleDateString()}</span>
                <span>${counts.present || 0} Present • ${counts.late || 0} Late • ${counts.absent || 0} Absent</span>
            </div>
        `;
    }).join("");

}


startPage();

</script>

</body>
</html>
