<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Student Term Dates | E-Campus Admin</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #111827; color: white; padding: 18px 25px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 58px; height: 58px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 24px; }
.brand p { color: #d4af37; margin-top: 4px; }
.back-button { background: #d4af37; color: #111827; text-decoration: none; padding: 11px 18px; border-radius: 8px; font-weight: bold; }

.container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
.page-title { margin-bottom: 25px; }
.page-title h2 { font-size: 30px; margin-bottom: 7px; }
.page-title p { color: #6b7280; }

.message { padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; }
.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card { background: white; padding: 25px; border-radius: 14px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.07); }
.card h3 { margin-bottom: 6px; font-size: 22px; }
.card .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
select, input { width: 100%; padding: 13px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }

.end-date-preview {
    background: #eff6ff;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    color: #1d4ed8;
    margin-bottom: 16px;
    display: none;
}

.end-date-preview.show { display: block; }

.select-all-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb; }

.student-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
}

.student-row input[type="checkbox"] { width: 18px; height: 18px; }
.student-info { display: flex; align-items: center; gap: 12px; }
.student-number { color: #6b7280; font-size: 12px; }
.current-term-tag { background: #f3f4f6; color: #374151; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: bold; }

.apply-button {
    background: #d4af37;
    color: #111827;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 16px;
}

.empty-note { color: #9ca3af; text-align: center; padding: 20px 0; }
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div><h1>E-Campus Administration</h1><p>Sunningdale University</p></div>
    </div>
    <a href="admin-dashboard.html" class="back-button">← Admin Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Set Student Term Dates</h2>
        <p>Set when each student's personal term started (or will start). The system automatically calculates 6 weeks from that date and shows a live countdown to the student.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="card">

        <div class="form-grid">
            <div>
                <label style="font-weight:bold; display:block; margin-bottom:7px;">Term Number</label>
                <select id="termNumberSelect">
                    <option value="1">Term 1</option>
                    <option value="2">Term 2</option>
                    <option value="3">Term 3</option>
                </select>
            </div>
            <div>
                <label style="font-weight:bold; display:block; margin-bottom:7px;">Term Start Date</label>
                <input type="date" id="startDateInput">
            </div>
        </div>

        <div class="end-date-preview" id="endDatePreview"></div>

        <div style="margin-bottom:20px;">
            <label style="font-weight:bold; display:block; margin-bottom:7px;">Filter Students by Programme (optional)</label>
            <select id="programmeFilter"><option value="">All programmes</option></select>
        </div>

        <button class="apply-button" style="background:#0e7490; color:white; margin-top:0;" onclick="loadStudents()">Load Students</button>

    </section>

    <section class="card" id="studentsCard" style="display:none;">

        <h3 id="studentsHeading">Students</h3>

        <div class="select-all-row">
            <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
            <label for="selectAll" style="font-weight:bold;">Select All</label>
        </div>

        <div id="studentsList"></div>

        <button class="apply-button" onclick="applyTermDates()">Apply This Start Date to Selected Students</button>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function startPage() {

    const { data: programmes } = await supabaseClient.from("programmes").select("id, code, name").order("name");

    const select = document.getElementById("programmeFilter");
    (programmes || []).forEach(p => {
        const option = document.createElement("option");
        option.value = p.id;
        option.textContent = `${p.code} — ${p.name}`;
        select.appendChild(option);
    });

}


document.getElementById("startDateInput").addEventListener("change", function() {

    const preview = document.getElementById("endDatePreview");

    if (!this.value) {
        preview.classList.remove("show");
        return;
    }

    const startDate = new Date(this.value + "T00:00:00");
    const endDate = new Date(startDate);
    endDate.setDate(endDate.getDate() + 41); // 6 weeks = 42 days, so +41 gives the last day of week 6

    preview.textContent = `This term will automatically end on: ${endDate.toLocaleDateString()} (6 weeks from the start date)`;
    preview.classList.add("show");

});


async function loadStudents() {

    const termNumber = document.getElementById("termNumberSelect").value;
    const startDate = document.getElementById("startDateInput").value;
    const programmeId = document.getElementById("programmeFilter").value;

    if (!startDate) {
        showMessage("Please choose a start date first.", "error");
        return;
    }

    let query = supabaseClient
        .from("student_profiles")
        .select("id, student_number, user_profiles ( first_name, last_name ), programmes ( code )")
        .order("student_number");

    if (programmeId) {
        query = query.eq("programme_id", programmeId);
    }

    const { data: students, error } = await query;

    if (error) {
        showMessage("Unable to load students: " + error.message, "error");
        return;
    }

    if (!students || students.length === 0) {
        document.getElementById("studentsList").innerHTML = `<p class="empty-note">No students found.</p>`;
        document.getElementById("studentsCard").style.display = "block";
        return;
    }

    const studentIds = students.map(s => s.id);

    const { data: existingTerms } =
        await supabaseClient
            .from("student_terms")
            .select("student_id, term_number, start_date, end_date")
            .in("student_id", studentIds)
            .eq("term_number", termNumber);

    const termByStudent = {};
    (existingTerms || []).forEach(t => termByStudent[t.student_id] = t);

    document.getElementById("studentsHeading").textContent = `Students — setting Term ${termNumber} start date to ${new Date(startDate).toLocaleDateString()}`;

    document.getElementById("studentsList").innerHTML = students.map(s => {

        const name = s.user_profiles ? `${s.user_profiles.first_name} ${s.user_profiles.last_name}` : "Unknown";
        const existing = termByStudent[s.id];

        return `
            <div class="student-row">
                <div class="student-info">
                    <input type="checkbox" class="studentCheckbox" value="${s.id}">
                    <div>
                        <div style="font-weight:bold;">${escapeHtml(name)} ${s.programmes ? `(${escapeHtml(s.programmes.code)})` : ""}</div>
                        <div class="student-number">${escapeHtml(s.student_number)}</div>
                    </div>
                </div>
                ${existing ? `<span class="current-term-tag">Currently: Term ${existing.term_number} set for ${new Date(existing.start_date).toLocaleDateString()} → ${new Date(existing.end_date).toLocaleDateString()}</span>` : `<span class="current-term-tag">No Term ${termNumber} date set yet</span>`}
            </div>
        `;

    }).join("");

    document.getElementById("studentsCard").style.display = "block";

}


function toggleSelectAll() {
    const checked = document.getElementById("selectAll").checked;
    document.querySelectorAll(".studentCheckbox").forEach(cb => cb.checked = checked);
}


async function applyTermDates() {

    const termNumber = Number(document.getElementById("termNumberSelect").value);
    const startDateStr = document.getElementById("startDateInput").value;

    const selectedIds = Array.from(document.querySelectorAll(".studentCheckbox:checked")).map(cb => cb.value);

    if (selectedIds.length === 0) {
        showMessage("Please select at least one student.", "error");
        return;
    }

    const startDate = new Date(startDateStr + "T00:00:00");
    const endDate = new Date(startDate);
    endDate.setDate(endDate.getDate() + 41);

    const endDateStr = endDate.toISOString().split("T")[0];

    const { data: { user } } = await supabaseClient.auth.getUser();

    const rows = selectedIds.map(studentId => ({
        student_id: studentId,
        term_number: termNumber,
        start_date: startDateStr,
        end_date: endDateStr,
        set_by: user.id
    }));

    const { error } =
        await supabaseClient
            .from("student_terms")
            .upsert(rows, { onConflict: "student_id,term_number" });

    if (error) {
        showMessage("Unable to save: " + error.message, "error");
        return;
    }

    showMessage(`Term ${termNumber} dates set for ${selectedIds.length} student(s). Ends ${endDate.toLocaleDateString()}.`, "success");
    await loadStudents();

}


startPage();

</script>

</body>
</html>
