<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Course Management | E-Campus</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #172033;
        }

        /* ================= HEADER ================= */

        .header {
            background: #111827;
            color: white;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .brand h1 {
            font-size: 24px;
        }

        .brand p {
            color: #d4af37;
            margin-top: 4px;
        }

        .back-button {
            background: #d4af37;
            color: #111827;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
        }

        /* ================= MESSAGE ================= */

        .message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        /* ================= CARD ================= */

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.07);
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        .submit-button {
            margin-top: 20px;
            background: #d4af37;
            color: #111827;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .submit-button:hover {
            background: #c29d24;
        }

        /* ================= TABLE ================= */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .page-title h2 {
                font-size: 25px;
            }

            th,
            td {
                white-space: nowrap;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="brand">

        <img
            src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg"
            alt="Sunningdale University Logo"
            class="logo"
        >

        <div>

            <h1>
                E-Campus Administration
            </h1>

            <p>
                Sunningdale University
            </p>

        </div>

    </div>


    <a
        href="admin-dashboard.html"
        class="back-button"
    >
        ← Admin Dashboard
    </a>

</header>



<main class="container">


    <section class="page-title">

        <h2>
            Course Management
        </h2>

        <p>
            Create and manage university courses.
        </p>

    </section>


    <div
        id="message"
        class="message"
    ></div>



    <!-- ================= ADD COURSE ================= -->

    <section class="card">

        <h3>
            Add New Course
        </h3>


        <form id="courseForm">


            <div class="form-grid">


                <div class="form-group">

                    <label for="courseCode">
                        Course Code
                    </label>

                    <input
                        type="text"
                        id="courseCode"
                        placeholder="e.g. BBA101"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="courseName">
                        Course Name
                    </label>

                    <input
                        type="text"
                        id="courseName"
                        placeholder="e.g. Introduction to Business"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select
                        id="department"
                        required
                    >

                        <option value="">
                            Select department
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="level">
                        Academic Level
                    </label>

                    <select
                        id="level"
                        required
                    >

                        <option value="">
                            Select level
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="credits">
                        Credits
                    </label>

                    <input
                        type="number"
                        id="credits"
                        min="0"
                        step="0.5"
                        placeholder="e.g. 3"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="courseType">
                        Course Type
                    </label>

                    <select
                        id="courseType"
                        required
                    >

                        <option value="">
                            Select course type
                        </option>

                        <option value="CORE">
                            Core
                        </option>

                        <option value="ELECTIVE">
                            Elective
                        </option>

                        <option value="OPTIONAL">
                            Optional
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="ACTIVE">
                            ACTIVE
                        </option>

                        <option value="INACTIVE">
                            INACTIVE
                        </option>

                    </select>

                </div>



                <div class="form-group full">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe the course..."
                    ></textarea>

                </div>


            </div>


            <button
                type="submit"
                class="submit-button"
            >
                Add Course
            </button>


        </form>

    </section>



    <!-- ================= EXISTING COURSES ================= -->

    <section class="card">

        <h3>
            Existing Courses
        </h3>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Code
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Level
                        </th>

                        <th>
                            Credits
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="courseTableBody">

                    <tr>

                        <td colspan="7">
                            Loading courses...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>



<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>



<script>


const message =
    document.getElementById("message");


/* ================= MESSAGE ================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* ================= LOAD DEPARTMENTS ================= */

async function loadDepartments() {

    const select =
        document.getElementById("department");


    const { data, error } =
        await supabaseClient
            .from("departments")
            .select("id,name")
            .order("name");


    if (error) {

        console.error(error);

        showMessage(
            "Unable to load departments.",
            "error"
        );

        return;
    }


    data.forEach(department => {

        const option =
            document.createElement("option");

        option.value =
            department.id;

        option.textContent =
            department.name;

        select.appendChild(option);

    });

}


/* ================= LOAD LEVELS ================= */

async function loadLevels() {

    const select =
        document.getElementById("level");


    const { data, error } =
        await supabaseClient
            .from("levels")
            .select("id,name")
            .order("name");


    if (error) {

        console.error(error);

        showMessage(
            "Unable to load academic levels.",
            "error"
        );

        return;
    }


    data.forEach(level => {

        const option =
            document.createElement("option");

        option.value =
            level.id;

        option.textContent =
            level.name;

        select.appendChild(option);

    });

}


/* ================= LOAD COURSES ================= */

async function loadCourses() {

    const tbody =
        document.getElementById(
            "courseTableBody"
        );


    const { data, error } =
        await supabaseClient
            .from("courses")
            .select(`
                id,
                code,
                name,
                credits,
                course_type,
                status,
                departments(name),
                levels(name)
            `)
            .order("code");


    if (error) {

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    Unable to load courses.
                </td>
            </tr>
        `;

        return;
    }


    if (!data || data.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    No courses have been created yet.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML = "";


    data.forEach(course => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${course.code || ""}
            </td>

            <td>
                ${course.name || ""}
            </td>

            <td>
                ${course.departments?.name || "-"}
            </td>

            <td>
                ${course.levels?.name || "-"}
            </td>

            <td>
                ${course.credits || 0}
            </td>

            <td>
                ${course.course_type || "-"}
            </td>

            <td>

                <span
                    class="status ${
                        String(course.status).toLowerCase()
                    }"
                >
                    ${course.status || ""}
                </span>

            </td>

        `;


        tbody.appendChild(row);

    });

}


/* ================= ADD COURSE ================= */

document
    .getElementById("courseForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const code =
                document
                    .getElementById("courseCode")
                    .value
                    .trim()
                    .toUpperCase();


            const name =
                document
                    .getElementById("courseName")
                    .value
                    .trim();


            const department_id =
                document
                    .getElementById("department")
                    .value;


            const level_id =
                document
                    .getElementById("level")
                    .value;


            const credits =
                document
                    .getElementById("credits")
                    .value;


            const course_type =
                document
                    .getElementById("courseType")
                    .value;


            const status =
                document
                    .getElementById("status")
                    .value;


            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            const { error } =
                await supabaseClient
                    .from("courses")
                    .insert({

                        code,
                        name,
                        description,
                        department_id,
                        level_id,
                        credits,
                        course_type,
                        status

                    });


            if (error) {

                console.error(error);

                showMessage(
                    error.message,
                    "error"
                );

                return;
            }


            showMessage(
                "Course created successfully.",
                "success"
            );


            document
                .getElementById("courseForm")
                .reset();


            document
                .getElementById("status")
                .value = "ACTIVE";


            await loadCourses();

        });


/* ================= START ================= */

async function startPage() {

    await Promise.all([

        loadDepartments(),

        loadLevels()

    ]);


    await loadCourses();

}


startPage();


</script>


</body>

</html>
