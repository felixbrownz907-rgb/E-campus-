<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Periods | E-Campus Admin</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #111827; color: white; padding: 18px 25px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 22px; }
.brand p { color: #d4af37; margin-top: 3px; }
.back-button { background: #d4af37; color: #111827; text-decoration: none; padding: 11px 18px; border-radius: 8px; font-weight: bold; }

.container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
.page-title { margin-bottom: 20px; }
.page-title h2 { font-size: 28px; margin-bottom: 6px; }
.page-title p { color: #6b7280; }

.message { padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; }
.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card { background: white; padding: 22px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
.card h3 { font-size: 18px; margin-bottom: 16px; }

label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 6px; }

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 14px;
}

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.save-button {
    background: #111827;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}

.period-item {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.period-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; flex-wrap: wrap; }
.period-label { font-weight: bold; font-size: 15px; }
.period-dates { font-size: 13px; color: #6b7280; margin-top: 4px; }
.period-student-count { font-size: 12px; color: #6b7280; margin-top: 6px; }

.status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
.status-badge.active { background: #dcfce7; color: #166534; }
.status-badge.inactive { background: #f3f4f6; color: #6b7280; }
.status-badge.current { background: #eff6ff; color: #1d4ed8; }

.action-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.action-button { border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
.close-button { background: #fee2e2; color: #991b1b; }
.reopen-button { background: #dcfce7; color: #166534; }
.manage-students-button { background: #ede9fe; color: #6d28d9; }

.students-panel {
    display: none;
    margin-top: 14px;
    border-top: 1px solid #f0f1f3;
    padding-top: 14px;
}

.students-panel.open { display: block; }

.student-search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.student-search-row input { margin-bottom: 0; flex: 1; }

.add-student-button {
    background: #111827;
    color: white;
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.search-results {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    max-height: 180px;
    overflow-y: auto;
    margin-bottom: 12px;
}

.search-result-item {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f1f3;
    cursor: pointer;
    font-size: 13px;
}

.search-result-item:hover { background: #f4f6f9; }
.search-result-item:last-child { border-bottom: none; }

.attached-students-label { font-size: 12px; font-weight: bold; color: #6b7280; margin-bottom: 8px; }

.attached-student-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #f9fafb;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
}

.remove-student-button {
    background: none;
    border: none;
    color: #991b1b;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

.empty-note { color: #9ca3af; text-align: center; padding: 30px 0; }

@media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
}

</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div><h1>E-Campus Administration</h1><p>Sunningdale University</p></div>
    </div>
    <a href="admin-dashboard.html" class="back-button">← Admin Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Exam Periods</h2>
        <p>Open a window for Supplementary/Deferred registration and exam-writing for a specific group of students once their term has ended.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="card">

        <h3>Create New Exam Period</h3>

        <label for="periodLabel">Label</label>
        <input type="text" id="periodLabel" placeholder="e.g. September 2026 Intake — Supplementary/Deferred">

        <div class="form-row">
            <div>
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate">
            </div>
            <div>
                <label for="endDate">End Date</label>
                <input type="date" id="endDate">
            </div>
        </div>

        <button class="save-button" onclick="createPeriod()">Create Exam Period</button>

    </section>

    <section>
        <h3 style="margin-bottom:14px;">All Exam Periods</h3>
        <div id="periodsContainer"><p class="empty-note">Loading...</p></div>
    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const message = document.getElementById("message");
let allPeriods = [];
let openStudentsPanelId = null;

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    setTimeout(() => { message.className = "message"; }, 4000);
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadPeriods() {

    const container = document.getElementById("periodsContainer");
    container.innerHTML = `<p class="empty-note">Loading...</p>`;

    const { data: periods, error } =
        await supabaseClient
            .from("exam_periods")
            .select("*")
            .order("start_date", { ascending: false });

    if (error) {
        container.innerHTML = `<p class="empty-note">Unable to load: ${escapeHtml(error.message)}</p>`;
        return;
    }

    allPeriods = periods || [];

    if (allPeriods.length === 0) {
        container.innerHTML = `<p class="empty-note">No exam periods created yet.</p>`;
        return;
    }

    const periodIds = allPeriods.map(p => p.id);

    const { data: studentLinks } =
        await supabaseClient
            .from("exam_period_students")
            .select("period_id")
            .in("period_id", periodIds);

    const countByPeriod = {};
    (studentLinks || []).forEach(l => {
        countByPeriod[l.period_id] = (countByPeriod[l.period_id] || 0) + 1;
    });

    const today = new Date().toISOString().split("T")[0];

    container.innerHTML = allPeriods.map(p => {

        const isCurrentlyRunning = p.is_active && today >= p.start_date && today <= p.end_date;

        let statusBadge = `<span class="status-badge inactive">Closed</span>`;
        if (isCurrentlyRunning) statusBadge = `<span class="status-badge current">Currently Open</span>`;
        else if (p.is_active) statusBadge = `<span class="status-badge active">Active (outside date range)</span>`;

        const studentCount = countByPeriod[p.id] || 0;
        const isPanelOpen = openStudentsPanelId === p.id;

        return `
            <div class="period-item">
                <div class="period-top">
                    <div>
                        <div class="period-label">${escapeHtml(p.label)}</div>
                        <div class="period-dates">${new Date(p.start_date + "T00:00:00").toLocaleDateString()} — ${new Date(p.end_date + "T00:00:00").toLocaleDateString()}</div>
                        <div class="period-student-count">👥 ${studentCount} student(s) attached</div>
                    </div>
                    ${statusBadge}
                </div>
                <div class="action-row">
                    ${p.is_active
                        ? `<button class="action-button close-button" onclick="togglePeriod('${p.id}', false)">Close This Period</button>`
                        : `<button class="action-button reopen-button" onclick="togglePeriod('${p.id}', true)">Reopen This Period</button>`
                    }
                    <button class="action-button manage-students-button" onclick="toggleStudentsPanel('${p.id}')">${isPanelOpen ? "Hide" : "👥 Manage Students"}</button>
                </div>

                <div class="students-panel ${isPanelOpen ? "open" : ""}" id="panel-${p.id}">
                    <div class="student-search-row">
                        <input type="text" id="search-${p.id}" placeholder="Search by student number or name..." oninput="searchStudents('${p.id}')">
                    </div>
                    <div class="search-results" id="searchResults-${p.id}" style="display:none;"></div>

                    <div class="attached-students-label">Currently attached:</div>
                    <div id="attachedList-${p.id}"><p class="empty-note">Loading...</p></div>
                </div>
            </div>
        `;

    }).join("");

    // Load the attached student list for whichever panel is currently open
    if (openStudentsPanelId) {
        await loadAttachedStudents(openStudentsPanelId);
    }

}


function toggleStudentsPanel(periodId) {
    openStudentsPanelId = (openStudentsPanelId === periodId) ? null : periodId;
    loadPeriods();
}


async function loadAttachedStudents(periodId) {

    const container = document.getElementById(`attachedList-${periodId}`);
    if (!container) return;

    container.innerHTML = `<p class="empty-note">Loading...</p>`;

    const { data: links, error } =
        await supabaseClient
            .from("exam_period_students")
            .select("id, student_profiles ( id, student_number, user_profiles ( first_name, last_name ) )")
            .eq("period_id", periodId);

    if (error) {
        container.innerHTML = `<p class="empty-note">Unable to load: ${escapeHtml(error.message)}</p>`;
        return;
    }

    if (!links || links.length === 0) {
        container.innerHTML = `<p class="empty-note">No students attached yet. Search above to add some.</p>`;
        return;
    }

    container.innerHTML = links.map(link => {

        const sp = link.student_profiles;
        const name = sp?.user_profiles ? `${sp.user_profiles.first_name} ${sp.user_profiles.last_name}` : "Unknown";

        return `
            <div class="attached-student-item">
                <span>${escapeHtml(sp?.student_number || "")} — ${escapeHtml(name)}</span>
                <button class="remove-student-button" onclick="removeStudent('${link.id}', '${periodId}')">Remove</button>
            </div>
        `;

    }).join("");

}


let searchDebounceTimeout = null;

function searchStudents(periodId) {

    if (searchDebounceTimeout) clearTimeout(searchDebounceTimeout);

    searchDebounceTimeout = setTimeout(async () => {

        const query = document.getElementById(`search-${periodId}`).value.trim();
        const resultsContainer = document.getElementById(`searchResults-${periodId}`);

        if (!query) {
            resultsContainer.style.display = "none";
            resultsContainer.innerHTML = "";
            return;
        }

        const { data: students, error } =
            await supabaseClient
                .from("student_profiles")
                .select("id, student_number, user_profiles ( first_name, last_name )")
                .or(`student_number.ilike.%${query}%`)
                .limit(10);

        // Also search by name separately since Supabase can't easily OR across a joined table in one query
        const { data: nameMatches } =
            await supabaseClient
                .from("student_profiles")
                .select("id, student_number, user_profiles!inner ( first_name, last_name )")
                .or(`first_name.ilike.%${query}%,last_name.ilike.%${query}%`, { foreignTable: "user_profiles" })
                .limit(10);

        const combined = [...(students || []), ...(nameMatches || [])];
        const uniqueById = {};
        combined.forEach(s => { uniqueById[s.id] = s; });
        const results = Object.values(uniqueById);

        if (results.length === 0) {
            resultsContainer.style.display = "block";
            resultsContainer.innerHTML = `<div class="search-result-item">No matching students found.</div>`;
            return;
        }

        resultsContainer.style.display = "block";
        resultsContainer.innerHTML = results.map(s => {
            const name = s.user_profiles ? `${s.user_profiles.first_name} ${s.user_profiles.last_name}` : "Unknown";
            return `<div class="search-result-item" onclick="addStudent('${periodId}', '${s.id}')">${escapeHtml(s.student_number)} — ${escapeHtml(name)}</div>`;
        }).join("");

    }, 350);

}


async function addStudent(periodId, studentProfileId) {

    const { error } =
        await supabaseClient.from("exam_period_students").insert({
            period_id: periodId,
            student_id: studentProfileId
        });

    if (error) {
        showMessage(error.code === "23505" ? "That student is already attached to this period." : "Unable to add: " + error.message, "error");
        return;
    }

    document.getElementById(`search-${periodId}`).value = "";
    document.getElementById(`searchResults-${periodId}`).style.display = "none";

    showMessage("Student added to exam period.", "success");
    await loadAttachedStudents(periodId);
    await loadPeriods();

}


async function removeStudent(linkId, periodId) {

    const { error } = await supabaseClient.from("exam_period_students").delete().eq("id", linkId);

    if (error) {
        showMessage("Unable to remove: " + error.message, "error");
        return;
    }

    showMessage("Student removed from exam period.", "success");
    await loadAttachedStudents(periodId);
    await loadPeriods();

}


async function createPeriod() {

    const label = document.getElementById("periodLabel").value.trim();
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;

    if (!label || !startDate || !endDate) {
        showMessage("Please fill in the label, start date, and end date.", "error");
        return;
    }

    if (endDate < startDate) {
        showMessage("End date cannot be before the start date.", "error");
        return;
    }

    const { data: { user } } = await supabaseClient.auth.getUser();

    const { error } =
        await supabaseClient.from("exam_periods").insert({
            label: label,
            start_date: startDate,
            end_date: endDate,
            is_active: true,
            created_by: user.id
        });

    if (error) {
        showMessage("Unable to create: " + error.message, "error");
        return;
    }

    showMessage("Exam period created. Use \"Manage Students\" below to add who it applies to.", "success");
    document.getElementById("periodLabel").value = "";
    document.getElementById("startDate").value = "";
    document.getElementById("endDate").value = "";

    await loadPeriods();

}


async function togglePeriod(periodId, newStatus) {

    const { error } =
        await supabaseClient
            .from("exam_periods")
            .update({ is_active: newStatus })
            .eq("id", periodId);

    if (error) {
        showMessage("Unable to update: " + error.message, "error");
        return;
    }

    showMessage(newStatus ? "Period reopened." : "Period closed.", "success");
    await loadPeriods();

}


loadPeriods();

</script>

</body>
</html>
