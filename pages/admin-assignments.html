<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment Management | E-Campus</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    color: #172033;
}

.header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 58px; height: 58px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 24px; }
.brand p { color: #d4af37; margin-top: 4px; }

.back-button {
    background: #d4af37;
    color: #111827;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
}

.container { max-width: 1250px; margin: 30px auto; padding: 0 20px; }

.page-title { margin-bottom: 25px; }
.page-title h2 { font-size: 30px; margin-bottom: 7px; }
.page-title p { color: #6b7280; }

.message {
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.card h3 { margin-bottom: 20px; font-size: 22px; }

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group { display: flex; flex-direction: column; }
.form-group.full { grid-column: 1 / -1; }

label { font-weight: bold; margin-bottom: 7px; }

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

textarea { min-height: 100px; resize: vertical; }

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #d4af37;
}

.submit-button {
    margin-top: 20px;
    background: #d4af37;
    color: #111827;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}

.submit-button:hover { background: #c29d24; }

.cancel-button {
    margin-top: 12px;
    background: #6b7280;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    display: none;
}

.table-container { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }

th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
}

th { background: #111827; color: white; }
tr:hover { background: #f9fafb; }

.action-button {
    border: none;
    padding: 7px 11px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 5px;
    font-size: 13px;
}

.edit-button { background: #e5e7eb; color: #111827; }
.delete-button { background: #fee2e2; color: #991b1b; }
.grade-button { background: #dcfce7; color: #166534; }

.submissions-panel {
    display: none;
    margin-top: 14px;
    padding: 14px;
    background: #f4f6f9;
    border-radius: 10px;
}

.submission-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    background: white;
    border-radius: 8px;
    margin-bottom: 8px;
    gap: 10px;
    flex-wrap: wrap;
}

.grade-inputs { display: flex; gap: 8px; align-items: center; }
.grade-inputs input { width: 70px; padding: 8px; }

@media (max-width: 700px) {
    .header { flex-direction: column; align-items: flex-start; gap: 15px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: auto; }
    th, td { white-space: nowrap; }
}

</style>
</head>


<body>


<header class="header">

    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div>
            <h1>E-Campus Administration</h1>
            <p>Sunningdale University</p>
        </div>
    </div>

    <a href="admin-dashboard.html" class="back-button">← Admin Dashboard</a>

</header>


<main class="container">

    <section class="page-title">
        <h2>Assignment Management</h2>
        <p>Create assignments per module, and review/grade student submissions.</p>
    </section>

    <div id="message" class="message"></div>


    <section class="card">

        <h3 id="formTitle">Add New Assignment</h3>

        <form id="assignmentForm">

            <div class="form-grid">

                <div class="form-group full">
                    <label for="course">Course</label>
                    <select id="course" required>
                        <option value="">Select course</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="module">Module</label>
                    <select id="module" required disabled>
                        <option value="">Select course first</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="title">Assignment Title</label>
                    <input type="text" id="title" required placeholder="e.g. Assignment 1 — Database Design">
                </div>

                <div class="form-group">
                    <label for="dueDate">Due Date</label>
                    <input type="datetime-local" id="dueDate">
                </div>

                <div class="form-group">
                    <label for="maxScore">Max Score</label>
                    <input type="number" id="maxScore" value="100" min="1">
                </div>

                <div class="form-group full">
                    <label for="description">Description / Instructions</label>
                    <textarea id="description" placeholder="Describe the assignment..."></textarea>
                </div>

            </div>

            <button type="submit" class="submit-button" id="submitButton">Add Assignment</button>
            <button type="button" class="cancel-button" id="cancelButton">Cancel Editing</button>

        </form>

    </section>


    <section class="card">

        <h3>Existing Assignments</h3>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Module</th>
                        <th>Title</th>
                        <th>Due Date</th>
                        <th>Submissions</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="assignmentTableBody">
                    <tr><td colspan="6">Loading assignments...</td></tr>
                </tbody>

            </table>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

let editingAssignmentId = null;
let allModules = [];

const message = document.getElementById("message");


function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ================= LOAD COURSES ================= */

async function loadCourses() {

    const select = document.getElementById("course");

    const { data, error } = await supabaseClient.from("courses").select("id, code, name").order("code");

    if (error) {
        console.error(error);
        return;
    }

    data.forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = `${c.code} — ${c.name}`;
        select.appendChild(option);
    });

}


/* ================= LOAD MODULES BY COURSE ================= */

async function loadModulesByCourse(courseId) {

    const select = document.getElementById("module");
    select.innerHTML = `<option value="">Loading modules...</option>`;
    select.disabled = true;

    if (!courseId) {
        select.innerHTML = `<option value="">Select course first</option>`;
        return;
    }

    const { data, error } =
        await supabaseClient
            .from("course_modules")
            .select("id, module_number, title")
            .eq("course_id", courseId)
            .order("module_number");

    if (error) {
        console.error(error);
        select.innerHTML = `<option value="">Unable to load modules</option>`;
        return;
    }

    select.innerHTML = `<option value="">Select module</option>`;

    if (!data || data.length === 0) {
        select.innerHTML = `<option value="">No modules found for this course</option>`;
        return;
    }

    data.forEach(m => {
        const option = document.createElement("option");
        option.value = m.id;
        option.textContent = `Module ${m.module_number} — ${m.title}`;
        select.appendChild(option);
    });

    select.disabled = false;

}


document.getElementById("course").addEventListener("change", function() {
    loadModulesByCourse(this.value);
});


/* ================= SUBMIT ASSIGNMENT FORM ================= */

document.getElementById("assignmentForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const assignmentData = {
        module_id: document.getElementById("module").value,
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim() || null,
        due_date: document.getElementById("dueDate").value || null,
        max_score: Number(document.getElementById("maxScore").value) || 100,
        status: "active"
    };

    let error;

    if (editingAssignmentId) {
        const result = await supabaseClient.from("assignments").update(assignmentData).eq("id", editingAssignmentId);
        error = result.error;
    } else {
        const result = await supabaseClient.from("assignments").insert(assignmentData);
        error = result.error;
    }

    if (error) {
        showMessage(error.message, "error");
        return;
    }

    showMessage(editingAssignmentId ? "Assignment updated." : "Assignment created.", "success");
    resetForm();
    await loadAssignments();

});


/* ================= LOAD ASSIGNMENTS ================= */

async function loadAssignments() {

    const tbody = document.getElementById("assignmentTableBody");

    const { data, error } =
        await supabaseClient
            .from("assignments")
            .select(`
                id, title, due_date, module_id,
                course_modules ( module_number, title, course_id, courses ( code, name ) )
            `)
            .order("due_date");

    if (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="6">Unable to load: ${escapeHtml(error.message)}</td></tr>`;
        return;
    }

    if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6">No assignments created yet.</td></tr>`;
        return;
    }

    tbody.innerHTML = "";

    for (const assignment of data) {

        const { count } = await supabaseClient
            .from("submissions")
            .select("id", { count: "exact", head: true })
            .eq("assignment_id", assignment.id);

        const module = assignment.course_modules;
        const course = module?.courses;

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${course ? escapeHtml(course.code) : "-"}</td>
            <td>${module ? escapeHtml("Module " + module.module_number) : "-"}</td>
            <td>${escapeHtml(assignment.title)}</td>
            <td>${assignment.due_date ? new Date(assignment.due_date).toLocaleString() : "-"}</td>
            <td>${count || 0}</td>
            <td>
                <button class="action-button grade-button" onclick="toggleSubmissions('${assignment.id}')">View Submissions</button>
                <button class="action-button edit-button" onclick="editAssignment('${assignment.id}')">Edit</button>
                <button class="action-button delete-button" onclick="deleteAssignment('${assignment.id}')">Delete</button>
            </td>
        `;

        tbody.appendChild(row);

        const panelRow = document.createElement("tr");
        panelRow.innerHTML = `<td colspan="6"><div class="submissions-panel" id="panel-${assignment.id}"></div></td>`;
        tbody.appendChild(panelRow);

    }

}


/* ================= VIEW / GRADE SUBMISSIONS ================= */

async function toggleSubmissions(assignmentId) {

    const panel = document.getElementById(`panel-${assignmentId}`);

    if (panel.style.display === "block") {
        panel.style.display = "none";
        return;
    }

    panel.style.display = "block";
    panel.innerHTML = "Loading submissions...";

    const { data, error } =
        await supabaseClient
            .from("submissions")
            .select(`
                id, content, file_url, score, feedback, submitted_at,
                student_id
            `)
            .eq("assignment_id", assignmentId)
            .order("submitted_at", { ascending: false });

    if (error) {
        panel.innerHTML = `Unable to load submissions: ${escapeHtml(error.message)}`;
        return;
    }

    if (!data || data.length === 0) {
        panel.innerHTML = `<p style="color:#9ca3af;">No submissions yet.</p>`;
        return;
    }

    let html = "";

    for (const sub of data) {

        const { data: profile } =
            await supabaseClient
                .from("user_profiles")
                .select("first_name, last_name")
                .eq("id", sub.student_id)
                .single();

        const name = profile ? `${profile.first_name} ${profile.last_name}` : "Unknown student";

        html += `
            <div class="submission-row">
                <div>
                    <strong>${escapeHtml(name)}</strong><br>
                    <span style="font-size:12px; color:#6b7280;">Submitted: ${new Date(sub.submitted_at).toLocaleString()}</span><br>
                    <span style="font-size:13px;">${escapeHtml(sub.content || "No text content")}</span>
                </div>
                <div class="grade-inputs">
                    <input type="number" placeholder="Score" value="${sub.score ?? ""}" id="score-${sub.id}">
                    <button class="action-button grade-button" onclick="saveGrade('${sub.id}', '${assignmentId}')">Save Grade</button>
                </div>
            </div>
        `;

    }

    panel.innerHTML = html;

}


async function saveGrade(submissionId, assignmentId) {

    const score = document.getElementById(`score-${submissionId}`).value;

    const { error } =
        await supabaseClient
            .from("submissions")
            .update({ score: score === "" ? null : Number(score), status: "graded", graded_at: new Date().toISOString() })
            .eq("id", submissionId);

    if (error) {
        showMessage("Unable to save grade: " + error.message, "error");
        return;
    }

    showMessage("Grade saved.", "success");
    toggleSubmissions(assignmentId);
    toggleSubmissions(assignmentId);

}


/* ================= EDIT / DELETE ASSIGNMENT ================= */

async function editAssignment(id) {

    const { data, error } =
        await supabaseClient
            .from("assignments")
            .select(`*, course_modules ( course_id )`)
            .eq("id", id)
            .single();

    if (error) {
        showMessage("Unable to load assignment: " + error.message, "error");
        return;
    }

    editingAssignmentId = data.id;

    const courseId = data.course_modules?.course_id;
    document.getElementById("course").value = courseId || "";
    await loadModulesByCourse(courseId);
    document.getElementById("module").value = data.module_id;

    document.getElementById("title").value = data.title || "";
    document.getElementById("description").value = data.description || "";
    document.getElementById("maxScore").value = data.max_score || 100;

    if (data.due_date) {
        const d = new Date(data.due_date);
        document.getElementById("dueDate").value = d.toISOString().slice(0, 16);
    }

    document.getElementById("formTitle").textContent = "Edit Assignment";
    document.getElementById("submitButton").textContent = "Update Assignment";
    document.getElementById("cancelButton").style.display = "block";

    window.scrollTo({ top: 0, behavior: "smooth" });

}


async function deleteAssignment(id) {

    const confirmed = confirm("Delete this assignment? This will also remove related submissions.");
    if (!confirmed) return;

    await supabaseClient.from("submissions").delete().eq("assignment_id", id);
    const { error } = await supabaseClient.from("assignments").delete().eq("id", id);

    if (error) {
        showMessage("Unable to delete: " + error.message, "error");
        return;
    }

    showMessage("Assignment deleted.", "success");
    await loadAssignments();

}


document.getElementById("cancelButton").addEventListener("click", resetForm);


function resetForm() {
    editingAssignmentId = null;
    document.getElementById("assignmentForm").reset();
    document.getElementById("module").innerHTML = `<option value="">Select course first</option>`;
    document.getElementById("module").disabled = true;
    document.getElementById("formTitle").textContent = "Add New Assignment";
    document.getElementById("submitButton").textContent = "Add Assignment";
    document.getElementById("cancelButton").style.display = "none";
}


async function startPage() {
    await loadCourses();
    await loadAssignments();
}

startPage();

</script>

</body>
</html>
