<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

// ============================================================
// AUTOMATIC DATE MODEL — everything below is calculated purely from
// each term's own end_date (which admin already sets). No manual
// per-student period assignment is needed for the normal flow.
//
// TERM ends on end_date.
// EXAM PERIOD:            end_date + 1  through  end_date + 7   (7 days)
//                          — CA1/CA2 late catch-up + End-of-Term itself
// SUPPLEMENTARY/DEFERRED: end_date + 12 through  end_date + 14  (3 days,
//                          starting 5 days after the Exam Period ends)
// ============================================================

const CA1_CA2_FEE_REQUIREMENT = { ca1: 50, ca2: 75 };
const END_OF_TERM_FEE_REQUIREMENT = 100;
const REGISTRATION_WINDOW_DAYS = 4; // CA1/CA2 registration opens this many days before their in-term date
const CA_DAY_OFFSET = { ca1: 14, ca2: 28 }; // CA1/CA2 still sit inside the active term, unchanged

const EXAM_PERIOD_START_OFFSET = 1;
const EXAM_PERIOD_LENGTH_DAYS = 7;
const SUPP_DEFERRED_GAP_DAYS = 5;
const SUPP_DEFERRED_LENGTH_DAYS = 3;

const EXAM_LABEL = { ca1: "CA1", ca2: "CA2", end_of_term: "End-of-Term" };

let studentProfileId = null;
let enrolledCourses = [];
let currentMode = "normal";
let allTerms = [];
let activeTerm = null;
let mostRecentEndedTerm = null;
let existingRegistrations = [];
let manualOverridePeriod = null; // admin's manual exam_periods override, if one currently covers this student

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
}


function daysBetween(a, b) {
    return Math.ceil((b - a) / (1000 * 60 * 60 * 24));
}


function getExamPeriodWindow(term) {
    const end = new Date(term.end_date + "T00:00:00");
    const start = addDays(end, EXAM_PERIOD_START_OFFSET);
    const finish = addDays(start, EXAM_PERIOD_LENGTH_DAYS - 1);
    return { start, finish };
}


function getSuppDeferredWindow(term) {
    const examPeriod = getExamPeriodWindow(term);
    const start = addDays(examPeriod.finish, SUPP_DEFERRED_GAP_DAYS);
    const finish = addDays(start, SUPP_DEFERRED_LENGTH_DAYS - 1);
    return { start, finish };
}


async function startPage() {

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "student-login.html";
        return;
    }

    const { data: studentProfile } =
        await supabaseClient.from("student_profiles").select("id").eq("user_id", user.id).single();

    if (!studentProfile) {
        document.getElementById("content").innerHTML = `<p class="empty-note">Unable to load your student profile.</p>`;
        return;
    }

    studentProfileId = studentProfile.id;

    const { data: terms } =
        await supabaseClient
            .from("student_terms")
            .select("*")
            .eq("student_id", studentProfileId)
            .order("term_number", { ascending: true });

    allTerms = terms || [];

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    activeTerm = allTerms.find(t => {
        const start = new Date(t.start_date + "T00:00:00");
        const end = new Date(t.end_date + "T00:00:00");
        return today >= start && today <= end;
    });

    mostRecentEndedTerm = allTerms
        .filter(t => new Date(t.end_date + "T00:00:00") < today)
        .sort((a, b) => new Date(b.end_date) - new Date(a.end_date))[0];

    // Manual admin override — kept as a backup path for genuine exceptions, on top of the automatic dates.
    const { data: myPeriodLinks } =
        await supabaseClient
            .from("exam_period_students")
            .select("period_id")
            .eq("student_id", studentProfileId);

    const myPeriodIds = (myPeriodLinks || []).map(l => l.period_id);

    if (myPeriodIds.length > 0) {

        const todayStr = today.toISOString().split("T")[0];

        const { data: openPeriods } =
            await supabaseClient
                .from("exam_periods")
                .select("*")
                .in("id", myPeriodIds)
                .eq("is_active", true)
                .lte("start_date", todayStr)
                .gte("end_date", todayStr)
                .order("start_date", { ascending: false })
                .limit(1);

        manualOverridePeriod = (openPeriods && openPeriods.length > 0) ? openPeriods[0] : null;

    } else {
        manualOverridePeriod = null;
    }

    const { data: enrollments } =
        await supabaseClient
            .from("enrollments")
            .select("courses ( id, code, name )")
            .eq("student_id", studentProfileId)
            .eq("status", "enrolled");

    enrolledCourses = (enrollments || []).map(e => e.courses).filter(Boolean);

    const { data: registrations } =
        await supabaseClient
            .from("exam_registrations")
            .select("*")
            .eq("student_id", studentProfileId);

    existingRegistrations = registrations || [];

    renderContent();

}


function selectMode(mode) {
    currentMode = mode;
    ["normal", "supplementary", "deferred"].forEach(m => {
        document.getElementById(`modeCard-${m}`).classList.toggle("selected", m === mode);
    });
    renderContent();
}


async function calculateFeePercentageForTerm(term) {

    if (!term) return null;

    const { data: feeRecords } =
        await supabaseClient
            .from("student_term_fees")
            .select("id, total_fee, academic_term_id")
            .eq("student_id", studentProfileId);

    if (!feeRecords || feeRecords.length === 0) return null;

    const feeRecordIds = feeRecords.map(r => r.id);

    const { data: allPayments } =
        feeRecordIds.length > 0
            ? await supabaseClient.from("fee_payments").select("student_fee_id, amount").in("student_fee_id", feeRecordIds)
            : { data: [] };

    const paidByRecordId = {};
    (allPayments || []).forEach(p => {
        paidByRecordId[p.student_fee_id] = (paidByRecordId[p.student_fee_id] || 0) + Number(p.amount);
    });

    let totalFee = 0;
    let totalPaid = 0;

    for (const record of feeRecords) {
        totalFee += Number(record.total_fee);
        totalPaid += paidByRecordId[record.id] || 0;
    }

    if (totalFee <= 0) return null;

    return Math.round((totalPaid / totalFee) * 100);

}


function findExistingRegistration(courseId, examType, mode) {
    return existingRegistrations.find(r =>
        r.course_id === courseId && r.exam_type === examType && r.registration_mode === mode
    );
}


async function renderContent() {

    const content = document.getElementById("content");
    content.innerHTML = `<p class="empty-note">Loading...</p>`;

    if (enrolledCourses.length === 0) {
        content.innerHTML = `<p class="empty-note">You are not enrolled in any courses yet.</p>`;
        return;
    }

    if (currentMode === "normal") {
        await renderNormalMode();
    } else {
        await renderSpecialMode(currentMode);
    }

}


async function renderNormalMode() {

    const content = document.getElementById("content");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (!activeTerm && !mostRecentEndedTerm) {
        content.innerHTML = `<p class="empty-note">You don't have any term set up yet, so exam registration isn't available.</p>`;
        return;
    }

    const activeTermFee = activeTerm ? await calculateFeePercentageForTerm(activeTerm) : null;
    const endedTermFee = mostRecentEndedTerm ? await calculateFeePercentageForTerm(mostRecentEndedTerm) : null;

    const endedExamPeriod = mostRecentEndedTerm ? getExamPeriodWindow(mostRecentEndedTerm) : null;
    const inEndedExamPeriod = endedExamPeriod && today >= endedExamPeriod.start && today <= endedExamPeriod.finish;

    let html = "";

    // ===== CA1 and CA2: primarily within the active term, with late catch-up during the ended =====
    // term's Exam Period if they were missed and that term is the one this student just finished.
    for (const examType of ["ca1", "ca2"]) {

        const existing = findExistingRegistration is undefined ? null : null; // placeholder guard, real check below
        const already = enrolledCourses.every(c => findExistingRegistration(c.id, examType, "normal"));

        let statusBadge = "";
        let bodyHtml = "";

        if (activeTerm) {

            const termStart = new Date(activeTerm.start_date + "T00:00:00");
            const examDate = addDays(termStart, CA_DAY_OFFSET[examType]);
            const windowOpenDate = addDays(examDate, -REGISTRATION_WINDOW_DAYS);
            const requirement = CA1_CA2_FEE_REQUIREMENT[examType];

            if (today < windowOpenDate) {

                const daysUntilOpen = daysBetween(today, windowOpenDate);
                statusBadge = `<span class="status-badge not-open">Not Open Yet</span>`;
                bodyHtml = `<div class="countdown-note">📅 Registration opens in ${daysUntilOpen} day${daysUntilOpen === 1 ? "" : "s"} — ${REGISTRATION_WINDOW_DAYS} days before the exam.</div>`;

            } else if (today <= examDate) {

                bodyHtml = renderFeeGatedChecklist(activeTermFee, requirement, activeTerm, examType, "normal", false);
                statusBadge = bodyHtml.openBadge;
                bodyHtml = bodyHtml.html;

            } else if (inEndedExamPeriod === false && mostRecentEndedTerm && activeTerm.term_number === mostRecentEndedTerm.term_number) {

                // Shouldn't normally hit — same term can't be both active and ended — kept for safety.
                statusBadge = `<span class="status-badge closed">Registration Closed</span>`;
                bodyHtml = `<p class="empty-note">The registration window for this exam has closed.</p>`;

            } else {

                statusBadge = `<span class="status-badge closed">Registration Closed</span>`;
                bodyHtml = `<p class="empty-note">The registration window for this exam has closed. If you're now in your Exam Period (right after your term ended), check below — you may still be able to register there.</p>`;

            }

        }

        // Late catch-up during the ended term's Exam Period (applies whether or not the above ran,
        // since a student might have no active term at all right now — e.g. between terms).
        if ((!activeTerm || !bodyHtml) && mostRecentEndedTerm && inEndedExamPeriod) {

            const requirement = CA1_CA2_FEE_REQUIREMENT[examType];
            const result = renderFeeGatedChecklist(endedTermFee, requirement, mostRecentEndedTerm, examType, "normal", true);
            statusBadge = result.openBadge;
            bodyHtml = result.html;

        } else if (!activeTerm && !mostRecentEndedTerm) {

            statusBadge = `<span class="status-badge closed">Not Available</span>`;
            bodyHtml = `<p class="empty-note">No term found to register against.</p>`;

        } else if (!bodyHtml) {

            statusBadge = `<span class="status-badge closed">Registration Closed</span>`;
            bodyHtml = `<p class="empty-note">This registration window is not currently open.</p>`;

        }

        html += `
            <div class="exam-type-block">
                <div class="exam-type-top">
                    <div><h3>${EXAM_LABEL[examType]}</h3></div>
                    ${statusBadge}
                </div>
                ${bodyHtml}
            </div>
        `;

    }

    // ===== End-of-Term: entirely governed by the ended term's Exam Period — never the active term's own dates. =====
    {
        const requirement = END_OF_TERM_FEE_REQUIREMENT;
        let statusBadge = "";
        let bodyHtml = "";

        if (!mostRecentEndedTerm) {

            statusBadge = `<span class="status-badge not-open">Not Open Yet</span>`;
            bodyHtml = `<p class="empty-note">End-of-Term registration opens once your current term ends and your Exam Period begins.</p>`;

        } else if (today < endedExamPeriod.start) {

            const daysUntilOpen = daysBetween(today, endedExamPeriod.start);
            statusBadge = `<span class="status-badge not-open">Not Open Yet</span>`;
            bodyHtml = `<div class="countdown-note">📅 Your Exam Period opens in ${daysUntilOpen} day${daysUntilOpen === 1 ? "" : "s"} (${endedExamPeriod.start.toLocaleDateString()}) — End-of-Term registration opens then.</div>`;

        } else if (today > endedExamPeriod.finish) {

            statusBadge = `<span class="status-badge closed">Exam Period Ended</span>`;
            bodyHtml = `<p class="empty-note">Your Exam Period (${endedExamPeriod.start.toLocaleDateString()} – ${endedExamPeriod.finish.toLocaleDateString()}) has ended. If you still need to write this, check the Supplementary or Deferred tab above.</p>`;

        } else {

            const result = renderFeeGatedChecklist(endedTermFee, requirement, mostRecentEndedTerm, "end_of_term", "normal", false);
            statusBadge = result.openBadge;
            bodyHtml = `<div class="period-note">📅 Your Exam Period: ${endedExamPeriod.start.toLocaleDateString()} – ${endedExamPeriod.finish.toLocaleDateString()}.</div>` + result.html;

        }

        html += `
            <div class="exam-type-block">
                <div class="exam-type-top">
                    <div><h3>End-of-Term</h3></div>
                    ${statusBadge}
                </div>
                ${bodyHtml}
            </div>
        `;
    }

    content.innerHTML = html;

}


// Builds the fee-gated course checklist shared by CA1/CA2/End-of-Term normal registration.
// isLate=true just changes the wording shown, not the fee logic — same requirement either way.
function renderFeeGatedChecklist(feePercentage, requirement, term, examType, mode, isLate) {

    if (feePercentage === null) {
        return {
            openBadge: `<span class="status-badge blocked">Blocked — No Fee Record</span>`,
            html: `<div class="fee-warning">🔒 Your tuition fee record for Term ${term.term_number} has not been set up. Please contact the finance/admissions office before registering.</div>`
        };
    }

    if (feePercentage < requirement) {
        return {
            openBadge: `<span class="status-badge blocked">Blocked — Fees Not Met</span>`,
            html: `<div class="fee-warning">🔒 You have paid <strong>${feePercentage}%</strong> of your Term ${term.term_number} tuition, but ${requirement}% is required for ${EXAM_LABEL[examType]}. Please clear your balance, or contact admin if you have already made arrangements.</div>`
        };
    }

    const lateNoteHtml = isLate
        ? `<div class="late-note">⏰ This is a late registration during your Exam Period for Term ${term.term_number}.</div>`
        : "";

    return {
        openBadge: `<span class="status-badge ${isLate ? "late" : "open"}">${isLate ? "Late Registration Open" : "Open Now"}</span>`,
        html: `
            ${lateNoteHtml}
            <div class="fee-ok">✓ You have paid ${feePercentage}% of your Term ${term.term_number} tuition — requirement met (${requirement}% required).</div>
            <div id="courseList-${examType}">
                ${enrolledCourses.map(c => renderCourseCheckItem(c, examType, mode)).join("")}
            </div>
            <button class="register-button" onclick="submitRegistrations('${examType}', '${mode}', ${term.term_number})">Submit Registration for ${EXAM_LABEL[examType]}</button>
        `
    };

}


async function renderSpecialMode(mode) {

    const content = document.getElementById("content");
    const label = mode === "supplementary" ? "Supplementary" : "Deferred";
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (!mostRecentEndedTerm) {
        content.innerHTML = `<p class="empty-note">${label} registration is only available once one of your terms has ended and its Exam Period has passed. You don't have a completed term yet.</p>`;
        return;
    }

    const suppDeferredWindow = getSuppDeferredWindow(mostRecentEndedTerm);
    const inAutomaticWindow = today >= suppDeferredWindow.start && today <= suppDeferredWindow.finish;
    const inManualOverride = !!manualOverridePeriod;

    if (!inAutomaticWindow && !inManualOverride) {

        let timingNote = "";

        if (today < suppDeferredWindow.start) {
            const daysUntilOpen = daysBetween(today, suppDeferredWindow.start);
            timingNote = `Your ${label} window opens in ${daysUntilOpen} day${daysUntilOpen === 1 ? "" : "s"} (${suppDeferredWindow.start.toLocaleDateString()} – ${suppDeferredWindow.finish.toLocaleDateString()}).`;
        } else {
            timingNote = `Your automatic ${label} window (${suppDeferredWindow.start.toLocaleDateString()} – ${suppDeferredWindow.finish.toLocaleDateString()}) has passed. Contact admin if you still need access.`;
        }

        content.innerHTML = `
            <div class="exam-type-block">
                <div class="exam-type-top">
                    <div><h3>${label} Registration</h3></div>
                    <span class="status-badge closed">Not Open Right Now</span>
                </div>
                <div class="period-closed-note">🔒 ${timingNote}</div>
            </div>
        `;
        return;

    }

    const feePercentage = await calculateFeePercentageForTerm(mostRecentEndedTerm);

    let feeBlockHtml = "";

    if (feePercentage === null) {
        feeBlockHtml = `<div class="fee-warning">🔒 Your tuition fee record for Term ${mostRecentEndedTerm.term_number} has not been set up. Please contact the finance/admissions office before registering.</div>`;
    } else if (feePercentage < 100) {
        feeBlockHtml = `<div class="fee-warning">🔒 You have paid <strong>${feePercentage}%</strong> of your Term ${mostRecentEndedTerm.term_number} tuition, but 100% is required for ${label} registration. Please clear your balance first.</div>`;
    } else {
        feeBlockHtml = `<div class="fee-ok">✓ Your Term ${mostRecentEndedTerm.term_number} tuition is fully paid (100%).</div>`;
    }

    const canProceed = feePercentage !== null && feePercentage >= 100;

    const windowNoteHtml = inAutomaticWindow
        ? `<div class="period-note">📅 Your ${label} window: ${suppDeferredWindow.start.toLocaleDateString()} – ${suppDeferredWindow.finish.toLocaleDateString()}.</div>`
        : `<div class="period-note">📅 You have been granted access via an admin override: "${escapeHtml(manualOverridePeriod.label)}" — closes ${new Date(manualOverridePeriod.end_date + "T00:00:00").toLocaleDateString()}.</div>`;

    let html = `
        <div class="exam-type-block">
            <div class="exam-type-top">
                <div>
                    <h3>${label} Registration — Term ${mostRecentEndedTerm.term_number}</h3>
                    <div class="exam-type-meta">Term ended: ${new Date(mostRecentEndedTerm.end_date + "T00:00:00").toLocaleDateString()}</div>
                </div>
            </div>
            ${windowNoteHtml}
            ${feeBlockHtml}
            <div class="special-fee-note">
                ℹ️ ${label} registration also requires a separate ${label.toLowerCase()} fee to be paid. This is confirmed by admin when they review your registration — you do not need to prove it here, but your registration will not be approved until admin confirms this payment.
            </div>
    `;

    if (canProceed) {

        html += `<p style="font-size:13px; color:#6b7280; margin-bottom:10px;">For each course, tick which exam(s) you need to write as ${label.toLowerCase()}.</p>`;

        enrolledCourses.forEach(course => {

            html += `<div style="margin-bottom:16px;"><strong style="font-size:13px;">${escapeHtml(course.code)} — ${escapeHtml(course.name)}</strong>`;

            ["ca1", "ca2", "end_of_term"].forEach(examType => {
                html += renderCourseCheckItem(course, examType, mode, true);
            });

            html += `</div>`;

        });

        html += `<button class="register-button" onclick="submitSpecialRegistrations('${mode}')">Submit ${label} Registration</button>`;

    }

    html += `</div>`;

    content.innerHTML = html;

}


function renderCourseCheckItem(course, examType, mode, showExamLabel) {

    const existing = findExistingRegistration(course.id, examType, mode);

    const labelText = showExamLabel
        ? `${escapeHtml(course.code)} — ${EXAM_LABEL[examType]}`
        : `${escapeHtml(course.code)} — ${escapeHtml(course.name)}`;

    if (existing) {
        return `
            <div class="course-check-item">
                <div class="course-label">${labelText}</div>
                <span class="course-reg-status ${existing.status}">${existing.status.charAt(0).toUpperCase() + existing.status.slice(1)}</span>
            </div>
        `;
    }

    return `
        <div class="course-check-item">
            <div class="course-label">
                <input type="checkbox" id="chk-${mode}-${examType}-${course.id}" data-course-id="${course.id}" data-exam-type="${examType}" ${showExamLabel ? "" : "checked"}>
                <label for="chk-${mode}-${examType}-${course.id}">${labelText}</label>
            </div>
        </div>
    `;

}


async function submitRegistrations(examType, mode, termNumber) {

    const checkboxes = document.querySelectorAll(`#courseList-${examType} input[type=checkbox]:checked`);

    if (checkboxes.length === 0) {
        alert("Please select at least one course.");
        return;
    }

    const termToUse = allTerms.find(t => t.term_number === termNumber);
    const feePercentage = await calculateFeePercentageForTerm(termToUse);

    const rows = Array.from(checkboxes).map(cb => ({
        student_id: studentProfileId,
        course_id: cb.dataset.courseId,
        term_number: termNumber,
        exam_type: examType,
        registration_mode: mode,
        fee_percentage_at_registration: feePercentage,
        status: "pending"
    }));

    const { error } = await supabaseClient.from("exam_registrations").insert(rows);

    if (error) {
        alert("Unable to submit registration: " + error.message);
        return;
    }

    alert("Your registration has been submitted and is awaiting admin approval.");
    await startPage();

}


async function submitSpecialRegistrations(mode) {

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const suppDeferredWindow = mostRecentEndedTerm ? getSuppDeferredWindow(mostRecentEndedTerm) : null;
    const stillInAutomaticWindow = suppDeferredWindow && today >= suppDeferredWindow.start && today <= suppDeferredWindow.finish;
    const stillInManualOverride = !!manualOverridePeriod;

    if (!stillInAutomaticWindow && !stillInManualOverride) {
        alert("This registration window has closed. You can no longer submit this registration.");
        await startPage();
        return;
    }

    const checkboxes = document.querySelectorAll(`.exam-type-block input[type=checkbox]:checked`);

    if (checkboxes.length === 0) {
        alert("Please select at least one exam to register for.");
        return;
    }

    const feePercentage = await calculateFeePercentageForTerm(mostRecentEndedTerm);

    const rows = Array.from(checkboxes).map(cb => ({
        student_id: studentProfileId,
        course_id: cb.dataset.courseId,
        term_number: mostRecentEndedTerm.term_number,
        exam_type: cb.dataset.examType,
        registration_mode: mode,
        fee_percentage_at_registration: feePercentage,
        status: "pending"
    }));

    const { error } = await supabaseClient.from("exam_registrations").insert(rows);

    if (error) {
        alert("Unable to submit registration: " + error.message);
        return;
    }

    alert(`Your ${mode} registration has been submitted and is awaiting admin approval (including confirmation of your ${mode} fee payment).`);
    await startPage();

}


startPage();

</script>
