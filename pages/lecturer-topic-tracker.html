<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic Tracker | Lecturer Portal</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #0e7490; color: white; padding: 18px 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 22px; }
.brand p { color: #cffafe; margin-top: 3px; font-size: 13px; }
.back-button { background: white; color: #0e7490; text-decoration: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; }

.container { max-width: 900px; margin: 25px auto; padding: 0 20px; }
.page-title { margin-bottom: 20px; }
.page-title h2 { font-size: 28px; margin-bottom: 6px; }
.page-title p { color: #6b7280; }

.card { background: white; padding: 22px; border-radius: 14px; margin-bottom: 18px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }

select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }

.summary-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.summary-pill { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
.summary-pill.done { background: #dcfce7; color: #166534; }
.summary-pill.not-done { background: #fee2e2; color: #991b1b; }

.student-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: #f9fafb;
}

.student-row.done { background: #ecfdf5; }

.student-name { font-weight: bold; font-size: 14px; }
.student-number { font-size: 12px; color: #6b7280; }

.status-tag { font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
.status-tag.done { background: #dcfce7; color: #166534; }
.status-tag.not-done { background: #fee2e2; color: #991b1b; }

.empty-note { color: #9ca3af; text-align: center; padding: 20px 0; }
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div>
            <h1>E-Campus</h1>
            <p>Lecturer Portal</p>
        </div>
    </div>
    <a href="lecturer-dashboard.html" class="back-button">← Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Topic Tracker</h2>
        <p>See exactly who has attempted (marked complete) today's assigned Topic.</p>
    </section>

    <section class="card">
        <select id="courseSelect"><option value="">Select course</option></select>
        <select id="unitSelect" disabled><option value="">Select course first</option></select>
        <select id="topicSelect" disabled><option value="">Select unit first</option></select>
    </section>

    <section class="card" id="resultsCard" style="display:none;">
        <div id="summaryBar" class="summary-bar"></div>
        <div id="studentsList"></div>
    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

let lecturerProfileId = null;

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function startPage() {

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "lecturer-login.html";
        return;
    }

    const { data: lecturerProfile } =
        await supabaseClient.from("lecturer_profiles").select("id").eq("user_id", user.id).single();

    if (!lecturerProfile) return;

    lecturerProfileId = lecturerProfile.id;

    const { data: assignments } =
        await supabaseClient
            .from("course_lecturers")
            .select("courses ( id, code, name )")
            .eq("lecturer_id", lecturerProfileId);

    const courses = (assignments || []).map(a => a.courses).filter(Boolean);
    const select = document.getElementById("courseSelect");

    courses.forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = `${c.code} — ${c.name}`;
        select.appendChild(option);
    });

}


document.getElementById("courseSelect").addEventListener("change", async function() {

    const courseId = this.value;
    const unitSelect = document.getElementById("unitSelect");
    const topicSelect = document.getElementById("topicSelect");

    unitSelect.innerHTML = `<option value="">Loading...</option>`;
    topicSelect.innerHTML = `<option value="">Select unit first</option>`;
    topicSelect.disabled = true;
    document.getElementById("resultsCard").style.display = "none";

    if (!courseId) {
        unitSelect.innerHTML = `<option value="">Select course first</option>`;
        unitSelect.disabled = true;
        return;
    }

    const { data } =
        await supabaseClient.from("course_modules").select("id, module_number, title").eq("course_id", courseId).order("module_number");

    unitSelect.innerHTML = `<option value="">Select unit</option>`;
    (data || []).forEach(u => {
        const option = document.createElement("option");
        option.value = u.id;
        option.textContent = `Unit ${u.module_number} — ${u.title}`;
        unitSelect.appendChild(option);
    });

    unitSelect.disabled = false;

});


document.getElementById("unitSelect").addEventListener("change", async function() {

    const unitId = this.value;
    const topicSelect = document.getElementById("topicSelect");

    topicSelect.innerHTML = `<option value="">Loading...</option>`;
    document.getElementById("resultsCard").style.display = "none";

    if (!unitId) {
        topicSelect.innerHTML = `<option value="">Select unit first</option>`;
        topicSelect.disabled = true;
        return;
    }

    const { data } =
        await supabaseClient.from("lessons").select("id, lesson_number, title").eq("module_id", unitId).order("lesson_number");

    topicSelect.innerHTML = `<option value="">Select topic</option>`;
    (data || []).forEach(l => {
        const option = document.createElement("option");
        option.value = l.id;
        option.textContent = `Topic ${l.lesson_number} — ${l.title}`;
        topicSelect.appendChild(option);
    });

    topicSelect.disabled = false;

});


document.getElementById("topicSelect").addEventListener("change", async function() {

    const topicId = this.value;
    const courseId = document.getElementById("courseSelect").value;

    if (!topicId) {
        document.getElementById("resultsCard").style.display = "none";
        return;
    }

    const { data: enrollments } =
        await supabaseClient
            .from("enrollments")
            .select("student_profiles ( id, user_id, student_number, user_profiles ( first_name, last_name ) )")
            .eq("course_id", courseId)
            .eq("status", "enrolled");

    const students = (enrollments || []).map(e => e.student_profiles).filter(Boolean);

    if (students.length === 0) {
        document.getElementById("resultsCard").style.display = "block";
        document.getElementById("studentsList").innerHTML = `<p class="empty-note">No students enrolled in this course.</p>`;
        return;
    }

    const userIds = students.map(s => s.user_id);

    const { data: progressRows } =
        await supabaseClient
            .from("lesson_progress")
            .select("student_id, completed_at")
            .eq("lesson_id", topicId)
            .in("student_id", userIds);

    const completedMap = {};
    (progressRows || []).forEach(p => completedMap[p.student_id] = p.completed_at);

    const doneCount = students.filter(s => completedMap[s.user_id]).length;

    document.getElementById("summaryBar").innerHTML = `
        <span class="summary-pill done">${doneCount} Attempted</span>
        <span class="summary-pill not-done">${students.length - doneCount} Not Yet</span>
    `;

    document.getElementById("studentsList").innerHTML = students.map(s => {

        const name = s.user_profiles ? `${s.user_profiles.first_name} ${s.user_profiles.last_name}` : "Unknown";
        const completedAt = completedMap[s.user_id];

        return `
            <div class="student-row ${completedAt ? "done" : ""}">
                <div>
                    <div class="student-name">${escapeHtml(name)}</div>
                    <div class="student-number">${escapeHtml(s.student_number)}</div>
                </div>
                <span class="status-tag ${completedAt ? "done" : "not-done"}">
                    ${completedAt ? "✓ Attempted — " + new Date(completedAt).toLocaleString() : "Not Yet"}
                </span>
            </div>
        `;

    }).join("");

    document.getElementById("resultsCard").style.display = "block";

});


startPage();

</script>

</body>
</html>
