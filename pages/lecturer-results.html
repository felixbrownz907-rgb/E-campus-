<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish Results | Lecturer Portal</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #0e7490; color: white; padding: 18px 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 22px; }
.brand p { color: #cffafe; margin-top: 3px; font-size: 13px; }
.back-button { background: white; color: #0e7490; text-decoration: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; }

.container { max-width: 1000px; margin: 25px auto; padding: 0 20px; }
.page-title { margin-bottom: 20px; }
.page-title h2 { font-size: 28px; margin-bottom: 6px; }
.page-title p { color: #6b7280; }

.message { padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; }
.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 18px; }

.student-card { background: white; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); }
.student-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
.student-number { color: #6b7280; font-size: 12px; margin-bottom: 14px; }

.assessment-block {
    background: #f9fafb;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
}

.assessment-block .block-title { font-weight: bold; font-size: 13px; margin-bottom: 8px; }

.assessment-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.assessment-row input {
    width: 90px;
    padding: 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
}

.status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
.status-badge.published { background: #dcfce7; color: #166534; }
.status-badge.draft { background: #fef3c7; color: #92400e; }

.mini-button {
    background: #0e7490;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
}

.mini-button.unpublish { background: #991b1b; }

.overall-block {
    background: #111827;
    color: white;
    border-radius: 10px;
    padding: 14px;
    margin-top: 12px;
}

.overall-block .block-title { color: #d4af37; font-weight: bold; font-size: 13px; margin-bottom: 10px; }

.overall-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

.overall-row input, .overall-row select {
    width: 100%;
    padding: 10px;
    border: 1px solid #374151;
    border-radius: 8px;
    font-size: 14px;
    background: #1f2937;
    color: white;
}

.overall-publish-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }

.empty-note { color: #9ca3af; text-align: center; padding: 30px 0; }
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div>
            <h1>E-Campus</h1>
            <p>Lecturer Portal</p>
        </div>
    </div>
    <a href="lecturer-dashboard.html" class="back-button">← Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Publish Results</h2>
        <p>Mark and publish CA1, CA2, and the Final/End-of-Term Exam independently. Then set the overall total and comment.</p>
    </section>

    <div id="message" class="message"></div>

    <select id="courseSelect"><option value="">Select course</option></select>

    <div id="studentsContainer">
        <p class="empty-note">Select a course to view students.</p>
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function startPage() {

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "lecturer-login.html";
        return;
    }

    const { data: lecturerProfile } =
        await supabaseClient.from("lecturer_profiles").select("id").eq("user_id", user.id).single();

    if (!lecturerProfile) {
        showMessage("Unable to load your lecturer profile.", "error");
        return;
    }

    const { data: assignments } =
        await supabaseClient
            .from("course_lecturers")
            .select("courses ( id, code, name )")
            .eq("lecturer_id", lecturerProfile.id);

    const courses = (assignments || []).map(a => a.courses).filter(Boolean);
    const select = document.getElementById("courseSelect");

    if (courses.length === 0) {
        select.innerHTML = `<option value="">No courses assigned</option>`;
        return;
    }

    courses.forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = `${c.code} — ${c.name}`;
        select.appendChild(option);
    });

}


document.getElementById("courseSelect").addEventListener("change", async function() {

    const courseId = this.value;
    const container = document.getElementById("studentsContainer");

    if (!courseId) {
        container.innerHTML = `<p class="empty-note">Select a course to view students.</p>`;
        return;
    }

    container.innerHTML = `<p class="empty-note">Loading students...</p>`;

    const { data: enrollments, error } =
        await supabaseClient
            .from("enrollments")
            .select(`
                id, final_score, results_comment, results_published,
                ca1_score, ca1_published, ca2_score, ca2_published,
                final_exam_score, final_exam_published,
                student_profiles ( student_number, user_profiles ( first_name, last_name ) )
            `)
            .eq("course_id", courseId)
            .eq("status", "enrolled");

    if (error || !enrollments || enrollments.length === 0) {
        container.innerHTML = `<p class="empty-note">No students enrolled in this course yet.</p>`;
        return;
    }

    container.innerHTML = enrollments.map(e => renderStudentCard(e)).join("");

});


function renderStudentCard(e) {

    const student = e.student_profiles;
    const name = student?.user_profiles ? `${student.user_profiles.first_name} ${student.user_profiles.last_name}` : "Unknown";

    return `
        <div class="student-card">
            <div class="student-name">${escapeHtml(name)}</div>
            <div class="student-number">${escapeHtml(student?.student_number || "-")}</div>

            ${renderAssessmentBlock(e.id, "ca1", "CA1", e.ca1_score, e.ca1_published)}
            ${renderAssessmentBlock(e.id, "ca2", "CA2", e.ca2_score, e.ca2_published)}
            ${renderAssessmentBlock(e.id, "final_exam", "Final / End-of-Term Exam", e.final_exam_score, e.final_exam_published)}

            <div class="overall-block">
                <div class="block-title">Overall Total & Comment</div>
                <div class="overall-row">
                    <input type="number" id="total-${e.id}" placeholder="Total Mark (%)" min="0" max="100" value="${e.final_score ?? ""}">
                    <select id="comment-${e.id}">
                        <option value="">Select comment</option>
                        <option value="Clear Pass" ${e.results_comment === "Clear Pass" ? "selected" : ""}>Clear Pass</option>
                        <option value="Repeat" ${e.results_comment === "Repeat" ? "selected" : ""}>Repeat</option>
                        <option value="Supplementary" ${e.results_comment === "Supplementary" ? "selected" : ""}>Supplementary</option>
                        <option value="Fail" ${e.results_comment === "Fail" ? "selected" : ""}>Fail</option>
                    </select>
                </div>
                <div class="overall-publish-row">
                    <span class="status-badge ${e.results_published ? "published" : "draft"}">
                        ${e.results_published ? "✓ Published" : "Draft"}
                    </span>
                    <div>
                        <button class="mini-button" onclick="saveOverall('${e.id}', false)">Save Draft</button>
                        ${
                            e.results_published
                            ? `<button class="mini-button unpublish" onclick="saveOverall('${e.id}', false, true)">Unpublish</button>`
                            : `<button class="mini-button" onclick="saveOverall('${e.id}', true)">Publish Overall</button>`
                        }
                    </div>
                </div>
            </div>
        </div>
    `;

}


function renderAssessmentBlock(enrollmentId, fieldPrefix, label, score, published) {

    return `
        <div class="assessment-block">
            <div class="block-title">${label} ${published ? `<span class="status-badge published">Published</span>` : `<span class="status-badge draft">Draft</span>`}</div>
            <div class="assessment-row">
                <input type="number" id="${fieldPrefix}-${enrollmentId}" placeholder="%" min="0" max="100" value="${score ?? ""}">
                <button class="mini-button" onclick="saveAssessment('${enrollmentId}', '${fieldPrefix}', false)">Save</button>
                ${
                    published
                    ? `<button class="mini-button unpublish" onclick="saveAssessment('${enrollmentId}', '${fieldPrefix}', false, true)">Unpublish</button>`
                    : `<button class="mini-button" onclick="saveAssessment('${enrollmentId}', '${fieldPrefix}', true)">Publish ${label}</button>`
                }
            </div>
        </div>
    `;

}


async function saveAssessment(enrollmentId, fieldPrefix, publish, forceUnpublish) {

    const scoreValue = document.getElementById(`${fieldPrefix}-${enrollmentId}`).value;

    if (publish && scoreValue === "") {
        showMessage("Please enter a score before publishing.", "error");
        return;
    }

    const updates = {};
    updates[`${fieldPrefix}_score`] = scoreValue === "" ? null : Number(scoreValue);

    if (publish) updates[`${fieldPrefix}_published`] = true;
    if (forceUnpublish) updates[`${fieldPrefix}_published`] = false;

    const { error } = await supabaseClient.from("enrollments").update(updates).eq("id", enrollmentId);

    if (error) {
        showMessage("Unable to save: " + error.message, "error");
        return;
    }

    showMessage(publish ? "Published. The student can now see this score." : (forceUnpublish ? "Unpublished." : "Saved."), "success");
    document.getElementById("courseSelect").dispatchEvent(new Event("change"));

}


async function saveOverall(enrollmentId, publish, forceUnpublish) {

    const totalValue = document.getElementById(`total-${enrollmentId}`).value;
    const commentValue = document.getElementById(`comment-${enrollmentId}`).value;

    if (publish && (!totalValue || !commentValue)) {
        showMessage("Please enter a total mark and select a comment before publishing.", "error");
        return;
    }

    const updates = {
        final_score: totalValue === "" ? null : Number(totalValue),
        results_comment: commentValue || null
    };

    if (publish) updates.results_published = true;
    if (forceUnpublish) updates.results_published = false;

    const { error } = await supabaseClient.from("enrollments").update(updates).eq("id", enrollmentId);

    if (error) {
        showMessage("Unable to save: " + error.message, "error");
        return;
    }

    showMessage(publish ? "Overall result published." : (forceUnpublish ? "Overall result unpublished." : "Draft saved."), "success");
    document.getElementById("courseSelect").dispatchEvent(new Event("change"));

}


startPage();

</script>

</body>
</html>
