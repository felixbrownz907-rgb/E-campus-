<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promote Students | E-Campus Admin</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #111827; color: white; padding: 18px 25px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 58px; height: 58px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 24px; }
.brand p { color: #d4af37; margin-top: 4px; }
.back-button { background: #d4af37; color: #111827; text-decoration: none; padding: 11px 18px; border-radius: 8px; font-weight: bold; }

.container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
.page-title { margin-bottom: 25px; }
.page-title h2 { font-size: 30px; margin-bottom: 7px; }
.page-title p { color: #6b7280; }

.message { padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; }
.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card { background: white; padding: 25px; border-radius: 14px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.07); }
.card h3 { margin-bottom: 6px; font-size: 22px; }
.card .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
select { width: 100%; padding: 13px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }

.student-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
}

.student-row input[type="checkbox"] { width: 18px; height: 18px; }
.student-info { display: flex; align-items: center; gap: 12px; }
.student-number { color: #6b7280; font-size: 12px; }

.select-all-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb; }

.promote-button {
    background: #d4af37;
    color: #111827;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 16px;
}

.empty-note { color: #9ca3af; text-align: center; padding: 20px 0; }
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div><h1>E-Campus Administration</h1><p>Sunningdale University</p></div>
    </div>
    <a href="admin-dashboard.html" class="back-button">← Admin Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Promote Students</h2>
        <p>Move students from their current Year Level to the next one, individually or in bulk.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="card">

        <div class="form-grid">
            <div>
                <label style="font-weight:bold; display:block; margin-bottom:7px;">Programme</label>
                <select id="programmeSelect"><option value="">Select programme</option></select>
            </div>
            <div>
                <label style="font-weight:bold; display:block; margin-bottom:7px;">Current Year Level</label>
                <select id="levelSelect" disabled><option value="">Select programme first</option></select>
            </div>
        </div>

        <button class="promote-button" style="background:#0e7490; color:white; margin-top:0;" onclick="loadStudents()">Load Students</button>

    </section>

    <section class="card" id="studentsCard" style="display:none;">

        <h3 id="studentsHeading">Students</h3>
        <div class="sub" id="targetLevelNote"></div>

        <div class="select-all-row">
            <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
            <label for="selectAll" style="font-weight:bold;">Select All</label>
        </div>

        <div id="studentsList"></div>

        <button class="promote-button" onclick="promoteSelected()">Promote Selected Students</button>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const message = document.getElementById("message");
let currentLevels = [];
let currentProgrammeId = null;

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function startPage() {

    const { data: programmes } = await supabaseClient.from("programmes").select("id, code, name").order("name");

    const select = document.getElementById("programmeSelect");
    (programmes || []).forEach(p => {
        const option = document.createElement("option");
        option.value = p.id;
        option.textContent = `${p.code} — ${p.name}`;
        select.appendChild(option);
    });

}


document.getElementById("programmeSelect").addEventListener("change", async function() {

    const programmeId = this.value;
    currentProgrammeId = programmeId;

    const levelSelect = document.getElementById("levelSelect");
    levelSelect.innerHTML = `<option value="">Loading...</option>`;
    document.getElementById("studentsCard").style.display = "none";

    if (!programmeId) {
        levelSelect.innerHTML = `<option value="">Select programme first</option>`;
        levelSelect.disabled = true;
        return;
    }

    const { data: levels } =
        await supabaseClient
            .from("academic_levels")
            .select("id, name, level_number")
            .eq("programme_id", programmeId)
            .order("level_number");

    currentLevels = levels || [];

    if (currentLevels.length === 0) {
        levelSelect.innerHTML = `<option value="">No year levels set up for this programme</option>`;
        return;
    }

    levelSelect.innerHTML = `<option value="">Select year level</option>`;
    currentLevels.forEach(l => {
        const option = document.createElement("option");
        option.value = l.id;
        option.textContent = l.name;
        levelSelect.appendChild(option);
    });

    levelSelect.disabled = false;

});


async function loadStudents() {

    const levelId = document.getElementById("levelSelect").value;

    if (!currentProgrammeId || !levelId) {
        showMessage("Please select both a programme and a current year level.", "error");
        return;
    }

    const currentLevel = currentLevels.find(l => l.id === levelId);
    const nextLevel = currentLevels.find(l => l.level_number === currentLevel.level_number + 1);

    const studentsCard = document.getElementById("studentsCard");
    const studentsList = document.getElementById("studentsList");
    const targetLevelNote = document.getElementById("targetLevelNote");

    document.getElementById("studentsHeading").textContent = `Students currently in ${currentLevel.name}`;

    if (!nextLevel) {
        targetLevelNote.innerHTML = `<strong style="color:#991b1b;">⚠️ There is no next Year Level set up for this programme.</strong> This may be the final year, or the next Year Level hasn't been created yet in Manage Programmes.`;
    } else {
        targetLevelNote.textContent = `Selected students will be moved to: ${nextLevel.name}`;
    }

    const { data: students, error } =
        await supabaseClient
            .from("student_profiles")
            .select("id, student_number, user_profiles ( first_name, last_name )")
            .eq("programme_id", currentProgrammeId)
            .eq("current_level_id", levelId)
            .order("student_number");

    if (error) {
        studentsList.innerHTML = `<p class="empty-note">Unable to load students: ${escapeHtml(error.message)}</p>`;
        studentsCard.style.display = "block";
        return;
    }

    if (!students || students.length === 0) {
        studentsList.innerHTML = `<p class="empty-note">No students currently in this year level for this programme.</p>`;
        studentsCard.style.display = "block";
        return;
    }

    studentsList.innerHTML = students.map(s => {
        const name = s.user_profiles ? `${s.user_profiles.first_name} ${s.user_profiles.last_name}` : "Unknown";
        return `
            <div class="student-row">
                <div class="student-info">
                    <input type="checkbox" class="studentCheckbox" value="${s.id}">
                    <div>
                        <div style="font-weight:bold;">${escapeHtml(name)}</div>
                        <div class="student-number">${escapeHtml(s.student_number)}</div>
                    </div>
                </div>
            </div>
        `;
    }).join("");

    studentsCard.dataset.nextLevelId = nextLevel ? nextLevel.id : "";
    studentsCard.style.display = "block";

}


function toggleSelectAll() {
    const checked = document.getElementById("selectAll").checked;
    document.querySelectorAll(".studentCheckbox").forEach(cb => cb.checked = checked);
}


async function promoteSelected() {

    const studentsCard = document.getElementById("studentsCard");
    const nextLevelId = studentsCard.dataset.nextLevelId;

    if (!nextLevelId) {
        showMessage("There is no next Year Level to promote these students into.", "error");
        return;
    }

    const selectedIds = Array.from(document.querySelectorAll(".studentCheckbox:checked")).map(cb => cb.value);

    if (selectedIds.length === 0) {
        showMessage("Please select at least one student to promote.", "error");
        return;
    }

    const confirmed = confirm(`Promote ${selectedIds.length} student(s) to the next year level?`);
    if (!confirmed) return;

    const { error } =
        await supabaseClient
            .from("student_profiles")
            .update({ current_level_id: nextLevelId })
            .in("id", selectedIds);

    if (error) {
        showMessage("Unable to promote students: " + error.message, "error");
        return;
    }

    showMessage(`${selectedIds.length} student(s) promoted successfully.`, "success");
    document.getElementById("levelSelect").dispatchEvent(new Event("change"));
    document.getElementById("studentsCard").style.display = "none";

}


startPage();

</script>

</body>
</html>
