<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Assignments | E-Campus</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 55px; height: 55px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 22px; }
.brand p { color: #d4af37; margin-top: 3px; font-size: 13px; }

.back-button {
    background: #d4af37;
    color: #111827;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
}

.container { max-width: 900px; margin: 25px auto; padding: 0 20px; }

.page-title { margin-bottom: 20px; }
.page-title h2 { font-size: 28px; margin-bottom: 6px; }
.page-title p { color: #6b7280; }

.message {
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 6px;
}

.card h3 { font-size: 18px; }
.course-tag { color: #d4af37; font-size: 12px; font-weight: bold; }
.due-date { color: #6b7280; font-size: 13px; }
.description { color: #374151; font-size: 14px; margin: 10px 0; }

.status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.status-badge.pending { background: #fef3c7; color: #92400e; }
.status-badge.submitted { background: #dbeafe; color: #1d4ed8; }
.status-badge.graded { background: #dcfce7; color: #166534; }
.status-badge.overdue { background: #fee2e2; color: #991b1b; }

.submission-form { margin-top: 14px; border-top: 1px solid #e5e7eb; padding-top: 14px; }

.tab-buttons { display: flex; gap: 8px; margin-bottom: 12px; }

.tab-button {
    flex: 1;
    padding: 10px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
}

.tab-button.active { background: #111827; color: white; border-color: #111827; }

textarea, input[type="file"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
}

textarea { min-height: 120px; resize: vertical; }

.file-hint { font-size: 12px; color: #9ca3af; margin-top: 6px; }

.submit-button {
    margin-top: 14px;
    background: #d4af37;
    color: #111827;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}

.submit-button:disabled { opacity: 0.6; cursor: not-allowed; }

.grade-box {
    margin-top: 14px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    padding: 14px;
}

.grade-box .score { font-size: 20px; font-weight: bold; color: #166534; }
.grade-box .feedback { font-size: 14px; color: #374151; margin-top: 8px; }

.empty-note { color: #9ca3af; text-align: center; padding: 30px 0; }

@media (max-width: 600px) {
    .card-top { flex-direction: column; }
}
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div>
            <h1>E-Campus</h1>
            <p>Sunningdale University</p>
        </div>
    </div>
    <a href="student-dashboard.html" class="back-button">← Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>My Assignments</h2>
        <p>Submit your work as typed text, or upload a PDF/Word document (max 1MB).</p>
    </section>

    <div id="message" class="message"></div>

    <div id="assignmentsContainer">
        <div class="card"><p class="empty-note">Loading your assignments...</p></div>
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const MAX_FILE_SIZE = 1 * 1024 * 1024; // 1MB

let authUserId = null;
let studentProfileId = null;

const message = document.getElementById("message");


function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadAssignments() {

    const container = document.getElementById("assignmentsContainer");

    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
        window.location.href = "student-login.html";
        return;
    }

    authUserId = user.id;

    const { data: studentProfile, error: studentError } =
        await supabaseClient
            .from("student_profiles")
            .select("id")
            .eq("user_id", user.id)
            .single();

    if (studentError || !studentProfile) {
        container.innerHTML = `<div class="card"><p class="empty-note">Unable to load your student profile.</p></div>`;
        return;
    }

    studentProfileId = studentProfile.id;

    const { data: enrollments } =
        await supabaseClient
            .from("enrollments")
            .select("courses ( id, code, name )")
            .eq("student_id", studentProfileId);

    const courseIds = (enrollments || []).map(e => e.courses?.id).filter(Boolean);
    const courseMap = {};
    (enrollments || []).forEach(e => { if (e.courses) courseMap[e.courses.id] = e.courses; });

    if (courseIds.length === 0) {
        container.innerHTML = `<div class="card"><p class="empty-note">You are not enrolled in any courses yet.</p></div>`;
        return;
    }

    const { data: modules } =
        await supabaseClient
            .from("course_modules")
            .select("id, course_id")
            .in("course_id", courseIds);

    const moduleIds = (modules || []).map(m => m.id);
    const moduleToCourse = {};
    (modules || []).forEach(m => moduleToCourse[m.id] = m.course_id);

    if (moduleIds.length === 0) {
        container.innerHTML = `<div class="card"><p class="empty-note">No assignments available yet.</p></div>`;
        return;
    }

    const { data: assignments, error: assignError } =
        await supabaseClient
            .from("assignments")
            .select("*")
            .in("module_id", moduleIds)
            .order("due_date");

    if (assignError) {
        container.innerHTML = `<div class="card"><p class="empty-note">Unable to load assignments: ${escapeHtml(assignError.message)}</p></div>`;
        return;
    }

    if (!assignments || assignments.length === 0) {
        container.innerHTML = `<div class="card"><p class="empty-note">No assignments have been posted yet.</p></div>`;
        return;
    }

    const assignmentIds = assignments.map(a => a.id);

    const { data: submissions } =
        await supabaseClient
            .from("submissions")
            .select("*")
            .eq("student_id", authUserId)
            .in("assignment_id", assignmentIds);

    const submissionMap = {};
    (submissions || []).forEach(s => submissionMap[s.assignment_id] = s);

    renderAssignments(assignments, submissionMap, moduleToCourse, courseMap);

}


function renderAssignments(assignments, submissionMap, moduleToCourse, courseMap) {

    const container = document.getElementById("assignmentsContainer");
    container.innerHTML = "";

    const now = new Date();

    assignments.forEach(assignment => {

        const courseId = moduleToCourse[assignment.module_id];
        const course = courseMap[courseId];
        const submission = submissionMap[assignment.id];

        let statusLabel = "Pending";
        let statusClass = "pending";

        if (submission && submission.score !== null) {
            statusLabel = "Graded";
            statusClass = "graded";
        } else if (submission) {
            statusLabel = "Submitted";
            statusClass = "submitted";
        } else if (assignment.due_date && new Date(assignment.due_date) < now) {
            statusLabel = "Overdue";
            statusClass = "overdue";
        }

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-top">
                <div>
                    <div class="course-tag">${course ? escapeHtml(course.code) : ""}</div>
                    <h3>${escapeHtml(assignment.title)}</h3>
                </div>
                <span class="status-badge ${statusClass}">${statusLabel}</span>
            </div>
            <div class="due-date">${assignment.due_date ? "Due: " + new Date(assignment.due_date).toLocaleString() : "No due date"} • Max score: ${assignment.max_score}</div>
            <div class="description">${escapeHtml(assignment.description || "")}</div>
            <div id="body-${assignment.id}"></div>
        `;

        container.appendChild(card);

        const body = document.getElementById(`body-${assignment.id}`);

        if (submission) {

            if (submission.score !== null) {

                body.innerHTML = `
                    <div class="grade-box">
                        <div class="score">${submission.score} / ${assignment.max_score}</div>
                        ${submission.feedback ? `<div class="feedback">${escapeHtml(submission.feedback)}</div>` : ""}
                    </div>
                `;

            } else {

                body.innerHTML = `<p style="color:#6b7280; font-size:13px; margin-top:10px;">Submitted on ${new Date(submission.submitted_at).toLocaleString()}. Awaiting grading.</p>`;

            }

        } else {

            body.innerHTML = `
                <div class="submission-form">
                    <div class="tab-buttons">
                        <button type="button" class="tab-button active" id="tabText-${assignment.id}" onclick="switchTab('${assignment.id}', 'text')">Type Answer</button>
                        <button type="button" class="tab-button" id="tabFile-${assignment.id}" onclick="switchTab('${assignment.id}', 'file')">Upload File</button>
                    </div>

                    <div id="textPanel-${assignment.id}">
                        <textarea id="textInput-${assignment.id}" placeholder="Type your answer here..."></textarea>
                    </div>

                    <div id="filePanel-${assignment.id}" style="display:none;">
                        <input type="file" id="fileInput-${assignment.id}" accept=".pdf,.doc,.docx">
                        <div class="file-hint">PDF or Word document only. Maximum size: 1MB.</div>
                    </div>

                    <button class="submit-button" id="submitBtn-${assignment.id}" onclick="submitAssignment('${assignment.id}')">
                        Submit Assignment
                    </button>
                </div>
            `;

        }

    });

}


function switchTab(assignmentId, tab) {

    document.getElementById(`tabText-${assignmentId}`).classList.toggle("active", tab === "text");
    document.getElementById(`tabFile-${assignmentId}`).classList.toggle("active", tab === "file");
    document.getElementById(`textPanel-${assignmentId}`).style.display = tab === "text" ? "block" : "none";
    document.getElementById(`filePanel-${assignmentId}`).style.display = tab === "file" ? "block" : "none";

}


async function submitAssignment(assignmentId) {

    const submitBtn = document.getElementById(`submitBtn-${assignmentId}`);
    const textValue = document.getElementById(`textInput-${assignmentId}`).value.trim();
    const fileInput = document.getElementById(`fileInput-${assignmentId}`);
    const file = fileInput.files[0];

    if (!textValue && !file) {
        showMessage("Please type an answer or choose a file to upload.", "error");
        return;
    }

    if (file && file.size > MAX_FILE_SIZE) {
        showMessage("File is too large. Maximum allowed size is 1MB.", "error");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    let fileUrl = null;

    try {

        if (file) {

            const filePath = `${authUserId}/${assignmentId}/${Date.now()}-${file.name}`;

            const { error: uploadError } =
                await supabaseClient
                    .storage
                    .from("assignment-submissions")
                    .upload(filePath, file);

            if (uploadError) {
                showMessage("Upload failed: " + uploadError.message, "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Assignment";
                return;
            }

            const { data: urlData } =
                supabaseClient
                    .storage
                    .from("assignment-submissions")
                    .getPublicUrl(filePath);

            fileUrl = urlData.publicUrl;

        }

        const { error: insertError } =
            await supabaseClient
                .from("submissions")
                .insert({
                    assignment_id: assignmentId,
                    student_id: authUserId,
                    content: textValue || null,
                    file_url: fileUrl,
                    status: "submitted"
                });

        if (insertError) {
            showMessage("Unable to submit: " + insertError.message, "error");
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Assignment";
            return;
        }

        showMessage("Assignment submitted successfully.", "success");
        await loadAssignments();

    } catch (err) {

        console.error(err);
        showMessage("Unexpected error: " + err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Assignment";

    }

}


loadAssignments();

</script>

</body>
</html>
