<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Management | E-Campus</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #172033;
        }

        /* ================= HEADER ================= */

        .header {
            background: #111827;
            color: white;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .brand h1 {
            font-size: 24px;
        }

        .brand p {
            color: #d4af37;
            margin-top: 4px;
        }

        .back-button {
            text-decoration: none;
            background: #d4af37;
            color: #111827;

            padding: 11px 18px;
            border-radius: 8px;

            font-weight: bold;
        }

        .back-button:hover {
            background: #c29d24;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        /* ================= CARD ================= */

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.07);

            margin-bottom: 25px;
        }

        .card h3 {
            margin-bottom: 20px;
        }

        /* ================= SEARCH ================= */

        .search-box {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 15px;
            margin-bottom: 20px;
        }

        .search-box:focus {
            outline: none;
            border-color: #d4af37;
        }

        /* ================= TABLE ================= */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover {
            background: #f9fafb;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        /* ================= BUTTON ================= */

        .refresh-button {
            border: none;

            background: #d4af37;
            color: #111827;

            padding: 11px 18px;
            border-radius: 8px;

            font-weight: bold;
            cursor: pointer;

            margin-bottom: 20px;
        }

        .refresh-button:hover {
            background: #c29d24;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .page-title h2 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="brand">

        <img
            src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg"
            alt="Sunningdale University Logo"
            class="logo"
        >

        <div>

            <h1>
                E-Campus Administration
            </h1>

            <p>
                Sunningdale University
            </p>

        </div>

    </div>


    <a
        href="admin-dashboard.html"
        class="back-button"
    >
        ← Admin Dashboard
    </a>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


    <section class="page-title">

        <h2>
            Student Management
        </h2>

        <p>
            Manage student profiles and academic information.
        </p>

    </section>



    <div
        id="message"
        class="message"
    ></div>



    <!-- ================= STUDENTS ================= -->

    <section class="card">

        <h3>
            Registered Students
        </h3>


        <button
            id="refreshButton"
            class="refresh-button"
        >
            Refresh Students
        </button>


        <input
            type="text"
            id="searchBox"
            class="search-box"
            placeholder="Search students..."
        >


        <div class="table-container">

            <table>

                <thead id="studentTableHead">

                    <tr>

                        <th>
                            Loading...
                        </th>

                    </tr>

                </thead>


                <tbody id="studentTableBody">

                    <tr>

                        <td class="loading">

                            Loading students...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>



<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>



<script>


/* =====================================================
   STUDENT MANAGEMENT
===================================================== */


let students = [];



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(message, type) {

    const messageBox =
        document.getElementById("message");

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;

}



/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents() {

    const tableBody =
        document.getElementById(
            "studentTableBody"
        );

    const tableHead =
        document.getElementById(
            "studentTableHead"
        );


    tableBody.innerHTML = `
        <tr>
            <td class="loading">
                Loading students...
            </td>
        </tr>
    `;


    try {

        const result =
            await supabaseClient
                .from("student_profiles")
                .select("*");


        if (result.error) {

            console.error(
                "Student loading error:",
                result.error
            );

            tableBody.innerHTML = `
                <tr>
                    <td class="empty">
                        Unable to load students.
                    </td>
                </tr>
            `;

            showMessage(
                result.error.message,
                "error"
            );

            return;

        }


        students = result.data || [];


        renderStudents(students);


    } catch (error) {

        console.error(
            "Unexpected error:",
            error
        );

        tableBody.innerHTML = `
            <tr>
                <td class="empty">
                    An unexpected error occurred.
                </td>
            </tr>
        `;

        showMessage(
            "Unable to load students.",
            "error"
        );

    }

}



/* =====================================================
   RENDER STUDENTS
===================================================== */

function renderStudents(studentList) {

    const tableHead =
        document.getElementById(
            "studentTableHead"
        );

    const tableBody =
        document.getElementById(
            "studentTableBody"
        );


    if (!studentList.length) {

        tableHead.innerHTML = `
            <tr>
                <th>
                    Students
                </th>
            </tr>
        `;


        tableBody.innerHTML = `
            <tr>
                <td class="empty">
                    No students found.
                </td>
            </tr>
        `;

        return;

    }


    /*
     * Get the columns directly
     * from the returned student data.
     */

    const columns =
        Object.keys(studentList[0]);


    /* ================= HEADER ================= */

    tableHead.innerHTML =
        "<tr>" +

        columns
            .map(function(column) {

                return `
                    <th>
                        ${formatColumnName(column)}
                    </th>
                `;

            })
            .join("") +

        "</tr>";


    /* ================= BODY ================= */

    tableBody.innerHTML =
        studentList
            .map(function(student) {

                return `
                    <tr>

                        ${
                            columns
                                .map(function(column) {

                                    let value =
                                        student[column];

                                    if (
                                        value === null ||
                                        value === undefined
                                    ) {
                                        value = "";
                                    }

                                    return `
                                        <td>
                                            ${escapeHtml(
                                                String(value)
                                            )}
                                        </td>
                                    `;

                                })
                                .join("")
                        }

                    </tr>
                `;

            })
            .join("");

}



/* =====================================================
   FORMAT COLUMN NAME
===================================================== */

function formatColumnName(column) {

    return column
        .replace(/_/g, " ")
        .replace(/\b\w/g, function(letter) {

            return letter.toUpperCase();

        });

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("searchBox")
    .addEventListener(
        "input",
        function() {

            const search =
                this.value
                    .toLowerCase()
                    .trim();


            if (!search) {

                renderStudents(students);

                return;

            }


            const filtered =
                students.filter(
                    function(student) {

                        return Object.values(student)
                            .some(function(value) {

                                return String(value)
                                    .toLowerCase()
                                    .includes(search);

                            });

                    }
                );


            renderStudents(filtered);

        }
    );



/* =====================================================
   REFRESH
===================================================== */

document
    .getElementById("refreshButton")
    .addEventListener(
        "click",
        function() {

            loadStudents();

        }
    );



/* =====================================================
   START
===================================================== */

loadStudents();


</script>


</body>

</html>
