<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fees Management | E-Campus</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #172033; }

.header { background: #111827; color: white; padding: 18px 25px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 58px; height: 58px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 24px; }
.brand p { color: #d4af37; margin-top: 4px; }
.back-button { background: #d4af37; color: #111827; text-decoration: none; padding: 11px 18px; border-radius: 8px; font-weight: bold; }

.container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
.page-title { margin-bottom: 25px; }
.page-title h2 { font-size: 30px; margin-bottom: 7px; }
.page-title p { color: #6b7280; }

.message { padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; }
.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card { background: white; padding: 25px; border-radius: 14px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.07); }
.card h3 { margin-bottom: 6px; font-size: 22px; }
.card .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.form-group { display: flex; flex-direction: column; }
.form-group.full { grid-column: 1 / -1; }
label { font-weight: bold; margin-bottom: 7px; }

input, select { width: 100%; padding: 13px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }

.submit-button { margin-top: 20px; background: #d4af37; color: #111827; border: none; padding: 13px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }

.category-card {
    background: #f9fafb;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid #e5e7eb;
}

.category-title { font-weight: bold; font-size: 15px; margin-bottom: 12px; }

.category-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.category-fields input { padding: 10px; font-size: 14px; }

.mini-button {
    background: #0e7490;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    margin-bottom: 10px;
}

.category-summary { font-size: 13px; color: #374151; margin-bottom: 10px; }
.category-summary .paid { color: #166534; font-weight: bold; }
.category-summary .owed { color: #991b1b; font-weight: bold; }

.payment-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
}

.payment-row input, .payment-row select { padding: 9px; font-size: 13px; }

.payment-item { display: flex; justify-content: space-between; padding: 8px; background: white; border-radius: 6px; margin-bottom: 5px; font-size: 12px; border: 1px solid #e5e7eb; }

.total-outstanding-box {
    background: #111827;
    color: white;
    border-radius: 12px;
    padding: 18px;
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.total-outstanding-box .label { color: #d4af37; font-size: 13px; }
.total-outstanding-box .value { font-size: 24px; font-weight: bold; }

.empty-note { color: #9ca3af; text-align: center; padding: 20px 0; }
</style>
</head>


<body>

<header class="header">
    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div><h1>E-Campus Administration</h1><p>Sunningdale University</p></div>
    </div>
    <a href="admin-dashboard.html" class="back-button">← Admin Dashboard</a>
</header>


<main class="container">

    <section class="page-title">
        <h2>Fees Management</h2>
        <p>Set and record Tuition, Registration, Exam Fee, and Exemption Fee separately for each student, per term.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="card">
        <h3>Select Student & Term</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="studentSelect">Student</label>
                <select id="studentSelect"><option value="">Select student</option></select>
            </div>
            <div class="form-group">
                <label for="termSelect">Academic Term</label>
                <select id="termSelect"><option value="">Select term</option></select>
            </div>
        </div>
        <button class="submit-button" onclick="loadAllCategories()">Load Fee Record</button>
    </section>

    <div id="categoriesContainer"></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const FEE_CATEGORIES = ["Tuition", "Registration", "Exam Fee", "Exemption Fee"];
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function startPage() {

    const studentSelect = document.getElementById("studentSelect");
    const { data: students } =
        await supabaseClient
            .from("student_profiles")
            .select("id, student_number, user_profiles ( first_name, last_name )")
            .order("student_number");

    (students || []).forEach(s => {
        const name = s.user_profiles ? `${s.user_profiles.first_name} ${s.user_profiles.last_name}` : "Unknown";
        const option = document.createElement("option");
        option.value = s.id;
        option.textContent = `${s.student_number} — ${name}`;
        studentSelect.appendChild(option);
    });

    const termSelect = document.getElementById("termSelect");
    const { data: terms } =
        await supabaseClient.from("academic_terms").select("id, name").order("created_at", { ascending: false });

    (terms || []).forEach(t => {
        const option = document.createElement("option");
        option.value = t.id;
        option.textContent = t.name;
        termSelect.appendChild(option);
    });

}


async function loadAllCategories() {

    const studentId = document.getElementById("studentSelect").value;
    const termId = document.getElementById("termSelect").value;

    if (!studentId || !termId) {
        showMessage("Please select both a student and a term.", "error");
        return;
    }

    const container = document.getElementById("categoriesContainer");
    container.innerHTML = "";

    let totalOutstanding = 0;

    for (const category of FEE_CATEGORIES) {

        const { data: feeRecord } =
            await supabaseClient
                .from("student_term_fees")
                .select("*")
                .eq("student_id", studentId)
                .eq("academic_term_id", termId)
                .eq("fee_type", category)
                .maybeSingle();

        let totalPaid = 0;
        let payments = [];

        if (feeRecord) {
            const { data: paymentData } =
                await supabaseClient.from("fee_payments").select("*").eq("student_fee_id", feeRecord.id).order("payment_date", { ascending: false });
            payments = paymentData || [];
            totalPaid = payments.reduce((sum, p) => sum + Number(p.amount), 0);
        }

        const totalFee = feeRecord ? Number(feeRecord.total_fee) : 0;
        const balance = totalFee - totalPaid;
        totalOutstanding += balance > 0 ? balance : 0;

        const card = document.createElement("div");
        card.className = "card category-card";

        card.innerHTML = `
            <div class="category-title">${category}</div>

            <div class="category-fields">
                <input type="number" id="totalFee-${category}" placeholder="Total ${category} (K)" value="${feeRecord ? feeRecord.total_fee : ""}">
                <input type="date" id="dueDate-${category}" value="${feeRecord ? (feeRecord.due_date || "") : ""}">
            </div>

            <button class="mini-button" onclick="saveCategory('${studentId}', '${termId}', '${category}', '${feeRecord ? feeRecord.id : ""}')">Save ${category}</button>

            <div class="category-summary">
                Paid: <span class="paid">K${totalPaid}</span> &nbsp;|&nbsp;
                Balance: <span class="${balance > 0 ? "owed" : "paid"}">K${balance > 0 ? balance : 0}</span>
            </div>

            ${feeRecord ? `
                <div class="payment-row">
                    <input type="number" id="paymentAmount-${category}" placeholder="Amount (K)">
                    <select id="paymentMethod-${category}">
                        <option value="Cash">Cash</option>
                        <option value="Mobile Money">Mobile Money</option>
                        <option value="Bank Deposit">Bank Deposit</option>
                        <option value="Other">Other</option>
                    </select>
                    <button class="mini-button" style="margin-bottom:0;" onclick="recordPayment('${feeRecord.id}', '${category}', '${studentId}', '${termId}')">Record Payment</button>
                </div>

                <div id="paymentHistory-${category}">
                    ${payments.length === 0
                        ? `<p class="empty-note">No payments recorded yet.</p>`
                        : payments.map(p => `
                            <div class="payment-item">
                                <span>K${p.amount} — ${escapeHtml(p.payment_method || "-")}</span>
                                <span>${new Date(p.payment_date).toLocaleDateString()}</span>
                            </div>
                        `).join("")
                    }
                </div>
            ` : `<p class="empty-note">Save this fee first to enable recording payments.</p>`}
        `;

        container.appendChild(card);

    }

    const totalBox = document.createElement("div");
    totalBox.className = "card total-outstanding-box";
    totalBox.innerHTML = `
        <span class="label">Total Balance — This Term</span>
        <span class="value">K${totalOutstanding}</span>
    `;
    container.appendChild(totalBox);

}


async function saveCategory(studentId, termId, category, existingId) {

    const totalFee = document.getElementById(`totalFee-${category}`).value;
    const dueDate = document.getElementById(`dueDate-${category}`).value;

    if (!totalFee) {
        showMessage(`Please enter the ${category} amount.`, "error");
        return;
    }

    const payload = {
        student_id: studentId,
        academic_term_id: termId,
        fee_type: category,
        total_fee: Number(totalFee),
        due_date: dueDate || null
    };

    let result;

    if (existingId) {
        result = await supabaseClient.from("student_term_fees").update(payload).eq("id", existingId);
    } else {
        result = await supabaseClient.from("student_term_fees").insert(payload);
    }

    if (result.error) {
        showMessage(`Unable to save ${category}: ` + result.error.message, "error");
        return;
    }

    showMessage(`${category} saved.`, "success");
    await loadAllCategories();

}


async function recordPayment(feeId, category, studentId, termId) {

    const amount = document.getElementById(`paymentAmount-${category}`).value;
    const method = document.getElementById(`paymentMethod-${category}`).value;

    if (!amount) {
        showMessage("Please enter a payment amount.", "error");
        return;
    }

    const { data: { user } } = await supabaseClient.auth.getUser();

    const { error } =
        await supabaseClient.from("fee_payments").insert({
            student_fee_id: feeId,
            amount: Number(amount),
            payment_method: method,
            recorded_by: user.id
        });

    if (error) {
        showMessage("Unable to record payment: " + error.message, "error");
        return;
    }

    showMessage(`${category} payment recorded.`, "success");
    await loadAllCategories();

}


startPage();

</script>

</body>
</html>
