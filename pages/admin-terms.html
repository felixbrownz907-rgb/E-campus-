<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Terms | E-Campus</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    color: #172033;
}

.header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 58px; height: 58px; object-fit: contain; background: white; border-radius: 8px; }
.brand h1 { font-size: 24px; }
.brand p { color: #d4af37; margin-top: 4px; }

.back-button {
    background: #d4af37;
    color: #111827;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
}

.container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

.page-title { margin-bottom: 25px; }
.page-title h2 { font-size: 30px; margin-bottom: 7px; }
.page-title p { color: #6b7280; }

.message {
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.message.success { display: block; background: #dcfce7; color: #166534; }
.message.error { display: block; background: #fee2e2; color: #991b1b; }

.card {
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.card h3 { margin-bottom: 6px; font-size: 22px; }
.card .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group { display: flex; flex-direction: column; }
.form-group.full { grid-column: 1 / -1; }

label { font-weight: bold; margin-bottom: 7px; }

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

input:focus, select:focus {
    outline: none;
    border-color: #d4af37;
}

.submit-button {
    margin-top: 20px;
    background: #d4af37;
    color: #111827;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
}

.submit-button:hover { background: #c29d24; }

.term-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
}

.term-item h4 { font-size: 15px; }
.term-item .meta { font-size: 12px; color: #6b7280; margin-top: 4px; }

.status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.status-badge.open { background: #dcfce7; color: #166534; }
.status-badge.closed { background: #f3f4f6; color: #6b7280; }

.action-button {
    border: none;
    padding: 7px 11px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

.open-button { background: #dcfce7; color: #166534; }
.close-button { background: #fee2e2; color: #991b1b; }
.delete-button { background: #fee2e2; color: #991b1b; }

.empty-note { color: #9ca3af; text-align: center; padding: 20px 0; }

@media (max-width: 700px) {
    .header { flex-direction: column; align-items: flex-start; gap: 15px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: auto; }
}

</style>
</head>


<body>


<header class="header">

    <div class="brand">
        <img src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg" alt="Sunningdale University Logo" class="logo">
        <div>
            <h1>E-Campus Administration</h1>
            <p>Sunningdale University</p>
        </div>
    </div>

    <a href="admin-dashboard.html" class="back-button">← Admin Dashboard</a>

</header>


<main class="container">

    <section class="page-title">
        <h2>Academic Terms</h2>
        <p>Create terms and open them for course registration. Students will see courses matching their Programme, Year, and Term.</p>
    </section>

    <div id="message" class="message"></div>


    <section class="card">
        <h3>Create New Term</h3>
        <div class="sub">Example: "2026 Year 1 Term 1"</div>

        <form id="termForm">

            <div class="form-grid">

                <div class="form-group full">
                    <label for="termName">Term Name</label>
                    <input type="text" id="termName" required placeholder="e.g. 2026 Year 1 Term 1">
                </div>

                <div class="form-group">
                    <label for="academicYear">Academic Year</label>
                    <input type="text" id="academicYear" placeholder="e.g. 2026" value="2026">
                </div>

                <div class="form-group">
                    <label for="termNumber">Term Number</label>
                    <select id="termNumber">
                        <option value="1">Term 1</option>
                        <option value="2">Term 2</option>
                        <option value="3">Term 3</option>
                    </select>
                </div>

            </div>

            <button type="submit" class="submit-button" id="submitButton">Create Term</button>

        </form>
    </section>


    <section class="card">
        <h3>All Terms</h3>
        <div id="termsList"><p class="empty-note">Loading...</p></div>
    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>


<script>

const message = document.getElementById("message");


function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


document.getElementById("termForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const submitButton = document.getElementById("submitButton");
    submitButton.disabled = true;
    submitButton.textContent = "Creating...";

    const termNumber = document.getElementById("termNumber").value;
    const academicYear = document.getElementById("academicYear").value.trim() || "2026";

    const { error } =
        await supabaseClient.from("academic_terms").insert({
            name: document.getElementById("termName").value.trim(),
            code: `${academicYear}-T${termNumber}`,
            academic_year: academicYear,
            term_number: Number(termNumber),
            status: "active"
        });

    submitButton.disabled = false;
    submitButton.textContent = "Create Term";

    if (error) {
        showMessage("Unable to create term: " + error.message, "error");
        return;
    }

    showMessage("Term created and opened for registration.", "success");
    document.getElementById("termForm").reset();
    document.getElementById("academicYear").value = "2026";

    await loadTerms();

});


async function loadTerms() {

    const container = document.getElementById("termsList");

    const { data, error } =
        await supabaseClient.from("academic_terms").select("*").order("created_at", { ascending: false });

    if (error) {
        container.innerHTML = `<p class="empty-note">Unable to load: ${escapeHtml(error.message)}</p>`;
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML = `<p class="empty-note">No terms created yet.</p>`;
        return;
    }

    container.innerHTML = data.map(t => {
        const isOpen = t.status === "active";
        return `
            <div class="term-item">
                <div>
                    <h4>${escapeHtml(t.name)}</h4>
                    <div class="meta">Term ${t.term_number} • ${escapeHtml(t.academic_year || "-")} • ${escapeHtml(t.status)}</div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span class="status-badge ${isOpen ? "open" : "closed"}">${isOpen ? "Active" : "Closed"}</span>
                    ${isOpen
                        ? `<button class="action-button close-button" onclick="toggleTerm('${t.id}', 'completed')">Close</button>`
                        : `<button class="action-button open-button" onclick="toggleTerm('${t.id}', 'active')">Reopen</button>`
                    }
                    <button class="action-button delete-button" onclick="deleteTerm('${t.id}')">Delete</button>
                </div>
            </div>
        `;
    }).join("");

}


async function toggleTerm(id, newStatus) {

    const { error } = await supabaseClient.from("academic_terms").update({ status: newStatus }).eq("id", id);

    if (error) {
        showMessage("Unable to update: " + error.message, "error");
        return;
    }

    showMessage(newStatus === "active" ? "Term reopened." : "Term closed.", "success");
    await loadTerms();

}


async function deleteTerm(id) {

    const confirmed = confirm("Delete this term? This may affect existing enrollments tied to it.");
    if (!confirmed) return;

    const { error } = await supabaseClient.from("academic_terms").delete().eq("id", id);

    if (error) {
        showMessage("Unable to delete: " + error.message, "error");
        return;
    }

    showMessage("Term deleted.", "success");
    await loadTerms();

}


loadTerms();

</script>

</body>
</html>
