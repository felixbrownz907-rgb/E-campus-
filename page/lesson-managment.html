<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lesson Management | E-Campus</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #172033;
        }

        /* ================= HEADER ================= */

        .header {
            background: #111827;
            color: white;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .brand h1 {
            font-size: 24px;
        }

        .brand p {
            color: #d4af37;
            margin-top: 4px;
        }

        .back-button {
            background: #d4af37;
            color: #111827;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
        }

        /* ================= MESSAGE ================= */

        .message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        /* ================= CARD ================= */

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.07);
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        .content-area {
            min-height: 220px;
        }

        .submit-button {
            margin-top: 20px;
            background: #d4af37;
            color: #111827;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .submit-button:hover {
            background: #c29d24;
        }

        .cancel-button {
            margin-top: 20px;
            background: #6b7280;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
        }

        .cancel-button:hover {
            background: #4b5563;
        }

        /* ================= TABLE ================= */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ================= ACTIONS ================= */

        .action-button {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-button {
            background: #e5e7eb;
            color: #111827;
        }

        .delete-button {
            background: #fee2e2;
            color: #991b1b;
        }

        .edit-button:hover {
            background: #d1d5db;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .page-title h2 {
                font-size: 25px;
            }

            th,
            td {
                white-space: nowrap;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="brand">

        <img
            src="https://pub-b3e2d39712e84119875e84c5ec5f5c09.r2.dev/Logo/IMG-20260816-WA0050(1).jpg"
            alt="Sunningdale University Logo"
            class="logo"
        >

        <div>

            <h1>
                E-Campus Administration
            </h1>

            <p>
                Sunningdale University
            </p>

        </div>

    </div>


    <a
        href="admin-dashboard.html"
        class="back-button"
    >
        ← Admin Dashboard
    </a>

</header>


<!-- ================= MAIN ================= -->

<main class="container">


    <section class="page-title">

        <h2>
            Lesson Management
        </h2>

        <p>
            Create and manage lessons within course modules.
        </p>

    </section>


    <div
        id="message"
        class="message"
    ></div>


    <!-- ================= ADD / EDIT LESSON ================= -->

    <section class="card">

        <h3 id="formTitle">
            Add New Lesson
        </h3>


        <form id="lessonForm">


            <div class="form-grid">


                <!-- COURSE -->

                <div class="form-group full">

                    <label for="course">
                        Course
                    </label>

                    <select
                        id="course"
                        required
                    >

                        <option value="">
                            Select course
                        </option>

                    </select>

                </div>


                <!-- MODULE -->

                <div class="form-group full">

                    <label for="module">
                        Module
                    </label>

                    <select
                        id="module"
                        required
                        disabled
                    >

                        <option value="">
                            Select course first
                        </option>

                    </select>

                </div>


                <!-- LESSON NUMBER -->

                <div class="form-group">

                    <label for="lessonNumber">
                        Lesson Number
                    </label>

                    <input
                        type="number"
                        id="lessonNumber"
                        min="1"
                        placeholder="e.g. 1"
                        required
                    >

                </div>


                <!-- LESSON TITLE -->

                <div class="form-group">

                    <label for="title">
                        Lesson Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Introduction to Economics"
                        required
                    >

                </div>


                <!-- ESTIMATED HOURS -->

                <div class="form-group">

                    <label for="estimatedHours">
                        Estimated Hours
                    </label>

                    <input
                        type="number"
                        id="estimatedHours"
                        min="0"
                        step="0.5"
                        placeholder="e.g. 2"
                    >

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="active">
                            ACTIVE
                        </option>

                        <option value="inactive">
                            INACTIVE
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group full">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe this lesson..."
                    ></textarea>

                </div>


                <!-- LEARNING OBJECTIVES -->

                <div class="form-group full">

                    <label for="learningObjectives">
                        Learning Objectives
                    </label>

                    <textarea
                        id="learningObjectives"
                        placeholder="Enter the learning objectives for this lesson..."
                    ></textarea>

                </div>


                <!-- CONTENT -->

                <div class="form-group full">

                    <label for="content">
                        Lesson Content
                    </label>

                    <textarea
                        id="content"
                        class="content-area"
                        placeholder="Enter the lesson content here..."
                    ></textarea>

                </div>


            </div>


            <button
                type="submit"
                class="submit-button"
                id="submitButton"
            >
                Add Lesson
            </button>


            <button
                type="button"
                class="cancel-button"
                id="cancelButton"
            >
                Cancel Editing
            </button>


        </form>

    </section>


    <!-- ================= EXISTING LESSONS ================= -->

    <section class="card">

        <h3>
            Existing Lessons
        </h3>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Module
                        </th>

                        <th>
                            Lesson
                        </th>

                        <th>
                            Hours
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="lessonTableBody">

                    <tr>

                        <td colspan="7">
                            Loading lessons...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>


<script>

let editingLessonId = null;


const message =
    document.getElementById("message");


/* ================= MESSAGE ================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* ================= LOAD COURSES ================= */

async function loadCourses() {

    const select =
        document.getElementById("course");


    const { data, error } =
        await supabaseClient
            .from("courses")
            .select("id,code,name")
            .order("code");


    if (error) {

        console.error(error);

        showMessage(
            "Unable to load courses: " +
            error.message,
            "error"
        );

        return;
    }


    select.innerHTML = `
        <option value="">
            Select course
        </option>
    `;


    data.forEach(course => {

        const option =
            document.createElement("option");

        option.value =
            course.id;

        option.textContent =
            `${course.code} — ${course.name}`;

        select.appendChild(option);

    });

}


/* ================= LOAD MODULES BY COURSE ================= */

async function loadModulesByCourse(courseId) {

    const select =
        document.getElementById("module");


    select.innerHTML = `
        <option value="">
            Loading modules...
        </option>
    `;


    select.disabled = true;


    if (!courseId) {

        select.innerHTML = `
            <option value="">
                Select course first
            </option>
        `;

        return;
    }


    const { data, error } =
        await supabaseClient
            .from("course_modules")
            .select(`
                id,
                module_number,
                title
            `)
            .eq(
                "course_id",
                courseId
            )
            .order("module_number");


    if (error) {

        console.error(error);

        select.innerHTML = `
            <option value="">
                Unable to load modules
            </option>
        `;

        showMessage(
            "Unable to load modules: " +
            error.message,
            "error"
        );

        return;
    }


    select.innerHTML = `
        <option value="">
            Select module
        </option>
    `;


    if (!data || data.length === 0) {

        select.innerHTML = `
            <option value="">
                No modules found for this course
            </option>
        `;

        return;
    }


    data.forEach(module => {

        const option =
            document.createElement("option");

        option.value =
            module.id;

        option.textContent =
            `Module ${module.module_number} — ${module.title}`;

        select.appendChild(option);

    });


    select.disabled = false;

}


/* ================= COURSE CHANGE ================= */

document
    .getElementById("course")
    .addEventListener(
        "change",
        async function() {

            await loadModulesByCourse(
                this.value
            );

        }
    );


/* ================= LOAD LESSONS ================= */

async function loadLessons() {

    const tbody =
        document.getElementById(
            "lessonTableBody"
        );


    const { data, error } =
        await supabaseClient
            .from("lessons")
            .select(`
                id,
                module_id,
                lesson_number,
                title,
                description,
                learning_objectives,
                content,
                estimated_hours,
                status,
                course_modules (
                    module_number,
                    title,
                    course_id,
                    courses (
                        code,
                        name
                    )
                )
            `)
            .order(
                "lesson_number"
            );


    if (error) {

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    Unable to load lessons.
                </td>
            </tr>
        `;

        showMessage(
            "Unable to load lessons: " +
            error.message,
            "error"
        );

        return;
    }


    if (!data || data.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7">
                    No lessons have been created yet.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML = "";


    data.forEach(lesson => {

        const row =
            document.createElement("tr");


        const module =
            lesson.course_modules;


        const course =
            module?.courses;


        row.innerHTML = `

            <td>
                ${lesson.lesson_number}
            </td>

            <td>
                ${
                    course
                    ? escapeHtml(
                        course.code +
                        " — " +
                        course.name
                    )
                    : "-"
                }
            </td>

            <td>
                ${
                    module
                    ? escapeHtml(
                        "Module " +
                        module.module_number +
                        " — " +
                        module.title
                    )
                    : "-"
                }
            </td>

            <td>
                ${escapeHtml(lesson.title)}
            </td>

            <td>
                ${lesson.estimated_hours ?? "-"}
            </td>

            <td>

                <span
                    class="status ${
                        lesson.status
                    }"
                >
                    ${escapeHtml(lesson.status)}
                </span>

            </td>

            <td>

                <button
                    class="action-button edit-button"
                    onclick="editLesson('${lesson.id}')"
                >
                    Edit
                </button>

                <button
                    class="action-button delete-button"
                    onclick="deleteLesson('${lesson.id}')"
                >
                    Delete
                </button>

            </td>

        `;


        tbody.appendChild(row);

    });

}


/* ================= ESCAPE HTML ================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ================= ADD / UPDATE LESSON ================= */

document
    .getElementById("lessonForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const module_id =
                document
                    .getElementById("module")
                    .value;


            const lesson_number =
                Number(
                    document
                        .getElementById("lessonNumber")
                        .value
                );


            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();


            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            const learning_objectives =
                document
                    .getElementById("learningObjectives")
                    .value
                    .trim();


            const content =
                document
                    .getElementById("content")
                    .value
                    .trim();


            const estimatedHoursValue =
                document
                    .getElementById("estimatedHours")
                    .value;


            const estimated_hours =
                estimatedHoursValue === ""
                ? null
                : Number(estimatedHoursValue);


            const status =
                document
                    .getElementById("status")
                    .value;


            const lessonData = {

                module_id,

                lesson_number,

                title,

                description:
                    description || null,

                learning_objectives:
                    learning_objectives || null,

                content:
                    content || null,

                estimated_hours,

                status

            };


            let error;


            /* ================= UPDATE ================= */

            if (editingLessonId) {

                const result =
                    await supabaseClient
                        .from("lessons")
                        .update(lessonData)
                        .eq(
                            "id",
                            editingLessonId
                        );


                error = result.error;

            }


            /* ================= INSERT ================= */

            else {

                const result =
                    await supabaseClient
                        .from("lessons")
                        .insert(lessonData);


                error = result.error;

            }


            if (error) {

                console.error(error);

                showMessage(
                    error.message,
                    "error"
                );

                return;

            }


            if (editingLessonId) {

                showMessage(
                    "Lesson updated successfully.",
                    "success"
                );

            } else {

                showMessage(
                    "Lesson created successfully.",
                    "success"
                );

            }


            resetForm();


            await loadLessons();

        }
    );


/* ================= EDIT LESSON ================= */

async function editLesson(id) {

    const { data, error } =
        await supabaseClient
            .from("lessons")
            .select(`
                id,
                module_id,
                lesson_number,
                title,
                description,
                learning_objectives,
                content,
                estimated_hours,
                status,
                course_modules (
                    course_id
                )
            `)
            .eq(
                "id",
                id
            )
            .single();


    if (error) {

        console.error(error);

        showMessage(
            "Unable to load lesson: " +
            error.message,
            "error"
        );

        return;
    }


    editingLessonId =
        data.id;


    const courseId =
        data.course_modules?.course_id;


    document.getElementById("course").value =
        courseId || "";


    await loadModulesByCourse(
        courseId
    );


    document.getElementById("module").value =
        data.module_id;


    document.getElementById("lessonNumber").value =
        data.lesson_number;


    document.getElementById("title").value =
        data.title;


    document.getElementById("estimatedHours").value =
        data.estimated_hours ?? "";


    document.getElementById("status").value =
        data.status;


    document.getElementById("description").value =
        data.description ?? "";


    document.getElementById("learningObjectives").value =
        data.learning_objectives ?? "";


    document.getElementById("content").value =
        data.content ?? "";


    document.getElementById("formTitle").textContent =
        "Edit Lesson";


    document.getElementById("submitButton").textContent =
        "Update Lesson";


    document.getElementById("cancelButton").style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ================= DELETE LESSON ================= */

async function deleteLesson(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this lesson?"
        );


    if (!confirmed) {

        return;

    }


    const { error } =
        await supabaseClient
            .from("lessons")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        showMessage(
            "Unable to delete lesson: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Lesson deleted successfully.",
        "success"
    );


    await loadLessons();

}


/* ================= CANCEL EDITING ================= */

document
    .getElementById("cancelButton")
    .addEventListener(
        "click",
        function() {

            resetForm();

        }
    );


/* ================= RESET FORM ================= */

function resetForm() {

    editingLessonId = null;


    document
        .getElementById("lessonForm")
        .reset();


    document.getElementById("module").innerHTML = `
        <option value="">
            Select course first
        </option>
    `;


    document.getElementById("module").disabled =
        true;


    document.getElementById("formTitle").textContent =
        "Add New Lesson";


    document.getElementById("submitButton").textContent =
        "Add Lesson";


    document.getElementById("cancelButton").style.display =
        "none";

}


/* ================= INITIAL LOAD ================= */

async function startPage() {

    await loadCourses();

    await loadLessons();

}


startPage();

</script>

</body>

</html>
